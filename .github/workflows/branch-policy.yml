name: branch-policy
run-name: branch-policy PR ${{ inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.id }}

on:
  pull_request_target:
    branches:
      - dev
      - master
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
  workflow_run:
    workflows: ["production-build", "source-quality"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to verify its current full-quality proof
        required: true
        type: number

permissions: {}

concurrency:
  group: trusted-branch-policy-publisher-${{ github.event.workflow_run.pull_requests[0].number && format('source-quality PR {0}', github.event.workflow_run.pull_requests[0].number) || github.event.workflow_run.display_title || format('source-quality PR {0}', github.event.pull_request.number || inputs.pr_number) }}
  cancel-in-progress: false

jobs:
  publish-current-pr-snapshot:
    name: publish-current-pr-snapshot
    if: >
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'pull_request_target' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: read
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout trusted policy code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish PR-bound policy and quality statuses
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const publishPolicy = require("./.github/scripts/publish-pr-policy.js");
            await publishPolicy({ github, context, core });
