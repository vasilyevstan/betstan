name: branch-policy
run-name: branch-policy PR ${{ inputs.pr_number || github.event.pull_request.number || github.event.workflow_run.id }}

on:
  pull_request_target:
    branches:
      - dev
      - master
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_run:
    workflows: ["production-build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to refresh after trusted-check bootstrap
        required: true
        type: number

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: trusted-branch-policy-publisher-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  publish-current-pr-snapshot:
    name: publish-current-pr-snapshot
    if: >
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted policy code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish PR-bound policy and quality statuses
        uses: actions/github-script@v7
        with:
          script: |
            const publishPolicy = require("./.github/scripts/publish-pr-policy.js");
            await publishPolicy({ github, context, core });
