name: ci-full-nightly

# Backstop for CI suite selection: every heavy contract suite, unselected.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-contracts:
    name: full-contracts (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [core, live, provenance, rollback, governance, dispatch, azure]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run unselected contract shard
        env:
          SHARD: ${{ matrix.shard }}
        run: ./infra/ci/run-full-contracts.sh "$SHARD"
