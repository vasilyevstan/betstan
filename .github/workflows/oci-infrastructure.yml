name: oci-infrastructure
run-name: oci-infrastructure ${{ inputs.phase }} ${{ inputs.approved_sha }}

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current master SHA approved for OCI infrastructure reconciliation
        required: true
        type: string
      confirmation:
        description: Type the exact confirmation required by the selected phase
        required: true
        type: string
      phase:
        description: Prepare/finalize zero-cost infrastructure or prune one obsolete image generation
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - finalize
          - prune-registry
      candidate_build_run_id:
        description: Current-master OCI build run protected during registry pruning
        required: false
        default: ""
        type: string
      obsolete_sha:
        description: Obsolete source SHA whose complete image generation may be pruned
        required: false
        default: ""
        type: string
      obsolete_build_run_id:
        description: First-attempt OCI build provenance for the obsolete generation
        required: false
        default: ""
        type: string
      deployed_sha:
        description: Currently deployed source SHA protected during registry pruning
        required: false
        default: ""
        type: string
      deployed_run_id:
        description: Successful OCI deployment provenance for the deployed SHA
        required: false
        default: ""
        type: string
      fallback_sha:
        description: Compatible fallback source SHA protected during registry pruning
        required: false
        default: ""
        type: string
      fallback_build_run_id:
        description: First-attempt OCI build provenance for the fallback SHA
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: oci-control-plane
  cancel-in-progress: false

jobs:
  prune-registry:
    if: github.run_attempt == 1 && inputs.phase == 'prune-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: oci-infrastructure
    env:
      SOURCE_SHA: ${{ inputs.approved_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CANDIDATE_BUILD_RUN_ID: ${{ inputs.candidate_build_run_id }}
      OBSOLETE_SHA: ${{ inputs.obsolete_sha }}
      OBSOLETE_BUILD_RUN_ID: ${{ inputs.obsolete_build_run_id }}
      DEPLOYED_SHA: ${{ inputs.deployed_sha }}
      DEPLOYED_RUN_ID: ${{ inputs.deployed_run_id }}
      FALLBACK_SHA: ${{ inputs.fallback_sha }}
      FALLBACK_BUILD_RUN_ID: ${{ inputs.fallback_build_run_id }}
      OCI_CLI_VERSION: "3.90.0"
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_REGISTRY_HOST: ${{ vars.OCI_REGISTRY_HOST }}
      OCI_REGISTRY_NAMESPACE: ${{ vars.OCI_REGISTRY_NAMESPACE }}
      OCI_IMAGE_PREFIX: ${{ vars.OCI_IMAGE_PREFIX }}
      OCI_REGISTRY_MAX_BYTES: ${{ vars.OCI_REGISTRY_MAX_BYTES || '500000000' }}
      PROVENANCE_DIR: artifacts/oci-registry-prune

    steps:
      - name: Initialize isolated OCI paths
        run: |
          {
            echo "HOME=$RUNNER_TEMP/oci-registry-prune-home"
            echo "WORK_DIR=$RUNNER_TEMP/oci-registry-prune-work"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/oci-registry-prune-home/.local/bin" >> "$GITHUB_PATH"
          mkdir -p \
            "$RUNNER_TEMP/oci-registry-prune-home" \
            "$RUNNER_TEMP/oci-registry-prune-work" \
            "$PROVENANCE_DIR"
          chmod 700 \
            "$RUNNER_TEMP/oci-registry-prune-home" \
            "$RUNNER_TEMP/oci-registry-prune-work"
          printf '%s\n' \
            "source_sha=$SOURCE_SHA" \
            "candidate_build_run_id=$CANDIDATE_BUILD_RUN_ID" \
            "obsolete_sha=$OBSOLETE_SHA" \
            "obsolete_build_run_id=$OBSOLETE_BUILD_RUN_ID" \
            "deployed_sha=$DEPLOYED_SHA" \
            "deployed_run_id=$DEPLOYED_RUN_ID" \
            "fallback_sha=$FALLBACK_SHA" \
            "fallback_build_run_id=$FALLBACK_BUILD_RUN_ID" \
            "workflow_run_id=$GITHUB_RUN_ID" \
            "workflow_run_attempt=$GITHUB_RUN_ATTEMPT" \
            > "$PROVENANCE_DIR/dispatch.env"

      - name: Checkout exact current master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0

      - name: Validate exact registry prune request
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "master" ]
          [ "$CONFIRMATION" = "PRUNE OBSOLETE OCI IMAGE GENERATION" ]
          for sha in \
            "$SOURCE_SHA" "$OBSOLETE_SHA" "$DEPLOYED_SHA" "$FALLBACK_SHA"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "${sha}^{commit}"
          done
          for run_id in \
            "$CANDIDATE_BUILD_RUN_ID" "$OBSOLETE_BUILD_RUN_ID" \
            "$DEPLOYED_RUN_ID" "$FALLBACK_BUILD_RUN_ID"; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          done
          [ "$GITHUB_RUN_ATTEMPT" = "1" ]
          [ "$SOURCE_SHA" = "$GITHUB_SHA" ]
          [ "$SOURCE_SHA" = "$(git rev-parse HEAD)" ]
          git fetch --quiet origin master:refs/remotes/origin/master
          [ "$SOURCE_SHA" = "$(git rev-parse origin/master)" ]
          [ "$OBSOLETE_SHA" != "$SOURCE_SHA" ]
          [ "$OBSOLETE_SHA" != "$DEPLOYED_SHA" ]
          [ "$OBSOLETE_SHA" != "$FALLBACK_SHA" ]
          [ "$DEPLOYED_SHA" != "$FALLBACK_SHA" ]
          for ancestor in "$OBSOLETE_SHA" "$DEPLOYED_SHA" "$FALLBACK_SHA"; do
            git merge-base --is-ancestor "$ancestor" "$SOURCE_SHA"
          done

      - name: Download and validate protected image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          validate_run() {
            local workflow_file="$1"
            local run_id="$2"
            local event="$3"
            local expected_sha="$4"
            local workflow_id
            local run_json
            workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/$workflow_file" \
                --jq '.id'
            )"
            run_json="$(
              gh api "repos/$REPOSITORY/actions/runs/$run_id/attempts/1"
            )"
            jq -e \
              --argjson workflow_id "$workflow_id" \
              --arg workflow_path ".github/workflows/$workflow_file" \
              --arg event "$event" \
              --arg sha "$expected_sha" \
              --arg repository "$REPOSITORY" '
                .workflow_id == $workflow_id and
                .path == $workflow_path and
                .event == $event and
                .head_sha == $sha and
                .head_branch == "master" and
                .head_repository.full_name == $repository and
                .status == "completed" and
                .conclusion == "success" and
                .run_attempt == 1
              ' <<<"$run_json" >/dev/null
          }
          download_artifact() {
            local run_id="$1"
            local artifact_name="$2"
            local destination="$3"
            local artifact_count
            artifact_count="$(
              gh api \
                "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(
                  .name == \"$artifact_name\" and .expired == false
                )] | length"
            )"
            [ "$artifact_count" = "1" ]
            mkdir -p "$destination"
            gh run download "$run_id" \
              --name "$artifact_name" \
              --dir "$destination"
          }

          validate_run \
            oci-production-build.yml \
            "$CANDIDATE_BUILD_RUN_ID" workflow_run "$SOURCE_SHA"
          validate_run \
            oci-production-build.yml \
            "$OBSOLETE_BUILD_RUN_ID" workflow_run "$OBSOLETE_SHA"
          validate_run \
            oci-production-deploy.yml \
            "$DEPLOYED_RUN_ID" workflow_dispatch "$DEPLOYED_SHA"
          validate_run \
            oci-production-build.yml \
            "$FALLBACK_BUILD_RUN_ID" workflow_run "$FALLBACK_SHA"

          download_artifact \
            "$CANDIDATE_BUILD_RUN_ID" \
            "oci-image-provenance-${SOURCE_SHA}-${CANDIDATE_BUILD_RUN_ID}-1" \
            "$WORK_DIR/candidate"
          download_artifact \
            "$OBSOLETE_BUILD_RUN_ID" \
            "oci-image-provenance-${OBSOLETE_SHA}-${OBSOLETE_BUILD_RUN_ID}-1" \
            "$WORK_DIR/obsolete"
          download_artifact \
            "$DEPLOYED_RUN_ID" \
            "oci-deploy-provenance-${DEPLOYED_RUN_ID}-1" \
            "$WORK_DIR/deployed"
          download_artifact \
            "$FALLBACK_BUILD_RUN_ID" \
            "oci-image-provenance-${FALLBACK_SHA}-${FALLBACK_BUILD_RUN_ID}-1" \
            "$WORK_DIR/fallback"

          for pair in \
            "candidate:$SOURCE_SHA:$CANDIDATE_BUILD_RUN_ID" \
            "obsolete:$OBSOLETE_SHA:$OBSOLETE_BUILD_RUN_ID" \
            "fallback:$FALLBACK_SHA:$FALLBACK_BUILD_RUN_ID"; do
            IFS=: read -r directory expected_sha expected_run_id <<<"$pair"
            grep -Fxq "source_sha=$expected_sha" \
              "$WORK_DIR/$directory/build-chain.txt"
            grep -Fxq "build_run_id=$expected_run_id" \
              "$WORK_DIR/$directory/build-chain.txt"
            grep -Fxq "build_run_attempt=1" \
              "$WORK_DIR/$directory/build-chain.txt"
            test -s "$WORK_DIR/$directory/images.tsv"
          done
          for pair in "deployed:$DEPLOYED_SHA:$DEPLOYED_RUN_ID"; do
            IFS=: read -r directory expected_sha expected_run_id <<<"$pair"
            grep -Fxq "source_sha=$expected_sha" \
              "$WORK_DIR/$directory/provenance.txt"
            grep -Fxq "deployment_run_id=$expected_run_id" \
              "$WORK_DIR/$directory/provenance.txt"
            grep -Fxq "deployment_run_attempt=1" \
              "$WORK_DIR/$directory/provenance.txt"
            test -s "$WORK_DIR/$directory/images.tsv"
          done

          cp "$WORK_DIR/obsolete/images.tsv" "$PROVENANCE_DIR/obsolete.tsv"
          cat \
            "$WORK_DIR/candidate/images.tsv" \
            "$WORK_DIR/deployed/images.tsv" \
            "$WORK_DIR/fallback/images.tsv" \
            > "$PROVENANCE_DIR/protected.tsv"

      - name: Install pinned OCI CLI and verify identity
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_HOME_REGION_QUERY: 'data[?"is-home-region" == `true`]."region-name" | [0]'
        run: |
          set -euo pipefail
          ./infra/oci/scripts/install-cli.sh
          home_region="$(
            oci iam region-subscription list \
              --tenancy-id "$OCI_CLI_TENANCY" \
              --query "$OCI_HOME_REGION_QUERY" \
              --raw-output
          )"
          [ "$home_region" = "$OCI_CLI_REGION" ]

      - name: Prune only the obsolete complete generation
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          TARGET_IMAGES_FILE: artifacts/oci-registry-prune/obsolete.tsv
          PROTECTED_IMAGES_FILE: artifacts/oci-registry-prune/protected.tsv
          TARGET_SOURCE_SHA: ${{ inputs.obsolete_sha }}
          CURRENT_SOURCE_SHA: ${{ inputs.approved_sha }}
          OUTPUT_DIR: artifacts/oci-registry-prune
        run: ./infra/oci/scripts/prune-registry-generation.sh

      - name: Record registry prune provenance
        run: |
          set -euo pipefail
          test -s "$PROVENANCE_DIR/after-summary.json"
          jq -e \
            --arg obsolete_sha "$OBSOLETE_SHA" \
            --arg source_sha "$SOURCE_SHA" '
              .target_source_sha == $obsolete_sha and
              .current_source_sha == $source_sha and
              .terminal_status == "PRUNED" and
              .unique_images == 27
            ' "$PROVENANCE_DIR/after-summary.json" >/dev/null
          printf '%s\n' \
            "source_sha=$SOURCE_SHA" \
            "candidate_build_run_id=$CANDIDATE_BUILD_RUN_ID" \
            "obsolete_sha=$OBSOLETE_SHA" \
            "obsolete_build_run_id=$OBSOLETE_BUILD_RUN_ID" \
            "deployed_sha=$DEPLOYED_SHA" \
            "deployed_run_id=$DEPLOYED_RUN_ID" \
            "fallback_sha=$FALLBACK_SHA" \
            "fallback_build_run_id=$FALLBACK_BUILD_RUN_ID" \
            "workflow_run_id=$GITHUB_RUN_ID" \
            "workflow_run_attempt=$GITHUB_RUN_ATTEMPT" \
            "terminal_status=PRUNED" \
            > "$PROVENANCE_DIR/provenance.env"

      - name: Upload registry prune evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-registry-prune-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oci-registry-prune
          if-no-files-found: error
          retention-days: 30

      - name: Remove isolated OCI client state
        if: always()
        run: rm -rf "$HOME" "$WORK_DIR"

  provision:
    if: github.run_attempt == 1 && inputs.phase != 'prune-registry'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: oci-infrastructure
    env:
      SOURCE_SHA: ${{ inputs.approved_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      OCI_RUNTIME_MODE: ${{ vars.OCI_RUNTIME_MODE }}
      OCI_CLI_VERSION: "3.90.0"
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_CI_USER_OCID: ${{ vars.OCI_CI_USER_OCID }}
      OCI_CI_KEY_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_COMPARTMENT_NAME: ${{ vars.OCI_COMPARTMENT_NAME }}
      OCI_AVAILABILITY_DOMAIN: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
      OCI_CLUSTER_NAME: ${{ vars.OCI_CLUSTER_NAME }}
      OCI_NODE_POOL_NAME: ${{ vars.OCI_NODE_POOL_NAME }}
      OCI_VCN_NAME: ${{ vars.OCI_VCN_NAME }}
      OCI_K8S_NAMESPACE: ${{ vars.OCI_K8S_NAMESPACE }}
      OCI_KUBERNETES_VERSION: ${{ vars.OCI_KUBERNETES_VERSION }}
      OCI_NODE_IMAGE_OCID: ${{ vars.OCI_NODE_IMAGE_OCID }}
      OCI_K3S_IMAGE_OCID: ${{ vars.OCI_K3S_IMAGE_OCID }}
      OCI_K3S_VERSION: ${{ vars.OCI_K3S_VERSION }}
      OCI_K3S_BINARY_SHA256: ${{ vars.OCI_K3S_BINARY_SHA256 }}
      OCI_K3S_NODE_NAME: ${{ vars.OCI_K3S_NODE_NAME || 'betstan-k3s' }}
      OCI_BASTION_NAME: ${{ vars.OCI_BASTION_NAME || 'betstan-oke-bastion' }}
      OCI_BASTION_DEFAULT_CLIENT_CIDR: 192.0.2.1/32
      OCI_BASTION_MAX_SESSION_TTL: "10800"
      OCI_NODE_SHAPE: VM.Standard.A1.Flex
      OCI_IMAGE_PREFIX: ${{ vars.OCI_IMAGE_PREFIX }}
      OCI_VCN_CIDR: ${{ vars.OCI_VCN_CIDR || '10.42.0.0/16' }}
      OCI_WORKER_SUBNET_CIDR: ${{ vars.OCI_WORKER_SUBNET_CIDR || '10.42.16.0/20' }}
      OCI_LB_SUBNET_CIDR: ${{ vars.OCI_LB_SUBNET_CIDR || '10.42.32.0/24' }}
      OCI_PODS_CIDR: ${{ vars.OCI_PODS_CIDR || '10.244.0.0/16' }}
      OCI_SERVICES_CIDR: ${{ vars.OCI_SERVICES_CIDR || '10.96.0.0/16' }}
      OCI_LB_NAME: ${{ vars.OCI_LB_NAME || 'betstan-oci-ingress' }}
      OCI_A1_OCPUS: ${{ vars.OCI_A1_OCPUS }}
      OCI_A1_MEMORY_GB: ${{ vars.OCI_A1_MEMORY_GB }}
      OCI_BOOT_VOLUME_GB: ${{ vars.OCI_BOOT_VOLUME_GB }}
      OCI_MONGO_VOLUME_GB: ${{ vars.OCI_MONGO_VOLUME_GB }}
      OCI_LB_MIN_MBPS: ${{ vars.OCI_LB_MIN_MBPS }}
      OCI_LB_MAX_MBPS: ${{ vars.OCI_LB_MAX_MBPS }}
      OCI_EXPECTED_MONTHLY_COST: ${{ vars.OCI_EXPECTED_MONTHLY_COST }}
      OCI_CANONICAL_HOST: ${{ vars.OCI_CANONICAL_HOST || 'betstan.xyz' }}
      OCI_REDIRECT_HOST: ${{ vars.OCI_REDIRECT_HOST || 'www.betstan.xyz' }}
      OCI_REGISTRY_MAX_BYTES: ${{ vars.OCI_REGISTRY_MAX_BYTES || '500000000' }}
      OCI_MEMORY_MAX_PERCENT: ${{ vars.OCI_MEMORY_MAX_PERCENT }}
      OCI_DISK_MAX_PERCENT: ${{ vars.OCI_DISK_MAX_PERCENT }}
      OCI_INGRESS_NGINX_CHART_VERSION: ${{ vars.OCI_INGRESS_NGINX_CHART_VERSION || '4.15.1' }}
      OCI_INGRESS_NGINX_CHART_SHA256: ${{ vars.OCI_INGRESS_NGINX_CHART_SHA256 || '3eff0bd18151d6e6b1c441463410571443dda1ac78292cb189346628de784f0c' }}
      OCI_CERT_MANAGER_CHART_VERSION: ${{ vars.OCI_CERT_MANAGER_CHART_VERSION || 'v1.21.1' }}
      OCI_CERT_MANAGER_CHART_SHA256: ${{ vars.OCI_CERT_MANAGER_CHART_SHA256 || 'c27101f3f3e2349fb4a9e704316105bf7b52ad73b8c8257d3498ef7f2f6a4adc' }}
      OCI_CERT_MANAGER_CONTROLLER_DIGEST: ${{ vars.OCI_CERT_MANAGER_CONTROLLER_DIGEST || 'sha256:416a2d76870d996460e62bd7f521bf14fa017be9e3e904aab92163a331fcb61a' }}
      OCI_CERT_MANAGER_WEBHOOK_DIGEST: ${{ vars.OCI_CERT_MANAGER_WEBHOOK_DIGEST || 'sha256:d8b3961b51c8c7320633f8208dc46bf88aa13804d0f7cbe48a096b2c523cee42' }}
      OCI_CERT_MANAGER_CAINJECTOR_DIGEST: ${{ vars.OCI_CERT_MANAGER_CAINJECTOR_DIGEST || 'sha256:ccf6b919ec0500745a47a910118f834f9636d0aac1ff221245cd2557ed8c7c98' }}
      OCI_CERT_MANAGER_ACMESOLVER_DIGEST: ${{ vars.OCI_CERT_MANAGER_ACMESOLVER_DIGEST || 'sha256:dbc7cc1354f603918e7c5af7f55a0a620537394452c93a565bde75c6f48e8837' }}
      OCI_CERT_MANAGER_STARTUP_DIGEST: ${{ vars.OCI_CERT_MANAGER_STARTUP_DIGEST || 'sha256:d8ab6416e6e7303a86fa0a8daa82c94a8001f21c9d78eb2e7db20534e5d07ae8' }}
      PROVENANCE_DIR: artifacts/oci-infrastructure

    steps:
      - name: Initialize isolated OCI paths
        run: |
          {
            echo "HOME=$RUNNER_TEMP/oci-home"
            echo "KUBECONFIG=$RUNNER_TEMP/oci-home/.kube/config"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/oci-home/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/oci-home/.kube"
          chmod 700 "$RUNNER_TEMP/oci-home" "$RUNNER_TEMP/oci-home/.kube"

      - name: Checkout approved master commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0

      - name: Validate exact current master dispatch
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "master" ]
          [ "$CONFIRMATION" = "PROVISION OCI ZERO COST" ]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --quiet origin master:refs/remotes/origin/master
          [ "$SOURCE_SHA" = "$GITHUB_SHA" ]
          [ "$SOURCE_SHA" = "$(git rev-parse origin/master)" ]
          [ "$GITHUB_RUN_ATTEMPT" = "1" ]
          mkdir -p "$HOME/.kube"
          chmod 700 "$HOME" "$HOME/.kube"

      - name: Install pinned OCI CLI and verify identity
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_HOME_REGION_QUERY: 'data[?"is-home-region" == `true`]."region-name" | [0]'
        run: |
          set -euo pipefail
          ./infra/oci/scripts/install-cli.sh
          home_region="$(
            oci iam region-subscription list \
              --tenancy-id "$OCI_CLI_TENANCY" \
              --query "$OCI_HOME_REGION_QUERY" \
              --raw-output
          )"
          [ "$home_region" = "$OCI_CLI_REGION" ]

      - name: Zero-cost preflight and cloud reconciliation
        id: cloud
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
        run: |
          set -euo pipefail
          ./infra/oci/scripts/preflight.sh
          ./infra/oci/scripts/provision.sh cloud
          source artifacts/oci-infrastructure/provenance.env
          if [ "$runtime_mode" = "oke" ]; then
            echo "::add-mask::$cluster_ocid"
            echo "::add-mask::$endpoint_nsg_ocid"
            printf 'cluster_ocid=%s\n' "$cluster_ocid" >> "$GITHUB_OUTPUT"
            printf 'endpoint_nsg_ocid=%s\n' "$endpoint_nsg_ocid" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$bastion_ocid"
            printf 'bastion_ocid=%s\n' "$bastion_ocid" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile expired GitHub runner rules
        if: inputs.phase == 'finalize' && env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_ENDPOINT_NSG_OCID: ${{ steps.cloud.outputs.endpoint_nsg_ocid }}
        run: ./infra/oci/scripts/authorize-github-runner.sh cleanup-stale

      - name: Authorize current runner IPv4
        if: inputs.phase == 'finalize' && env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_ENDPOINT_NSG_OCID: ${{ steps.cloud.outputs.endpoint_nsg_ocid }}
          RULE_STATE_FILE: artifacts/oci-infrastructure/runner-rule.env
        run: |
          set -euo pipefail
          RUNNER_PUBLIC_IPV4="$(curl --fail --silent --show-error --max-time 15 https://api.ipify.org)"
          export RUNNER_PUBLIC_IPV4
          ./infra/oci/scripts/authorize-github-runner.sh authorize

      - name: Configure kubectl from exact cluster OCID
        if: inputs.phase == 'finalize' && env.OCI_RUNTIME_MODE == 'oke'
        uses: oracle-actions/configure-kubectl-oke@77a733d79446dabe7bf0e58eb56197d33ce4dc58 # v1.5.0
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
        with:
          cluster: ${{ steps.cloud.outputs.cluster_ocid }}

      - name: Install pinned cluster add-ons and verify 10 Mbps load balancer
        if: inputs.phase == 'finalize' && env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
        run: ./infra/oci/scripts/provision.sh addons

      - name: Download trusted k3s acquisition provenance
        if: inputs.phase == 'finalize' && env.OCI_RUNTIME_MODE == 'k3s'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/oci-capacity
          found=false
          while IFS= read -r run_id; do
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            jq -e \
              --arg sha "$SOURCE_SHA" \
              '.head_sha == $sha and
               .run_attempt == 1 and
               .status == "completed" and
               .conclusion == "success" and
               (.event == "schedule" or .event == "workflow_dispatch") and
               .path == ".github/workflows/oci-capacity-acquire.yml"' \
              <<<"$run_json" >/dev/null || continue
            artifact_name="oci-capacity-provenance-${run_id}-1"
            artifact_count="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
                --jq "[.artifacts[] | select(
                  .name == \"$artifact_name\" and .expired == false
                )] | length"
            )"
            [ "$artifact_count" = "1" ] || continue
            gh run download "$run_id" \
              --name "$artifact_name" \
              --dir artifacts/oci-capacity
            found=true
            break
          done < <(
            gh run list \
              --workflow oci-capacity-acquire.yml \
              --branch master \
              --status success \
              --limit 100 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | .databaseId"
          )
          [ "$found" = true ]
          test -s artifacts/oci-capacity/provenance.env
          source artifacts/oci-capacity/provenance.env
          [ "$source_sha" = "$SOURCE_SHA" ]
          [ "$runtime_mode" = "k3s" ]
          [ "$shape" = "VM.Standard.A1.Flex" ]
          [ "$ocpus" = "2" ]
          [ "$memory_gb" = "12" ]
          [ "$boot_volume_gb" = "50" ]
          [ "$boot_volume_vpus_per_gb" = "10" ]

      - name: Open ephemeral OCI Bastion access and finalize k3s
        if: inputs.phase == 'finalize' && env.OCI_RUNTIME_MODE == 'k3s'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_K3S_SSH_PRIVATE_KEY: ${{ secrets.OCI_K3S_SSH_PRIVATE_KEY }}
          OCI_K3S_RETAIN_TARGET_SSH: "true"
          INFRA_PROVENANCE_FILE: artifacts/oci-infrastructure/provenance.env
          NETWORK_PROVENANCE_FILE: artifacts/oci-infrastructure/provenance.env
          ACQUISITION_PROVENANCE_FILE: artifacts/oci-capacity/provenance.env
          SESSION_STATE_FILE: artifacts/oci-infrastructure/k3s-access.env
          K3S_ACCESS_STATE_FILE: artifacts/oci-infrastructure/k3s-access.env
          WORK_DIR: ${{ runner.temp }}/betstan-k3s-access
        run: |
          set -euo pipefail
          cleanup_on_exit() {
            status=$?
            trap - EXIT
            set +e
            ./infra/oci/scripts/configure-k3s-access.sh cleanup
            cleanup_status=$?
            if [ "$status" -eq 0 ] && [ "$cleanup_status" -ne 0 ]; then
              status=$cleanup_status
            fi
            exit "$status"
          }
          trap cleanup_on_exit EXIT
          RUNNER_PUBLIC_IPV4="$(
            curl --fail --silent --show-error --max-time 15 https://api.ipify.org
          )"
          export RUNNER_PUBLIC_IPV4
          ./infra/oci/scripts/configure-k3s-access.sh open
          unset OCI_K3S_SSH_PRIVATE_KEY
          ./infra/oci/scripts/finalize-k3s.sh

      - name: Close ephemeral OCI Bastion access
        if: always() && inputs.phase == 'finalize' && env.OCI_RUNTIME_MODE == 'k3s'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          SESSION_STATE_FILE: artifacts/oci-infrastructure/k3s-access.env
          WORK_DIR: ${{ runner.temp }}/betstan-k3s-access
        run: ./infra/oci/scripts/configure-k3s-access.sh cleanup

      - name: Upload exact infrastructure provenance and sanitized inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-infrastructure-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/oci-infrastructure/provenance.env
            artifacts/oci-infrastructure/inventory.json
          if-no-files-found: error
          retention-days: 30

      - name: Revoke exact runner rule
        if: always() && inputs.phase == 'finalize' && env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          RULE_STATE_FILE: artifacts/oci-infrastructure/runner-rule.env
        run: |
          if [ -f "$RULE_STATE_FILE" ]; then
            ./infra/oci/scripts/revoke-github-runner.sh "$RULE_STATE_FILE"
          fi

      - name: Remove isolated OCI client state
        if: always()
        run: rm -rf "$HOME"
