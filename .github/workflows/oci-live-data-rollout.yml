name: oci-live-data-rollout
run-name: oci-live-data ${{ inputs.phase }} ${{ inputs.approved_sha }}

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current master SHA approved for the live-betting data phase
        required: true
        type: string
      resume_source_sha:
        description: Exact source SHA of the predecessor and failed runs; current SHA for fresh phases
        required: true
        type: string
      build_run_id:
        description: Successful first-attempt oci-production-build run ID
        required: true
        type: string
      infrastructure_run_id:
        description: Successful first-attempt finalized oci-infrastructure run ID
        required: true
        type: string
      checkpoint_source_sha:
        description: Exact source SHA of the release disk checkpoint
        required: true
        type: string
      disk_checkpoint_run_id:
        description: Successful first-attempt release disk checkpoint producer run ID
        required: true
        type: string
      phase:
        description: Read, backfill, or create and verify the Slip index
        required: true
        type: choice
        options:
          - dry-run
          - apply-backfills
          - apply-slip-index
      prerequisite_run_id:
        description: Prior successful phase run ID, or 0 for dry-run
        required: true
        default: "0"
        type: string
      baseline_recovery_run_id:
        description: Exact first-attempt cache or partial-rollback recovery authorizing the live GHCR baseline, or 0
        required: true
        default: "0"
        type: string
      baseline_recovery_source_sha:
        description: Exact historical source restored by the selected recovery, or none
        required: true
        default: none
        type: string
      failed_deploy_run_id:
        description: Failed dark deploy to resume after data was already applied, or 0
        required: true
        default: "0"
        type: string
      failed_activation_run_id:
        description: Failed live activation that left exact synthetic Slip data, or 0
        required: true
        default: "0"
        type: string
      failed_activation_user_id:
        description: Exact synthetic user ID from that failed activation, or 0
        required: true
        default: "0"
        type: string
      held_handoff_run_id:
        description: Exact successful held handoff to continue, or 0 for every other operation
        required: true
        default: "0"
        type: string
      held_handoff_source_sha:
        description: Source of that successful held handoff, or none
        required: true
        default: none
        type: string
      confirmation:
        description: Type the exact confirmation phrase for the selected phase
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: oci-control-plane
  cancel-in-progress: false

jobs:
  rollout:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: oci-migration
    env:
      SOURCE_SHA: ${{ inputs.approved_sha }}
      RESUME_SOURCE_SHA: ${{ inputs.resume_source_sha }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      INFRASTRUCTURE_RUN_ID: ${{ inputs.infrastructure_run_id }}
      CHECKPOINT_SOURCE_SHA: ${{ inputs.checkpoint_source_sha }}
      DISK_CHECKPOINT_RUN_ID: ${{ inputs.disk_checkpoint_run_id }}
      PHASE: ${{ inputs.phase }}
      PREREQUISITE_RUN_ID: ${{ inputs.prerequisite_run_id }}
      BASELINE_RECOVERY_RUN_ID: ${{ inputs.baseline_recovery_run_id }}
      BASELINE_RECOVERY_SOURCE_SHA: ${{ inputs.baseline_recovery_source_sha }}
      FAILED_DEPLOY_RUN_ID: ${{ inputs.failed_deploy_run_id }}
      FAILED_ACTIVATION_RUN_ID: ${{ inputs.failed_activation_run_id }}
      FAILED_ACTIVATION_USER_ID: ${{ inputs.failed_activation_user_id }}
      HELD_HANDOFF_RUN_ID: ${{ inputs.held_handoff_run_id }}
      HELD_HANDOFF_SOURCE_SHA: ${{ inputs.held_handoff_source_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      DISPATCH_INPUTS: ${{ toJSON(inputs) }}
      OCI_RUNTIME_MODE: ${{ vars.OCI_RUNTIME_MODE }}
      OCI_CLI_VERSION: "3.90.0"
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_CI_USER_OCID: ${{ vars.OCI_CI_USER_OCID }}
      OCI_CI_KEY_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_AVAILABILITY_DOMAIN: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
      OCI_K8S_NAMESPACE: ${{ vars.OCI_K8S_NAMESPACE }}
      OCI_K3S_NODE_NAME: ${{ vars.OCI_K3S_NODE_NAME || 'betstan-k3s' }}
      OCI_BASTION_DEFAULT_CLIENT_CIDR: 192.0.2.1/32
      APPLICATION_REGISTRY_PROVIDER: ghcr
      APPLICATION_REGISTRY_HOST: ghcr.io
      APPLICATION_REGISTRY_REPOSITORY: vasilyevstan/betstan-images
      APPLICATION_REGISTRY_TAG_PREFIX: arm64
      APPLICATION_REGISTRY_TAG_SCHEMA: v1
      OCI_MEMORY_MAX_PERCENT: ${{ vars.OCI_MEMORY_MAX_PERCENT }}
      OCI_DISK_MAX_PERCENT: ${{ vars.OCI_DISK_MAX_PERCENT }}
      OCI_CPU_MAX_PERCENT: "90"
      SHARED_MONGO_LOCK_TOKEN: live-data-${{ github.run_id }}-${{ github.run_attempt }}
      SHARED_MONGO_LOCK_OPERATION: live-data-${{ inputs.phase }}
      SHARED_MONGO_LOCK_LEASE_SECONDS: "14400"
      SHARED_MONGO_HANDOFF_LOCK_LEASE_SECONDS: ${{ inputs.held_handoff_run_id != '0' && inputs.held_handoff_run_id != '' && '7200' || '1800' }}

    steps:
      - name: Initialize isolated OCI data paths
        run: |
          {
            echo "HOME=$RUNNER_TEMP/oci-home"
            echo "KUBECONFIG=$RUNNER_TEMP/oci-home/.kube/config"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/oci-home/.local/bin" >> "$GITHUB_PATH"
          mkdir -p \
            "$RUNNER_TEMP/oci-home/.kube" \
            artifacts/build \
            artifacts/infrastructure \
            artifacts/disk-checkpoint \
            artifacts/prerequisite \
            artifacts/recovery \
            artifacts/resume-build \
            artifacts/oci-live-data-rollout \
            artifacts/oci-data-baseline-before \
            artifacts/oci-data-baseline-after
          chmod 700 "$RUNNER_TEMP/oci-home" "$RUNNER_TEMP/oci-home/.kube"

      - name: Checkout approved current master commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0

      - name: Validate exact SHA phase and trusted upstream runs
        id: provenance_request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "master" ]
          [ "$GITHUB_RUN_ATTEMPT" = "1" ]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RESUME_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$INFRASTRUCTURE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CHECKPOINT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DISK_CHECKPOINT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BASELINE_RECOVERY_RUN_ID" == "0" ||
             "$BASELINE_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [ "$BASELINE_RECOVERY_RUN_ID" = "0" ]; then
            [ "$BASELINE_RECOVERY_SOURCE_SHA" = "none" ]
          else
            [[ "$BASELINE_RECOVERY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
          [[ "$FAILED_DEPLOY_RUN_ID" == "0" ||
             "$FAILED_DEPLOY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_ACTIVATION_RUN_ID" == "0" ||
             "$FAILED_ACTIVATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [ "$FAILED_ACTIVATION_RUN_ID" = "0" ]; then
            [ "$FAILED_ACTIVATION_USER_ID" = "0" ]
          elif [ "$CONFIRMATION" = "RESUME APPLIED LIVE DATA FROM RELEASED RUNTIME AND CLEAN FAILED ACTIVATION EXACT SHA" ]; then
            [[ "$FAILED_ACTIVATION_USER_ID" = "0" ||
               "$FAILED_ACTIVATION_USER_ID" =~ ^[0-9a-f]{24}$ ]] || exit 1
          else
            [[ "$FAILED_ACTIVATION_USER_ID" =~ ^[0-9a-f]{24}$ ]]
          fi
          if [ "$CONFIRMATION" = "CONTINUE SUCCESSFUL HELD LIVE DATA EXACT SHA" ]; then
            [[ "$HELD_HANDOFF_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$HELD_HANDOFF_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [ "$PHASE" = "apply-slip-index" ]
            [ "$FAILED_DEPLOY_RUN_ID" != "0" ]
            [ "$FAILED_ACTIVATION_RUN_ID" = "0" ]
          else
            [ "$HELD_HANDOFF_RUN_ID" = "0" ]
            [ "$HELD_HANDOFF_SOURCE_SHA" = "none" ]
          fi
          case "$PHASE" in
            dry-run)
              [ "$CONFIRMATION" = "DRY RUN LIVE DATA EXACT SHA" ]
              [ "$PREREQUISITE_RUN_ID" = "0" ]
              [ "$FAILED_DEPLOY_RUN_ID" = "0" ]
              [ "$FAILED_ACTIVATION_RUN_ID" = "0" ]
              [ "$RESUME_SOURCE_SHA" = "$SOURCE_SHA" ]
              [ "$CHECKPOINT_SOURCE_SHA" = "$SOURCE_SHA" ]
              protected_operation=oci-live-data-dry-run
              ;;
            apply-backfills)
              [ "$CONFIRMATION" = "APPLY LIVE BACKFILLS EXACT SHA" ]
              [[ "$PREREQUISITE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [ "$FAILED_DEPLOY_RUN_ID" = "0" ]
              [ "$FAILED_ACTIVATION_RUN_ID" = "0" ]
              [ "$RESUME_SOURCE_SHA" = "$SOURCE_SHA" ]
              [ "$CHECKPOINT_SOURCE_SHA" = "$SOURCE_SHA" ]
              protected_operation=oci-live-data-apply-backfills
              ;;
            apply-slip-index)
              [[ "$PREREQUISITE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              if [ "$FAILED_ACTIVATION_RUN_ID" != "0" ]; then
                case "$CONFIRMATION" in
                  "RESUME APPLIED LIVE DATA AND CLEAN FAILED ACTIVATION EXACT SHA")
                    protected_operation=oci-live-data-resume-activation ;;
                  "RESUME APPLIED LIVE DATA FROM RELEASED RUNTIME AND CLEAN FAILED ACTIVATION EXACT SHA")
                    protected_operation=oci-live-data-resume-activation-released ;;
                  *)
                    exit 1
                    ;;
                esac
              elif [ "$FAILED_DEPLOY_RUN_ID" = "0" ]; then
                [ "$CONFIRMATION" = "APPLY LIVE SLIP INDEX EXACT SHA" ]
                [ "$RESUME_SOURCE_SHA" = "$SOURCE_SHA" ]
                [ "$CHECKPOINT_SOURCE_SHA" = "$SOURCE_SHA" ]
                protected_operation=oci-live-data-apply-slip-index
              else
                case "$CONFIRMATION" in
                  "CONTINUE SUCCESSFUL HELD LIVE DATA EXACT SHA")
                    protected_operation=oci-live-data-continue-held-handoff ;;
                  "RESUME APPLIED LIVE DATA EXACT SHA")
                    protected_operation=oci-live-data-resume-deploy ;;
                  "RESUME APPLIED LIVE DATA FROM RELEASED RUNTIME EXACT SHA")
                    protected_operation=oci-live-data-resume-deploy-released ;;
                  *)
                    exit 1
                    ;;
                esac
              fi
              ;;
            *)
              exit 1
              ;;
          esac
          git fetch --quiet origin master:refs/remotes/origin/master
          [ "$SOURCE_SHA" = "$GITHUB_SHA" ]
          [ "$SOURCE_SHA" = "$(git rev-parse origin/master)" ]
          git cat-file -e "${RESUME_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$RESUME_SOURCE_SHA" "$SOURCE_SHA"
          if [ "$BASELINE_RECOVERY_RUN_ID" != "0" ]; then
            git cat-file -e "${BASELINE_RECOVERY_SOURCE_SHA}^{commit}"
            git merge-base --is-ancestor \
              "$BASELINE_RECOVERY_SOURCE_SHA" "$SOURCE_SHA"
          fi
          policy_json="$(
            ./infra/azure/agents/copilot-cli-protected-operation-policy-stan.sh \
              get "$protected_operation"
          )"
          continuation_args=()
          if [ "$HELD_HANDOFF_RUN_ID" != "0" ]; then
            continuation_args=(
              --successor-run-id "$GITHUB_RUN_ID"
              --held-history-file artifacts/oci-live-data-rollout/evidence/held-handoff-history.json
            )
          elif [ "$protected_operation" = "oci-live-data-resume-deploy" ]; then
            continuation_args=(--successor-run-id "$GITHUB_RUN_ID")
          fi
          ./infra/oci/scripts/upstream_run_binding_stan.py validate-all \
            --repository "$REPOSITORY" \
            --policy-json "$policy_json" \
            --subject-sha "$SOURCE_SHA" \
            --dispatch-inputs "$DISPATCH_INPUTS" \
            --runtime-mode "$OCI_RUNTIME_MODE" \
            --result-json "$RUNNER_TEMP/live-data-upstream-result.json" \
            --baseline-dir artifacts/oci-data-baseline-before \
            ${continuation_args[@]+"${continuation_args[@]}"}

          validate_run() {
            local workflow_file="$1"
            local run_id="$2"
            local expected_event="$3"
            local expected_sha="$4"
            local expected_conclusion="$5"
            local workflow_id
            workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/$workflow_file" --jq '.id'
            )"
            read -r observed_workflow path event head_sha head_branch repository status conclusion attempt <<<"$(
              gh api "repos/$REPOSITORY/actions/runs/$run_id/attempts/1" \
                --jq '[.workflow_id,.path,.event,.head_sha,.head_branch,.head_repository.full_name,.status,.conclusion,.run_attempt] | @tsv'
            )"
            [ "$observed_workflow" = "$workflow_id" ]
            [ "$path" = ".github/workflows/$workflow_file" ]
            [ "$event" = "$expected_event" ]
            [ "$head_sha" = "$expected_sha" ]
            [ "$head_branch" = "master" ]
            [ "$repository" = "$REPOSITORY" ]
            [ "$status" = "completed" ]
            [ "$conclusion" = "$expected_conclusion" ]
            [ "$attempt" = "1" ]
          }

          validate_run \
            oci-production-build.yml "$BUILD_RUN_ID" workflow_run \
            "$CHECKPOINT_SOURCE_SHA" success
          validate_run \
            oci-infrastructure.yml "$INFRASTRUCTURE_RUN_ID" workflow_dispatch \
            "$CHECKPOINT_SOURCE_SHA" success
          if [ "$BASELINE_RECOVERY_RUN_ID" != "0" ]; then
            cache_recovery_workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/oci-ghcr-cache-recovery.yml" --jq '.id'
            )"
            rollback_recovery_workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/oci-production-rollback.yml" --jq '.id'
            )"
            read -r workflow_id path event recovery_head_sha head_branch \
              repository status conclusion attempt display_title <<<"$(
              gh api "repos/$REPOSITORY/actions/runs/$BASELINE_RECOVERY_RUN_ID/attempts/1" \
                --jq '[.workflow_id,.path,.event,.head_sha,.head_branch,.head_repository.full_name,.status,.conclusion,.run_attempt,.display_title] | @tsv'
            )"
            [ "$event" = "workflow_dispatch" ]
            [[ "$recovery_head_sha" =~ ^[0-9a-f]{40}$ ]]
            [ "$head_branch" = "master" ]
            [ "$repository" = "$REPOSITORY" ]
            [ "$status" = "completed" ] && [ "$conclusion" = "success" ] && [ "$attempt" = "1" ]
            git cat-file -e "${recovery_head_sha}^{commit}"
            git merge-base --is-ancestor "$recovery_head_sha" "$SOURCE_SHA"
            if [ "$workflow_id" = "$cache_recovery_workflow_id" ] &&
               [ "$path" = ".github/workflows/oci-ghcr-cache-recovery.yml" ]; then
              recovery_kind=ghcr-cache
              recovery_artifact_name="$(
                gh api "repos/$REPOSITORY/actions/runs/$BASELINE_RECOVERY_RUN_ID/artifacts?per_page=100" \
                  --jq '.artifacts[] | select(.expired == false) | .name' |
                  awk -v run_id="$BASELINE_RECOVERY_RUN_ID" \
                    '$0 ~ ("^ghcr-cache-recovery-[0-9a-f]{40}-" run_id "-1$") { count++; name=$0 } END { if (count != 1) exit 1; print name }'
              )"
            elif [ "$workflow_id" = "$rollback_recovery_workflow_id" ] &&
                 [ "$path" = ".github/workflows/oci-production-rollback.yml" ]; then
              recovery_kind=partial-rollback
              [[ "$display_title" =~ ^oci-rollback\ [0-9a-f]{40}$ ]]
              recovery_artifact_name="oci-production-rollback-${BASELINE_RECOVERY_RUN_ID}-1"
              artifact_count="$(
                gh api "repos/$REPOSITORY/actions/runs/$BASELINE_RECOVERY_RUN_ID/artifacts?per_page=100" \
                  --jq "[.artifacts[] | select(.name == \"$recovery_artifact_name\" and .expired == false)] | length"
              )"
              [ "$artifact_count" = "1" ]
            else
              echo "selected baseline recovery workflow is not trusted" >&2
              exit 1
            fi
            printf 'recovery_artifact_name=%s\n' "$recovery_artifact_name" >> "$GITHUB_OUTPUT"
            printf 'recovery_kind=%s\n' "$recovery_kind" >> "$GITHUB_OUTPUT"
          fi
          if [ "$PHASE" != "dry-run" ]; then
            prerequisite_source_sha="$RESUME_SOURCE_SHA"
            validate_run \
              oci-live-data-rollout.yml "$PREREQUISITE_RUN_ID" \
              workflow_dispatch "$prerequisite_source_sha" success
            artifact_name="oci-live-data-rollout-${PREREQUISITE_RUN_ID}-1"
            artifact_count="$(
              gh api "repos/$REPOSITORY/actions/runs/$PREREQUISITE_RUN_ID/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(.name == \"$artifact_name\" and .expired == false)] | length"
            )"
            [ "$artifact_count" = "1" ]
            printf 'resume_source_sha=%s\n' \
              "$prerequisite_source_sha" >> "$GITHUB_OUTPUT"
            if [ "$FAILED_DEPLOY_RUN_ID" != "0" ] &&
               [ "$FAILED_ACTIVATION_RUN_ID" = "0" ]; then
              validate_run \
                oci-production-deploy.yml "$FAILED_DEPLOY_RUN_ID" \
                workflow_dispatch "$prerequisite_source_sha" failure
              result_binding=failed_deploy_run_id
              [ "$HELD_HANDOFF_RUN_ID" = "0" ] || result_binding=held_handoff_run_id
              jq -er --arg binding "$result_binding" '
                .[$binding] |
                select(type == "object") |
                to_entries[] | "\(.key)=\(.value)"
              ' "$RUNNER_TEMP/live-data-upstream-result.json" >> "$GITHUB_OUTPUT"
            fi
            if [ "$FAILED_ACTIVATION_RUN_ID" != "0" ]; then
              if [ "$protected_operation" = "oci-live-data-resume-activation-released" ]; then
                jq -er '
                  .failed_activation_run_id |
                  select(type == "object" and
                    (.released_activation_qualification == "pre-arm-no-account" or
                     .released_activation_qualification == "cleanup-required")) |
                  to_entries[] | "\(.key)=\(.value)"
                ' "$RUNNER_TEMP/live-data-upstream-result.json" >> "$GITHUB_OUTPUT"
              else
                printf 'resume_maintenance_mode=released-runtime\n' >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

      - name: Reject competing production activity
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXCLUDE_RUN_ID: ${{ github.run_id }}
        run: ./infra/azure/agents/production-run-exclusivity-stan.sh

      - name: Download exact OCI image provenance
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oci-image-provenance-${{ inputs.checkpoint_source_sha }}-${{ inputs.build_run_id }}-1
          path: artifacts/build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Download exact OCI infrastructure provenance
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oci-infrastructure-provenance-${{ inputs.infrastructure_run_id }}-1
          path: artifacts/infrastructure
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.infrastructure_run_id }}

      - name: Download exact release disk checkpoint
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oci-release-disk-checkpoint-${{ inputs.checkpoint_source_sha }}-${{ inputs.disk_checkpoint_run_id }}-1
          path: artifacts/disk-checkpoint
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.disk_checkpoint_run_id }}

      - name: Download prerequisite data evidence
        if: inputs.phase != 'dry-run'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oci-live-data-rollout-${{ inputs.prerequisite_run_id }}-1
          path: artifacts/prerequisite
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prerequisite_run_id }}

      - name: Download failed deploy protected baseline
        if: >-
          inputs.failed_deploy_run_id != '0' &&
          inputs.failed_activation_run_id == '0' &&
          steps.provenance_request.outputs.resume_maintenance_mode != 'pre-runtime-hold'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ steps.provenance_request.outputs.baseline_artifact_name }}
          path: artifacts/oci-data-baseline-before
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.provenance_request.outputs.baseline_run_id }}

      - name: Download explicitly selected recovery baseline authority
        if: inputs.baseline_recovery_run_id != '0'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ steps.provenance_request.outputs.recovery_artifact_name }}
          path: artifacts/recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.baseline_recovery_run_id }}

      - name: Bind historical recovery source through its exact artifact
        id: recovery_authority
        if: inputs.baseline_recovery_run_id != '0'
        env:
          BASELINE_RECOVERY_KIND: ${{ steps.provenance_request.outputs.recovery_kind }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          recovery=artifacts/recovery
          if [ "$BASELINE_RECOVERY_KIND" = "partial-rollback" ]; then
            authority="$recovery/partial-recovery-authority.env"
            PARTIAL_RECOVERY_DIR="$recovery" \
            EXPECTED_RECOVERY_RUN_ID="$BASELINE_RECOVERY_RUN_ID" \
              ./infra/oci/scripts/validate-partial-recovery-authority-stan.sh
            source_sha="$(awk -F= '$1 == "restored_source_sha" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$authority")"
            build_run_id="$(awk -F= '$1 == "restored_build_run_id" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$authority")"
            recovery_head_sha="$(awk -F= '$1 == "recovery_head_sha" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$authority")"
            source_rollback_run_id="$(awk -F= '$1 == "source_rollback_run_id" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$authority")"
            target_sha="$(awk -F= '$1 == "target_sha" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$authority")"
            rollback_workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/oci-production-rollback.yml" --jq '.id'
            )"
            gh api "repos/$REPOSITORY/actions/runs/$BASELINE_RECOVERY_RUN_ID/attempts/1" |
              jq -e \
                --argjson workflow_id "$rollback_workflow_id" \
                --arg repo "$REPOSITORY" \
                --arg head_sha "$recovery_head_sha" \
                --arg title "oci-rollback $target_sha" '
                  .workflow_id == $workflow_id and
                  .path == ".github/workflows/oci-production-rollback.yml" and
                  .event == "workflow_dispatch" and
                  .head_sha == $head_sha and
                  .head_branch == "master" and
                  .head_repository.full_name == $repo and
                  .status == "completed" and
                  .conclusion == "success" and
                  .run_attempt == 1 and
                  .display_title == $title
                ' >/dev/null
            gh api "repos/$REPOSITORY/actions/runs/$source_rollback_run_id/attempts/1" |
              jq -e \
                --argjson workflow_id "$rollback_workflow_id" \
                --arg repo "$REPOSITORY" \
                --arg title "oci-rollback $target_sha" '
                  .workflow_id == $workflow_id and
                  .path == ".github/workflows/oci-production-rollback.yml" and
                  .event == "workflow_dispatch" and
                  .head_branch == "master" and
                  .head_repository.full_name == $repo and
                  .status == "completed" and
                  .conclusion == "failure" and
                  .run_attempt == 1 and
                  .display_title == $title
                ' >/dev/null
            source_artifact_name="oci-production-rollback-${source_rollback_run_id}-1"
            [ "$(
              gh api "repos/$REPOSITORY/actions/runs/$source_rollback_run_id/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(.name == \"$source_artifact_name\" and .expired == false)] | length"
            )" = "1" ]
            build_workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/oci-production-build.yml" --jq '.id'
            )"
            gh api "repos/$REPOSITORY/actions/runs/$build_run_id/attempts/1" |
              jq -e \
                --argjson workflow_id "$build_workflow_id" \
                --arg repo "$REPOSITORY" \
                --arg source_sha "$source_sha" '
                  .workflow_id == $workflow_id and
                  .path == ".github/workflows/oci-production-build.yml" and
                  .event == "workflow_run" and
                  .head_sha == $source_sha and
                  .head_branch == "master" and
                  .head_repository.full_name == $repo and
                  .status == "completed" and
                  .conclusion == "success" and
                  .run_attempt == 1
                ' >/dev/null
            build_artifact_name="oci-image-provenance-${source_sha}-${build_run_id}-1"
            [ "$(
              gh api "repos/$REPOSITORY/actions/runs/$build_run_id/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(.name == \"$build_artifact_name\" and .expired == false)] | length"
            )" = "1" ]
            git cat-file -e "${source_sha}^{commit}"
            git cat-file -e "${recovery_head_sha}^{commit}"
            git merge-base --is-ancestor "$source_sha" "$SOURCE_SHA"
            git merge-base --is-ancestor "$recovery_head_sha" "$SOURCE_SHA"
          else
            evidence="$recovery/recovery-evidence.env"
            transition="$recovery/transition-provenance.env"
            [ -f "$evidence" ] && [ -f "$transition" ] && [ -f "$recovery/images.tsv" ]
            source_sha="$(awk -F= '$1 == "source_sha" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$evidence")"
            recovery_run_id="$(awk -F= '$1 == "recovery_run_id" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$evidence")"
            recovery_attempt="$(awk -F= '$1 == "recovery_run_attempt" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$evidence")"
            transition_source="$(awk -F= '$1 == "source_sha" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$transition")"
            transition_run_id="$(awk -F= '$1 == "transition_run_id" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$transition")"
            transition_attempt="$(awk -F= '$1 == "transition_run_attempt" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$transition")"
            image_hash="$(awk -F= '$1 == "images_sha256" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$evidence")"
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
            [ "$recovery_run_id" = "$BASELINE_RECOVERY_RUN_ID" ]
            [ "$recovery_attempt" = "1" ]
            [ "$transition_source" = "$source_sha" ]
            [ "$transition_run_id" = "$BASELINE_RECOVERY_RUN_ID" ]
            [ "$transition_attempt" = "1" ]
            [ "$image_hash" = "$(sha256sum "$recovery/images.tsv" | awk '{print $1}')" ]
            grep -Fxq 'credential_retirement=pass' "$transition"
            grep -Fxq 'ocir_repository_retirement=pass' "$transition"
            grep -Fxq 'transition_status=PASS' "$transition"
          fi
          [ "$source_sha" = "$BASELINE_RECOVERY_SOURCE_SHA" ]
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Verify immutable release and phase provenance
        id: provenance
        env:
          BASELINE_RECOVERY_SOURCE_SHA: ${{ inputs.baseline_recovery_source_sha }}
          RESUME_SOURCE_SHA: ${{ inputs.resume_source_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          set_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }
          PROVENANCE_DIR=artifacts/build \
          SOURCE_SHA="$CHECKPOINT_SOURCE_SHA" \
          EXPECTED_BUILD_RUN_ID="$BUILD_RUN_ID" \
          EXPECTED_BUILD_RUN_ATTEMPT=1 \
          OUTPUT_FILE=artifacts/oci-live-data-rollout/images.tsv \
          VERIFY_REMOTE=0 BOOT_IMAGES=0 \
            ./infra/oci/scripts/verify-images.sh

          checkpoint_args=(
            validate-release-checkpoint
            --checkpoint artifacts/disk-checkpoint/checkpoint.json
            --source-sha "$CHECKPOINT_SOURCE_SHA"
            --producer-run-id "$DISK_CHECKPOINT_RUN_ID"
            --runtime-mode "$OCI_RUNTIME_MODE"
          )
          checkpoint_args+=(
            --infrastructure-run-id "$INFRASTRUCTURE_RUN_ID"
            --ghcr-build-run-id "$BUILD_RUN_ID"
          )
          if [ "$OCI_RUNTIME_MODE" = "k3s" ]; then
            checkpoint_args+=(
              --candidate-images artifacts/oci-live-data-rollout/images.tsv
            )
          fi
          ./infra/oci/scripts/k3s_disk_recovery_stan.py \
            "${checkpoint_args[@]}"
          disk_checkpoint_sha256="$(
            jq -er '.contentChecksumSha256' \
              artifacts/disk-checkpoint/checkpoint.json
          )"
          disk_checkpoint_disposition="$(
            jq -er '.disposition' artifacts/disk-checkpoint/checkpoint.json
          )"
          set_output disk_checkpoint_sha256 "$disk_checkpoint_sha256"
          set_output disk_checkpoint_disposition "$disk_checkpoint_disposition"

          # shellcheck disable=SC1091
          source artifacts/infrastructure/provenance.env
          [ "$source_sha" = "$CHECKPOINT_SOURCE_SHA" ]
          [ "$infrastructure_run_id" = "$INFRASTRUCTURE_RUN_ID" ]
          [ "$infrastructure_run_attempt" = "1" ]
          [ "$compartment_ocid" = "$OCI_COMPARTMENT_OCID" ]
          [ "$namespace" = "$OCI_K8S_NAMESPACE" ]
          [ "$runtime_mode" = "$OCI_RUNTIME_MODE" ]
          [ "$infrastructure_finalized" = "true" ]
          [ "$application_registry_provider" = "ghcr" ]
          [ "$application_registry_host" = "ghcr.io" ]
          [ "$application_registry_repository" = "ghcr.io/vasilyevstan/betstan-images" ]
          [ "$application_registry_public_anonymous" = "true" ]
          [ "$ocir_application_repository_absent" = "true" ]
          if [ "$runtime_mode" = "oke" ]; then
            echo "::add-mask::$cluster_ocid"
            echo "::add-mask::$endpoint_nsg_ocid"
            set_output cluster_ocid "$cluster_ocid"
            set_output endpoint_nsg_ocid "$endpoint_nsg_ocid"
          else
            echo "::add-mask::$instance_ocid"
            set_output instance_ocid "$instance_ocid"
          fi
          set_output public_url "https://$public_host"
          set_output redirect_url "https://$redirect_host"
          set_output diagnostic_url "https://$diagnostic_host"

          if [ "$FAILED_ACTIVATION_RUN_ID" != "0" ]; then
            EVIDENCE_DIR=artifacts/prerequisite \
            EXPECTED_SOURCE_SHA="$RESUME_SOURCE_SHA" \
            EXPECTED_BUILD_RUN_ID="$BUILD_RUN_ID" \
            EXPECTED_INFRASTRUCTURE_RUN_ID="$INFRASTRUCTURE_RUN_ID" \
            EXPECTED_CHECKPOINT_SOURCE_SHA="$CHECKPOINT_SOURCE_SHA" \
            EXPECTED_DISK_CHECKPOINT_RUN_ID="$DISK_CHECKPOINT_RUN_ID" \
            EXPECTED_DISK_CHECKPOINT_SHA256="$disk_checkpoint_sha256" \
            EXPECTED_DISK_CHECKPOINT_DISPOSITION="$disk_checkpoint_disposition" \
            EXPECTED_PHASE=apply-slip-index \
            EXPECTED_RUN_ID="$PREREQUISITE_RUN_ID" \
            EXPECTED_RUN_ATTEMPT=1 \
            EXPECTED_BASELINE_RECOVERY_RUN_ID="$BASELINE_RECOVERY_RUN_ID" \
            EXPECTED_BASELINE_RECOVERY_SOURCE_SHA="$BASELINE_RECOVERY_SOURCE_SHA" \
              ./infra/oci/scripts/verify-live-betting-data-evidence-stan.sh
          elif [ "$PHASE" != "dry-run" ] &&
               [ "$FAILED_DEPLOY_RUN_ID" = "0" ]; then
            expected_phase=dry-run
            [ "$PHASE" != "apply-slip-index" ] || expected_phase=apply-backfills
            EVIDENCE_DIR=artifacts/prerequisite \
            EXPECTED_SOURCE_SHA="$SOURCE_SHA" \
            EXPECTED_BUILD_RUN_ID="$BUILD_RUN_ID" \
            EXPECTED_INFRASTRUCTURE_RUN_ID="$INFRASTRUCTURE_RUN_ID" \
            EXPECTED_CHECKPOINT_SOURCE_SHA="$CHECKPOINT_SOURCE_SHA" \
            EXPECTED_DISK_CHECKPOINT_RUN_ID="$DISK_CHECKPOINT_RUN_ID" \
            EXPECTED_DISK_CHECKPOINT_SHA256="$disk_checkpoint_sha256" \
            EXPECTED_DISK_CHECKPOINT_DISPOSITION="$disk_checkpoint_disposition" \
            EXPECTED_PHASE="$expected_phase" \
            EXPECTED_RUN_ID="$PREREQUISITE_RUN_ID" \
            EXPECTED_RUN_ATTEMPT=1 \
            EXPECTED_BASELINE_RECOVERY_RUN_ID="$BASELINE_RECOVERY_RUN_ID" \
            EXPECTED_BASELINE_RECOVERY_SOURCE_SHA="$BASELINE_RECOVERY_SOURCE_SHA" \
              ./infra/oci/scripts/verify-live-betting-data-evidence-stan.sh
          elif [ "$FAILED_DEPLOY_RUN_ID" != "0" ]; then
            evidence_value() {
              local key="$1"
              awk -F= -v key="$key" '
                $1 == key {
                  if (found++) exit 1
                  value = substr($0, length(key) + 2)
                }
                END {
                  if (found != 1) exit 1
                  print value
                }
              ' artifacts/prerequisite/provenance.env
            }

            prior_source_sha="$(evidence_value source_sha)"
            prior_build_run_id="$(evidence_value build_run_id)"
            prior_infrastructure_run_id="$(evidence_value infrastructure_run_id)"
            prior_checkpoint_source_sha="$(evidence_value checkpoint_source_sha)"
            prior_disk_checkpoint_run_id="$(evidence_value disk_checkpoint_run_id)"
            prior_disk_checkpoint_sha256="$(evidence_value disk_checkpoint_sha256)"
            prior_disk_checkpoint_disposition="$(
              evidence_value disk_checkpoint_disposition
            )"
            prior_baseline_recovery_run_id="$(evidence_value baseline_recovery_run_id)"
            prior_baseline_recovery_source_sha="$(
              evidence_value baseline_recovery_source_sha
            )"
            [ "$prior_source_sha" = "$RESUME_SOURCE_SHA" ]
            [ "$prior_build_run_id" = "$BUILD_RUN_ID" ]
            [ "$prior_infrastructure_run_id" = "$INFRASTRUCTURE_RUN_ID" ]
            [ "$prior_baseline_recovery_run_id" = "$BASELINE_RECOVERY_RUN_ID" ]
            [ "$prior_baseline_recovery_source_sha" = "$BASELINE_RECOVERY_SOURCE_SHA" ]
            [ "$prior_checkpoint_source_sha" = "$CHECKPOINT_SOURCE_SHA" ]
            [ "$prior_disk_checkpoint_run_id" = "$DISK_CHECKPOINT_RUN_ID" ]
            [ "$prior_disk_checkpoint_sha256" = "$disk_checkpoint_sha256" ]
            [ "$prior_disk_checkpoint_disposition" = \
              "$disk_checkpoint_disposition" ]
            git merge-base --is-ancestor "$prior_source_sha" "$SOURCE_SHA"
            while IFS= read -r changed_path; do
              case "$changed_path" in
                .github/*|infra/*|*.md) ;;
                *)
                  echo "Application path changed after applied data: $changed_path" >&2
                  exit 1
                  ;;
              esac
            done < <(git diff --name-only "$prior_source_sha" "$SOURCE_SHA" --)

            resume_native_dispatch_inputs=""
            resume_successor_run_id=""
            jq -e 'type == "object" and (.failed_deploy_run_id | type == "object")' \
              "$RUNNER_TEMP/live-data-upstream-result.json" >/dev/null
            if [ "$HELD_HANDOFF_RUN_ID" != "0" ] || jq -e \
              '.failed_deploy_run_id.no_takeover_handoff_qualification == "expired-own-handoff"' \
              "$RUNNER_TEMP/live-data-upstream-result.json" >/dev/null; then
              resume_native_dispatch_inputs="$DISPATCH_INPUTS"
              resume_successor_run_id="$GITHUB_RUN_ID"
            fi
            resume_resolution="$(
              EVIDENCE_DIR=artifacts/prerequisite \
              EXPECTED_SOURCE_SHA="$prior_source_sha" \
              EXPECTED_BUILD_RUN_ID="$prior_build_run_id" \
              EXPECTED_INFRASTRUCTURE_RUN_ID="$prior_infrastructure_run_id" \
              EXPECTED_CHECKPOINT_SOURCE_SHA="$CHECKPOINT_SOURCE_SHA" \
              EXPECTED_DISK_CHECKPOINT_RUN_ID="$DISK_CHECKPOINT_RUN_ID" \
              EXPECTED_DISK_CHECKPOINT_SHA256="$disk_checkpoint_sha256" \
              EXPECTED_DISK_CHECKPOINT_DISPOSITION="$disk_checkpoint_disposition" \
              EXPECTED_PHASE=apply-slip-index \
              EXPECTED_RUN_ID="$PREREQUISITE_RUN_ID" \
              EXPECTED_RUN_ATTEMPT=1 \
              EXPECTED_BASELINE_RECOVERY_RUN_ID="$BASELINE_RECOVERY_RUN_ID" \
              EXPECTED_BASELINE_RECOVERY_SOURCE_SHA="$BASELINE_RECOVERY_SOURCE_SHA" \
              RESUME_BASELINE_DIR=artifacts/oci-data-baseline-before \
              VERIFY_RESUME_APPLIED_RUN=true \
              RESUME_REPOSITORY="$REPOSITORY" \
              RESUME_NATIVE_DISPATCH_INPUTS="$resume_native_dispatch_inputs" \
              RESUME_SUCCESSOR_RUN_ID="$resume_successor_run_id" \
                ./infra/oci/scripts/verify-live-betting-data-evidence-stan.sh
            )"
            resolution_value() {
              local key="$1"
              awk -F= -v key="$key" '
                $1 == key {
                  if (found++) exit 1
                  value = substr($0, length(key) + 2)
                }
                END {
                  if (found != 1) exit 1
                  print value
                }
              ' <<<"$resume_resolution"
            }
            set_output \
              resume_applied_data_run_id \
              "$(resolution_value applied_data_run_id)"
            set_output \
              resume_applied_source_sha \
              "$(resolution_value applied_source_sha)"
            if [ "$HELD_HANDOFF_RUN_ID" = "0" ]; then
              if [ "$(resolution_value applied_source_sha)" != "$CHECKPOINT_SOURCE_SHA" ]; then
                echo "::error::Resolved original applied data source differs from the disk checkpoint" >&2
                exit 1
              fi
            fi
            [ "$(resolution_value checkpoint_source_sha)" = \
              "$CHECKPOINT_SOURCE_SHA" ]
            [ "$(resolution_value disk_checkpoint_run_id)" = \
              "$DISK_CHECKPOINT_RUN_ID" ]
            [ "$(resolution_value disk_checkpoint_sha256)" = \
              "$disk_checkpoint_sha256" ]
            [ "$(resolution_value disk_checkpoint_disposition)" = \
              "$disk_checkpoint_disposition" ]
            printf '%s\n' "$resume_resolution"

            resume_artifact_name="oci-image-provenance-${prior_checkpoint_source_sha}-${prior_build_run_id}-1"
            gh run download "$prior_build_run_id" \
              --repo "$REPOSITORY" \
              --name "$resume_artifact_name" \
              --dir artifacts/resume-build
            PROVENANCE_DIR=artifacts/resume-build \
            SOURCE_SHA="$prior_checkpoint_source_sha" \
            EXPECTED_BUILD_RUN_ID="$prior_build_run_id" \
            EXPECTED_BUILD_RUN_ATTEMPT=1 \
            OUTPUT_FILE=artifacts/oci-live-data-rollout/resume-images.tsv \
            VERIFY_REMOTE=0 BOOT_IMAGES=0 \
              ./infra/oci/scripts/verify-images.sh
            cmp -s \
              artifacts/oci-live-data-rollout/images.tsv \
              artifacts/oci-live-data-rollout/resume-images.tsv
          fi

      - name: Install pinned OCI CLI
        id: oci_cli
        run: ./infra/oci/scripts/install-cli.sh

      - name: Verify OKE identity
        if: env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_CLUSTER_OCID: ${{ steps.provenance.outputs.cluster_ocid }}
        run: |
          oci ce cluster get \
            --cluster-id "$OCI_CLUSTER_OCID" \
            --query 'data.{type:type,state:"lifecycle-state"}' \
            >/dev/null

      - name: Verify k3s identity
        if: env.OCI_RUNTIME_MODE == 'k3s'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_INSTANCE_OCID: ${{ steps.provenance.outputs.instance_ocid }}
        run: |
          oci compute instance get \
            --instance-id "$OCI_INSTANCE_OCID" \
            --query 'data.{shape:shape,state:"lifecycle-state"}' \
            >/dev/null

      - name: Reconcile expired and authorize current runner IPv4
        if: env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_ENDPOINT_NSG_OCID: ${{ steps.provenance.outputs.endpoint_nsg_ocid }}
          RULE_STATE_FILE: artifacts/oci-live-data-rollout/runner-rule.env
        run: |
          set -euo pipefail
          ./infra/oci/scripts/authorize-github-runner.sh cleanup-stale
          RUNNER_PUBLIC_IPV4="$(curl --fail --silent --show-error --max-time 15 https://api.ipify.org)"
          export RUNNER_PUBLIC_IPV4
          ./infra/oci/scripts/authorize-github-runner.sh authorize

      - name: Configure kubectl from exact cluster OCID
        if: env.OCI_RUNTIME_MODE == 'oke'
        uses: oracle-actions/configure-kubectl-oke@77a733d79446dabe7bf0e58eb56197d33ce4dc58 # v1.5.0
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
        with:
          cluster: ${{ steps.provenance.outputs.cluster_ocid }}

      - name: Open ephemeral OCI Bastion access to k3s
        if: env.OCI_RUNTIME_MODE == 'k3s'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_K3S_SSH_PRIVATE_KEY: ${{ secrets.OCI_K3S_SSH_PRIVATE_KEY }}
          OCI_K3S_RETAIN_TARGET_SSH: "true"
          INFRA_PROVENANCE_FILE: artifacts/infrastructure/provenance.env
          SESSION_STATE_FILE: artifacts/oci-live-data-rollout/k3s-access.env
          WORK_DIR: ${{ runner.temp }}/betstan-k3s-access
        run: |
          set -euo pipefail
          RUNNER_PUBLIC_IPV4="$(
            curl --fail --silent --show-error --max-time 15 https://api.ipify.org
          )"
          export RUNNER_PUBLIC_IPV4
          ./infra/oci/scripts/configure-k3s-access.sh open

      - name: Verify exact failed-deploy resume state
        if: >-
          inputs.failed_deploy_run_id != '0' &&
          inputs.failed_activation_run_id == '0'
        env:
          RESUME_SOURCE_SHA: ${{ inputs.resume_source_sha }}
          RESUME_MAINTENANCE_MODE: ${{ steps.provenance_request.outputs.resume_maintenance_mode }}
          NO_TAKEOVER_HANDOFF_QUALIFICATION: ${{ steps.provenance_request.outputs.no_takeover_handoff_qualification || 'none' }}
          BASELINE_CAPTURE_RUN_ID: ${{ steps.provenance_request.outputs.baseline_capture_run_id }}
          BASELINE_CAPTURE_SOURCE_SHA: ${{ steps.provenance_request.outputs.baseline_capture_source_sha }}
          BASELINE_RECOVERY_SOURCE_SHA: ${{ inputs.baseline_recovery_source_sha }}
          RESOLVED_APPLIED_DATA_RUN_ID: ${{ steps.provenance_request.outputs.applied_data_run_id || steps.provenance.outputs.resume_applied_data_run_id }}
          RESOLVED_APPLIED_SOURCE_SHA: ${{ steps.provenance_request.outputs.applied_source_sha || steps.provenance.outputs.resume_applied_source_sha }}
        run: |
          set -euo pipefail
          NO_TAKEOVER_HANDOFF_QUALIFICATION="${NO_TAKEOVER_HANDOFF_QUALIFICATION:-none}"
          case "$NO_TAKEOVER_HANDOFF_QUALIFICATION" in
            none)
              if [ "$HELD_HANDOFF_RUN_ID" != "0" ]; then
                [ "$RESUME_MAINTENANCE_MODE" = pre-runtime-hold ]
                [ "$FAILED_ACTIVATION_RUN_ID" = 0 ]
                [ "$BASELINE_CAPTURE_RUN_ID" = "$PREREQUISITE_RUN_ID" ]
                [[ "$BASELINE_CAPTURE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
              fi
              ;;
            expired-own-handoff)
              [ "$RESUME_MAINTENANCE_MODE" = pre-runtime-hold ]
              [ "$FAILED_ACTIVATION_RUN_ID" = 0 ] && [ "$HELD_HANDOFF_RUN_ID" = 0 ]
              [ "$BASELINE_CAPTURE_RUN_ID" = "$PREREQUISITE_RUN_ID" ]
              [[ "$BASELINE_CAPTURE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
              ;;
            *) echo "unsupported native no-takeover qualification" >&2; exit 1 ;;
          esac
          resume_images=artifacts/oci-live-data-rollout/resume-images.tsv
          prior_evidence=artifacts/prerequisite/provenance.env
          baseline_dir=artifacts/oci-data-baseline-before
          [ -f "$resume_images" ] && [ -f "$prior_evidence" ]
          expected_baseline_sha="$(
            awk -F= '$1 == "baseline_sha256" {
              if (found++) exit 1
              value=$2
            } END {
              if (found != 1) exit 1
              print value
            }' "$prior_evidence"
          )"
          observed_baseline_sha="$(
            sha256sum "$baseline_dir/SHA256SUMS" | awk '{print $1}'
          )"
          if [ "$observed_baseline_sha" != "$expected_baseline_sha" ]; then
            echo "::error::Resume rollback baseline digest differs from the prerequisite data evidence"
            exit 1
          fi
          [[ "$RESOLVED_APPLIED_DATA_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RESOLVED_APPLIED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor \
            "$RESOLVED_APPLIED_SOURCE_SHA" "$RESUME_SOURCE_SHA"
          expected_baseline_source_sha=
          expected_recovery_run_id=
          if [ "$BASELINE_RECOVERY_RUN_ID" != "0" ]; then
            expected_baseline_source_sha="$BASELINE_RECOVERY_SOURCE_SHA"
            expected_recovery_run_id="$BASELINE_RECOVERY_RUN_ID"
          elif [ "$NO_TAKEOVER_HANDOFF_QUALIFICATION" = expired-own-handoff ] ||
               [ "$HELD_HANDOFF_RUN_ID" != "0" ]; then
            expected_baseline_source_sha="$BASELINE_CAPTURE_SOURCE_SHA"
          fi
          BASELINE_DIR="$baseline_dir" \
          EXPECTED_SOURCE_SHA="$expected_baseline_source_sha" \
          EXPECTED_NAMESPACE="$OCI_K8S_NAMESPACE" \
          EXPECTED_RECOVERY_RUN_ID="$expected_recovery_run_id" \
          REQUIRE_CURRENT_DEPLOY_PROVENANCE=true \
            ./infra/oci/scripts/validate-rollback-baseline-stan.sh

          case "$RESUME_MAINTENANCE_MODE" in
            released-runtime)
              ;;
            pre-runtime-hold)
              ./infra/oci/scripts/live-data-maintenance-stan.sh verify-held
              ;;
            retained-hold)
              ;;
            *)
              echo "Unsupported resume maintenance mode: $RESUME_MAINTENANCE_MODE" >&2
              exit 1
              ;;
          esac

          runtime_images="$resume_images"
          services=(auth bet backoffice client event gamemaster moderation resulting slip)
          supporting_services=(auth client)
          if [ "$RESUME_MAINTENANCE_MODE" = "pre-runtime-hold" ]; then
            runtime_images="$baseline_dir/images.tsv"
            services+=(telemetry)
            supporting_services+=(telemetry)
            [ "$(wc -l <"$runtime_images" | tr -d ' ')" = 10 ]
          fi
          for service in "${services[@]}"; do
            expected_ref="$(
              awk -F '\t' -v service="$service" '
                $1 == service { count++; value=$3 }
                END { if (count != 1) exit 1; print value }
              ' "$runtime_images"
            )"
            deployment="gaming-${service}-depl"
            actual_ref="$(
              kubectl get deployment "$deployment" -n "$OCI_K8S_NAMESPACE" \
                -o jsonpath='{.spec.template.spec.containers[0].image}'
            )"
            if [ "$RESUME_MAINTENANCE_MODE" = "pre-runtime-hold" ]; then
              [ "$actual_ref" = "$expected_ref" ] || {
                echo "::error::Pre-runtime baseline image mismatch for ${service}"
                exit 1
              }
              continue
            fi
            case "$service" in
              auth|client)
                if [ "$actual_ref" != "$expected_ref" ]; then
                  echo "::error::Resume candidate-only deployment image mismatch for ${service}"
                  exit 1
                fi
                ;;
              backoffice|bet|event|gamemaster|moderation|resulting|slip)
                if [ "$RESUME_MAINTENANCE_MODE" = "released-runtime" ]; then
                  if [ "$actual_ref" != "$expected_ref" ]; then
                    echo "::error::Resume candidate-only deployment image mismatch for ${service}"
                    exit 1
                  fi
                elif [ "$actual_ref" != "$expected_ref" ]; then
                  if ! baseline_ref="$(
                    awk -F '\t' -v service="$service" '
                      $1 == service {
                        count++
                        if (NF != 2) invalid=1
                        value=$2
                      }
                      END {
                        if (count != 1 || invalid) exit 1
                        print value
                      }
                    ' "$baseline_dir/live-images.tsv"
                  )" || [[ ! "$baseline_ref" =~ ^ghcr\.io/vasilyevstan/betstan-images@sha256:[0-9a-f]{64}$ ]]; then
                    echo "::error::Resume baseline image evidence is invalid for writer ${service}"
                    exit 1
                  fi
                  if [ "$actual_ref" != "$baseline_ref" ]; then
                    echo "::error::Retained-hold writer image mismatch for ${service}: expected its candidate or validated own baseline image"
                    exit 1
                  fi
                fi
                ;;
            esac
          done

          for service in "${supporting_services[@]}"; do
            expected_manifest="$(
              awk -F '\t' -v service="$service" '
                $1 == service { count++; value=$4 }
                END { if (count != 1) exit 1; print value }
              ' "$runtime_images"
            )"
            expected_platform="$(
              awk -F '\t' -v service="$service" '
                $1 == service { count++; value=$5 }
                END { if (count != 1) exit 1; print value }
              ' "$runtime_images"
            )"
            deployment="gaming-${service}-depl"
            container="gaming-${service}"
            kubectl rollout status "deployment/$deployment" \
              -n "$OCI_K8S_NAMESPACE" --timeout=2m >/dev/null
            pods_json="$(
              kubectl get pods -n "$OCI_K8S_NAMESPACE" \
                -l "app=gaming-${service}" -o json
            )"
            if [ "$RESUME_MAINTENANCE_MODE" = "pre-runtime-hold" ]; then
              desired="$(
                awk -F '\t' -v service="$service" '
                  $1 == service { count++; value=$4 }
                  END { if (count != 1) exit 1; print value }
                ' "$baseline_dir/deployments.tsv"
              )"
              [[ "$desired" =~ ^[1-9][0-9]*$ ]]
              [ "$service" != telemetry ] || [ "$desired" = 1 ]
              kubectl get deployment "$deployment" -n "$OCI_K8S_NAMESPACE" -o json |
                jq -e --argjson desired "$desired" '
                  .spec.replicas == $desired and
                  .status.observedGeneration == .metadata.generation and
                  .status.replicas == $desired and
                  .status.updatedReplicas == $desired and
                  .status.readyReplicas == $desired and
                  .status.availableReplicas == $desired
                ' >/dev/null
              jq -e --argjson desired "$desired" --arg container "$container" '
                (.items | length) == $desired and
                (.items | all(
                  .metadata.deletionTimestamp == null and
                  .status.phase == "Running" and
                  ([.status.conditions[]? | select(.type == "Ready" and .status == "True")] | length) == 1 and
                  ([.status.containerStatuses[]? | select(.name == $container)] | length) == 1
                ))
              ' <<<"$pods_json" >/dev/null
            fi
            if ! jq -e \
                --arg container "$container" \
                --arg manifest "$expected_manifest" \
                --arg platform "$expected_platform" '
                  [
                    .items[] |
                    select(.metadata.deletionTimestamp == null) |
                    .status.containerStatuses[]? |
                    select(.name == $container)
                  ] as $statuses |
                  ($statuses | length) > 0 and
                  ($statuses | all(
                    .ready == true and
                    (
                      (.imageID | endswith("@" + $manifest)) or
                      (.imageID | endswith("@" + $platform))
                    )
                  ))
                ' <<<"$pods_json" >/dev/null; then
              observed_image_ids="$(
                jq -r \
                  --arg container "$container" '
                    [
                      .items[] |
                      select(.metadata.deletionTimestamp == null) |
                      .status.containerStatuses[]? |
                      select(.name == $container) |
                      (.imageID // "missing")
                    ] | unique | join(",")
                  ' <<<"$pods_json"
              )"
              echo "::error::Resume supporting pod image mismatch for ${service}: expected manifest ${expected_manifest} or ARM64 child ${expected_platform}, observed ${observed_image_ids:-none}"
              exit 1
            fi
          done

          if [ "$RESUME_MAINTENANCE_MODE" = "pre-runtime-hold" ] ||
             [ "$RESUME_MAINTENANCE_MODE" = "retained-hold" ]; then
            ./infra/oci/scripts/live-data-maintenance-stan.sh verify-held
            previous_holder_run="$PREREQUISITE_RUN_ID"
            previous_holder_source="$RESUME_SOURCE_SHA"
            previous_lock_snapshot="$RUNNER_TEMP/pre-runtime-lock.json"
            previous_lease_seconds=1800
            if [ "$RESUME_MAINTENANCE_MODE" = "retained-hold" ]; then
              previous_lock_snapshot="$RUNNER_TEMP/retained-lock.json"
              previous_lease_seconds=10800
            elif [ "$HELD_HANDOFF_RUN_ID" != "0" ]; then
              previous_holder_run="$HELD_HANDOFF_RUN_ID"
              previous_holder_source="$HELD_HANDOFF_SOURCE_SHA"
              previous_lease_seconds="$(
                jq -er '.held_handoff_run_id.held_handoff_lease_seconds |
                  select(type == "string" and test("^(1800|3600|7200)$"))' \
                  "$RUNNER_TEMP/live-data-upstream-result.json"
              )"
            fi
            python3 - "$previous_lock_snapshot" \
              "$OCI_K8S_NAMESPACE" "$previous_holder_run" \
              "$previous_holder_source" "$previous_lease_seconds" \
              "$NO_TAKEOVER_HANDOFF_QUALIFICATION" "$baseline_dir" <<'PY'
          import json, os, re, subprocess, sys, time
          from pathlib import Path
          def require(value):
              if not value:
                  raise SystemExit("inherited lock snapshot is invalid")
          path, namespace, predecessor_run, source, duration, qualification, baseline_dir = sys.argv[1:]
          require(re.fullmatch(r"[1-9][0-9]*", predecessor_run))
          require(re.fullmatch(r"[0-9a-f]{40}", source))
          result = subprocess.run(
              ["kubectl", "get", "configmap", "gaming-mongo-migration-lock",
               "-n", namespace, "-o", "json"], capture_output=True, check=True)
          lock = json.loads(result.stdout)
          meta, data = lock["metadata"], lock["data"]
          require(lock["kind"] == "ConfigMap" and lock["apiVersion"] == "v1")
          require(meta["name"] == "gaming-mongo-migration-lock")
          require(meta["namespace"] == namespace)
          require(data["state"] == "active")
          require(data["holder"] == f"live-data-{predecessor_run}-1")
          require(data["operation-id"] == "live-data-apply-slip-index")
          require(data["source-sha"] == source)
          require(re.fullmatch(r"[A-Za-z0-9._:-]+", meta["uid"]))
          require(re.fullmatch(r"[1-9][0-9]*", meta["resourceVersion"]))
          for key in ("acquired-at-epoch", "lease-duration-seconds",
                      "lease-until-epoch", "fencing-generation"):
              require(re.fullmatch(r"[1-9][0-9]*", data[key]))
              require(int(data[key]) < 9007199254740990)
          require(int(data["lease-duration-seconds"]) == int(duration))
          require(int(data["acquired-at-epoch"]) <= (
              int(data["lease-until-epoch"]) - int(data["lease-duration-seconds"])
          ) <= int(time.time()))
          require(data.get("released-at-epoch") == "0")
          if qualification == "expired-own-handoff":
              require(duration == "1800" and int(data["lease-until-epoch"]) < int(time.time()))
              services = {"auth", "bet", "backoffice", "client", "event", "gamemaster",
                          "moderation", "resulting", "slip", "telemetry"}
              supporting = {"auth", "client", "telemetry"}
              baseline = Path(baseline_dir)
              images = [line.split("\t") for line in (baseline / "images.tsv").read_text().splitlines()]
              desired = [line.split("\t") for line in (baseline / "deployments.tsv").read_text().splitlines()]
              require(len(images) == len(desired) == 10)
              require(all(len(row) == 5 for row in images))
              require(all(len(row) == 6 for row in desired))
              require({row[0] for row in images} == {row[0] for row in desired} == services)
              images = {row[0]: row for row in images}
              desired = {row[0]: row[3] for row in desired}
              deployments = json.loads(subprocess.run(
                  ["kubectl", "get", "deployment", *[f"gaming-{service}-depl"
                   for service in sorted(services)], "-n", namespace, "-o", "json"],
                  capture_output=True, check=True).stdout)
              items = deployments.get("items", [])
              require(len(items) == 10)
              require({item.get("metadata", {}).get("name") for item in items}
                      == {f"gaming-{service}-depl" for service in services})
              for item in items:
                  meta, spec, status = item.get("metadata", {}), item.get("spec", {}), item.get("status", {})
                  service = meta["name"].removeprefix("gaming-").removesuffix("-depl")
                  require(item.get("kind") == "Deployment" and item.get("apiVersion") == "apps/v1")
                  require(meta.get("namespace") == namespace
                          and isinstance(meta.get("uid"), str) and meta["uid"]
                          and type(meta.get("generation")) is int and meta["generation"] > 0)
                  require(type(status.get("observedGeneration")) is int
                          and status["observedGeneration"] == meta["generation"])
                  require(re.fullmatch(r"[1-9][0-9]*", desired[service]))
                  replicas = int(desired[service]) if service in supporting else 0
                  require(type(spec.get("replicas")) is int and spec["replicas"] == replicas)
                  require(all(type(status.get(key, 0)) is int and status.get(key, 0) == replicas
                              for key in ("replicas", "updatedReplicas", "readyReplicas", "availableReplicas")))
                  containers = [container for container in spec.get("template", {}).get("spec", {}).get("containers", [])
                                if container.get("name") == f"gaming-{service}"]
                  require(len(containers) == 1 and containers[0].get("image") == images[service][2])
                  if service == "gamemaster":
                      env = containers[0].get("env", [])
                      flags = [entry for entry in env if entry.get("name") == "LIVE_KICKOFFS_ENABLED"]
                      require(len(flags) == 1 and flags[0].get("value") == "false"
                              and "valueFrom" not in flags[0])
                      require(not any(entry.get("name") == "LIVE_KICKOFFS_LEASE_UNTIL_EPOCH" for entry in env))
              pods = json.loads(subprocess.run(
                  ["kubectl", "get", "pods", "-n", namespace, "-o", "json"],
                  capture_output=True, check=True).stdout)
              require(isinstance(pods.get("items"), list))
              for service in services:
                  selected = [pod for pod in pods["items"]
                              if pod.get("metadata", {}).get("labels", {}).get("app") == f"gaming-{service}"]
                  require(len(selected) == (int(desired[service]) if service in supporting else 0))
                  for pod in selected:
                      meta, status = pod.get("metadata", {}), pod.get("status", {})
                      require(isinstance(meta.get("uid"), str) and meta["uid"]
                              and meta.get("namespace") == namespace and meta.get("deletionTimestamp") is None
                              and status.get("phase") == "Running")
                      require(len([condition for condition in status.get("conditions", [])
                                   if condition.get("type") == "Ready" and condition.get("status") == "True"]) == 1)
                      containers = [container for container in status.get("containerStatuses", [])
                                    if container.get("name") == f"gaming-{service}"]
                      require(len(containers) == 1 and containers[0].get("ready") is True)
                      require(isinstance(containers[0].get("imageID"), str)
                              and any(containers[0]["imageID"].endswith("@" + digest)
                                      for digest in images[service][3:5]))
              runtime_path = str(Path(path).with_name("expired-handoff-runtime.json"))
              fd = os.open(runtime_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
              with os.fdopen(fd, "w") as output:
                  json.dump({"deployments": deployments, "pods": pods}, output)
                  output.flush()
                  os.fsync(output.fileno())
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "w") as output:
              json.dump(lock, output)
              output.flush()
              os.fsync(output.fileno())
          PY
          fi

          mkdir -p artifacts/oci-live-data-rollout/evidence
          resume_schema=live-betting-data-resume-v2
          [ "$HELD_HANDOFF_RUN_ID" = "0" ] || resume_schema=live-betting-data-resume-v5
          cat >artifacts/oci-live-data-rollout/evidence/resume-authority.env <<EOF
          schema_version=$resume_schema
          applied_data_run_id=$RESOLVED_APPLIED_DATA_RUN_ID
          applied_source_sha=$RESOLVED_APPLIED_SOURCE_SHA
          failed_deploy_run_id=$FAILED_DEPLOY_RUN_ID
          resume_maintenance_mode=$RESUME_MAINTENANCE_MODE
          failed_deploy_job_conclusion=${{ steps.provenance_request.outputs.failed_deploy_job_conclusion }}
          public_validate_job_conclusion=${{ steps.provenance_request.outputs.public_validate_job_conclusion }}
          lock_release_step_conclusion=${{ steps.provenance_request.outputs.lock_release_step_conclusion }}
          fence_release_step_conclusion=${{ steps.provenance_request.outputs.fence_release_step_conclusion }}
          rehold_step_conclusion=${{ steps.provenance_request.outputs.rehold_step_conclusion }}
          failed_activation_run_id=$FAILED_ACTIVATION_RUN_ID
          current_source_sha=$SOURCE_SHA
          baseline_sha256=$observed_baseline_sha
          runtime_images_sha256=$(sha256sum "$resume_images" | awk '{print $1}')
          checkpoint_source_sha=$CHECKPOINT_SOURCE_SHA
          disk_checkpoint_run_id=$DISK_CHECKPOINT_RUN_ID
          disk_checkpoint_sha256=${{ steps.provenance.outputs.disk_checkpoint_sha256 }}
          disk_checkpoint_disposition=${{ steps.provenance.outputs.disk_checkpoint_disposition }}
          application_change_scope=github-infra-docs-only
          status=PASS
          EOF
          if [ "$HELD_HANDOFF_RUN_ID" != "0" ]; then
            held_evidence_sha="$(
              jq -er '.held_handoff_run_id.held_handoff_evidence_sha256 |
                select(type == "string" and test("^[0-9a-f]{64}$"))' \
                "$RUNNER_TEMP/live-data-upstream-result.json"
            )"
            {
              printf 'held_handoff_run_id=%s\n' "$HELD_HANDOFF_RUN_ID"
              printf 'held_handoff_source_sha=%s\n' "$HELD_HANDOFF_SOURCE_SHA"
              printf 'held_handoff_evidence_sha256=%s\n' "$held_evidence_sha"
            } >>artifacts/oci-live-data-rollout/evidence/resume-authority.env
          fi

      - name: Capture and validate pre-mutation rollback baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUTPUT_DIR: artifacts/oci-data-baseline-before
          BASELINE_RECOVERY_SOURCE_SHA: ${{ inputs.baseline_recovery_source_sha }}
          OCI_PUBLIC_URL: ${{ steps.provenance.outputs.public_url }}
          OCI_REDIRECT_URL: ${{ steps.provenance.outputs.redirect_url }}
          OCI_DIAGNOSTIC_URL: ${{ steps.provenance.outputs.diagnostic_url }}
          SSE_REQUIREMENT: deployed-source
          RELEASED_ACTIVATION_QUALIFICATION: ${{ steps.provenance_request.outputs.released_activation_qualification || 'none' }}
        run: |
          set -euo pipefail
          if [ "$RELEASED_ACTIVATION_QUALIFICATION" = "pre-arm-no-account" ]; then
            [ "$FAILED_ACTIVATION_USER_ID" = "0" ]
            [ -f artifacts/oci-data-baseline-before/SHA256SUMS ]
            [ ! -e artifacts/oci-data-baseline-original ]
            mv artifacts/oci-data-baseline-before artifacts/oci-data-baseline-original
          fi
          if [ "$FAILED_DEPLOY_RUN_ID" != "0" ] &&
             [ "$FAILED_ACTIVATION_RUN_ID" = "0" ]; then
            [ -f artifacts/oci-data-baseline-before/SHA256SUMS ]
          elif [ "$BASELINE_RECOVERY_RUN_ID" = "0" ]; then
            ./infra/oci/scripts/baseline-capture-stan.sh
          else
            BASELINE_RECOVERY_DIR=artifacts/recovery \
              ./infra/oci/scripts/baseline-capture-stan.sh
          fi
          if [ "$PHASE" = "apply-slip-index" ]; then
            source ./infra/oci/scripts/lib.sh || exit 1
            expected_baseline_source_sha=
            expected_recovery_run_id=
            if [ "$BASELINE_RECOVERY_RUN_ID" = "0" ]; then
              [ "$BASELINE_RECOVERY_SOURCE_SHA" = "none" ] ||
                oci_die "baseline recovery source requires a selected recovery run"
              if [ "$FAILED_DEPLOY_RUN_ID" = "0" ] ||
                 [ "$FAILED_ACTIVATION_RUN_ID" != "0" ]; then
                expected_recovery_run_id=0
              fi
            else
              [[ "$BASELINE_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ &&
                 "$BASELINE_RECOVERY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
                oci_die "selected baseline recovery requires its authenticated source SHA"
              expected_baseline_source_sha="$BASELINE_RECOVERY_SOURCE_SHA"
              expected_recovery_run_id="$BASELINE_RECOVERY_RUN_ID"
            fi
            EXPECTED_SOURCE_SHA="$expected_baseline_source_sha" \
            EXPECTED_NAMESPACE="$OCI_K8S_NAMESPACE" \
            EXPECTED_RECOVERY_RUN_ID="$expected_recovery_run_id" \
            REQUIRE_CURRENT_DEPLOY_PROVENANCE=true \
              oci_require_retained_telemetry_restore_profile "$OUTPUT_DIR" ||
              oci_die "final data handoff baseline validation failed"
          fi
          printf 'BASELINE_SHA256=%s\n' \
            "$(sha256sum artifacts/oci-data-baseline-before/SHA256SUMS | awk '{print $1}')" \
            >> "$GITHUB_ENV"

      - name: Verify reader-qualified released activation state
        if: steps.provenance_request.outputs.released_activation_qualification == 'pre-arm-no-account'
        env:
          MODE: dark
          EXPECTED_LIVE_KICKOFFS_ENABLED: "false"
          BASE_URL: ${{ steps.provenance.outputs.public_url }}
          SECONDARY_PUBLIC_URL: ${{ steps.provenance.outputs.redirect_url }}
          DIAGNOSTIC_URL: ${{ steps.provenance.outputs.diagnostic_url }}
          NAMESPACE: ${{ env.OCI_K8S_NAMESPACE }}
          IMAGE_PROVENANCE_FILE: artifacts/oci-live-data-rollout/images.tsv
          OUTPUT_DIR: artifacts/oci-live-data-rollout/released-activation-readiness
        run: |
          set -euo pipefail
          umask 077
          ./infra/oci/agents/live-betting-readiness-stan.sh
          kubectl get deployment gaming-gamemaster-depl -n "$OCI_K8S_NAMESPACE" -o json \
            >"$RUNNER_TEMP/released-activation-gamemaster.json"
          kubectl get configmap gaming-mongo-migration-lock -n "$OCI_K8S_NAMESPACE" -o json \
            >"$RUNNER_TEMP/released-activation-lock.json"
          python3 - "$RUNNER_TEMP/live-data-upstream-result.json" \
            "$RUNNER_TEMP/released-activation-gamemaster.json" \
            "$RUNNER_TEMP/released-activation-lock.json" \
            "$RESUME_SOURCE_SHA" "$PREREQUISITE_RUN_ID" "$FAILED_ACTIVATION_RUN_ID" \
            "$GITHUB_RUN_ID" "$FAILED_ACTIVATION_USER_ID" "$OCI_K8S_NAMESPACE" <<'PY'
          import importlib.util, json, re, sys, time
          from pathlib import Path
          spec = importlib.util.spec_from_file_location(
              "upstream_binding", "infra/oci/scripts/upstream_run_binding_stan.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result_path, deployment_path, lock_path, source, data_run, activation_run, run, user, namespace = sys.argv[1:]
          result = json.loads(Path(result_path).read_bytes()).get("failed_activation_run_id")
          def require(value, message):
              if not value:
                  module.fail(message)
          require(isinstance(result, dict) and set(result) == {
              "released_activation_qualification", "resume_maintenance_mode",
              "activation_deployment_run_id", "applied_data_run_id", "applied_source_sha",
              "baseline_run_id", "baseline_artifact_name"},
              "released physical admission has an incomplete reader result")
          require(all(isinstance(value, str) for value in result.values())
                  and result["released_activation_qualification"] == "pre-arm-no-account"
                  and result["resume_maintenance_mode"] == "released-runtime" and user == "0",
                  "released physical admission lacks pre-arm qualification")
          require(all(re.fullmatch(r"[1-9][0-9]*", value) for value in (
                      activation_run, data_run, run, result["activation_deployment_run_id"],
                      result["applied_data_run_id"], result["baseline_run_id"]))
                  and re.fullmatch(r"[0-9a-f]{40}", source)
                  and re.fullmatch(r"[0-9a-f]{40}", result["applied_source_sha"])
                  and result["baseline_artifact_name"] ==
                      f'oci-production-baseline-{result["baseline_run_id"]}-1',
                  "released physical admission lacks failed activation")
          baseline = module.parse_env(
              Path("artifacts/oci-data-baseline-before/baseline-provenance.env").read_bytes(),
              "fresh released baseline")
          require(
              baseline.get("baseline_source_sha") == source
              and baseline.get("baseline_deploy_run_id") == result["activation_deployment_run_id"]
              and baseline.get("baseline_capture_run_id") == run
              and baseline.get("baseline_capture_run_attempt") == "1"
              and run != result["applied_data_run_id"],
              "fresh released baseline substituted the deployment or original root")
          original = Path("artifacts/oci-data-baseline-original")
          require(original.is_dir() and not original.is_symlink()
                  and not any(path.is_symlink() for path in original.rglob("*")),
                  "original rollback baseline is unavailable")
          original_files = {
              path.relative_to(original).as_posix(): path.read_bytes()
              for path in original.rglob("*") if path.is_file()}
          original_sha = module.validate_checksum_manifest(original_files, "original rollback baseline")
          original_provenance = module.parse_env(
              (original / "baseline-provenance.env").read_bytes(), "original rollback baseline")
          predecessor = module.parse_env(
              Path("artifacts/prerequisite/provenance.env").read_bytes(), "authenticated predecessor")
          require(original_provenance.get("baseline_capture_run_id") == result["applied_data_run_id"]
                  and original_sha == predecessor.get("baseline_sha256"),
                  "fresh capture replaced the original applied rollback baseline")
          deployment = json.loads(Path(deployment_path).read_bytes())
          meta = deployment.get("metadata", {})
          require(deployment.get("kind") == "Deployment" and deployment.get("apiVersion") == "apps/v1"
                  and meta.get("name") == "gaming-gamemaster-depl"
                  and meta.get("namespace") == namespace
                  and isinstance(meta.get("uid"), str) and meta["uid"]
                  and type(meta.get("generation")) is int and meta["generation"] > 0,
                  "released gamemaster identity is unavailable")
          containers = deployment.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [])
          containers = [item for item in containers if item.get("name") == "gaming-gamemaster"]
          require(len(containers) == 1, "released gamemaster container is ambiguous")
          env = containers[0].get("env", [])
          flags = [item.get("value") for item in env if item.get("name") == "LIVE_KICKOFFS_ENABLED"]
          require(flags == ["false"], "released gamemaster must explicitly remain dark")
          require(not any(item.get("name") == "LIVE_KICKOFFS_LEASE_UNTIL_EPOCH" for item in env),
                  "released gamemaster activation lease must be absent")
          lock = json.loads(Path(lock_path).read_bytes())
          meta, data = lock.get("metadata", {}), lock.get("data", {})
          require(
              lock.get("kind") == "ConfigMap" and lock.get("apiVersion") == "v1"
              and meta.get("name") == "gaming-mongo-migration-lock"
              and meta.get("namespace") == namespace
              and all(isinstance(value, str) for value in [*data.values(), meta.get("uid"),
                                                           meta.get("resourceVersion")])
              and re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", meta.get("uid", ""))
              and re.fullmatch(r"[1-9][0-9]*", meta.get("resourceVersion", ""))
              and data.get("state") == "released" and data.get("holder") == ""
              and data.get("operation-id") == "live-data-apply-slip-index"
              and data.get("source-sha") == source
              and data.get("lease-until-epoch") == "0"
              and re.fullmatch(r"[1-9][0-9]*", data.get("released-at-epoch", ""))
              and re.fullmatch(r"[1-9][0-9]{0,15}", data.get("fencing-generation", ""))
              and int(data["fencing-generation"]) < 9007199254740991,
              "released lock is missing, foreign, active or malformed")
          require(all(re.fullmatch(r"[1-9][0-9]{0,15}", data.get(key, "")) for key in (
                      "acquired-at-epoch", "released-at-epoch"))
                  and data.get("lease-duration-seconds") == "0"
                  and int(data["acquired-at-epoch"]) <= int(data["released-at-epoch"]) <= int(time.time()),
                  "released lock lacks legitimate release chronology")
          PY

      - name: Revalidate exact release disk checkpoint before lock mutation
        if: env.OCI_RUNTIME_MODE == 'k3s'
        env:
          RESUME_MAINTENANCE_MODE: ${{ steps.provenance_request.outputs.resume_maintenance_mode || 'none' }}
          RELEASED_ACTIVATION_QUALIFICATION: ${{ steps.provenance_request.outputs.released_activation_qualification || 'none' }}
          SESSION_STATE_FILE: artifacts/oci-live-data-rollout/k3s-access.env
          INFRA_PROVENANCE_FILE: artifacts/infrastructure/provenance.env
          CANDIDATE_IMAGES_FILE: artifacts/oci-live-data-rollout/images.tsv
          CHECKPOINT_FILE: artifacts/disk-checkpoint/checkpoint.json
          WORK_DIR: ${{ runner.temp }}/live-data-disk-checkpoint
        run: |
          set -euo pipefail
          profile=public
          if [ "$FAILED_DEPLOY_RUN_ID" != "0" ] &&
             [ "$FAILED_ACTIVATION_RUN_ID" = "0" ] &&
             { [ "$RESUME_MAINTENANCE_MODE" = "retained-hold" ] ||
               [ "$RESUME_MAINTENANCE_MODE" = "pre-runtime-hold" ]; }; then
            profile=held
          elif [[ "$FAILED_DEPLOY_RUN_ID" =~ ^[1-9][0-9]*$ ]] &&
               [ "$FAILED_ACTIVATION_RUN_ID" = "0" ] &&
               [ "$RESUME_MAINTENANCE_MODE" = "released-runtime" ]; then
            profile=released-runtime
          elif [[ "$FAILED_ACTIVATION_RUN_ID" =~ ^[1-9][0-9]*$ ]] &&
               { [ "$RELEASED_ACTIVATION_QUALIFICATION" = "pre-arm-no-account" ] ||
                 [ "$RELEASED_ACTIVATION_QUALIFICATION" = "cleanup-required" ]; } &&
               [ "$RESUME_MAINTENANCE_MODE" = "released-runtime" ]; then
            profile=released-runtime
          fi
          SOURCE_SHA="$CHECKPOINT_SOURCE_SHA" \
          CONTROL_SHA="$CHECKPOINT_SOURCE_SHA" \
          GHCR_BUILD_RUN_ID="$BUILD_RUN_ID" \
          DISK_CHECKPOINT_RUN_ID="$DISK_CHECKPOINT_RUN_ID" \
          REVALIDATION_PROFILE="$profile" \
            ./infra/oci/scripts/k3s-node-disk-recovery-stan.sh revalidate

      - name: Acquire database operation lock
        id: operation_lock
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXCLUDE_RUN_ID: ${{ github.run_id }}
          RELEASED_ACTIVATION_QUALIFICATION: ${{ steps.provenance_request.outputs.released_activation_qualification || 'none' }}
          NO_TAKEOVER_HANDOFF_QUALIFICATION: ${{ steps.provenance_request.outputs.no_takeover_handoff_qualification || 'none' }}
        run: |
          set -euo pipefail
          RELEASED_ACTIVATION_QUALIFICATION="${RELEASED_ACTIVATION_QUALIFICATION:-none}"
          NO_TAKEOVER_HANDOFF_QUALIFICATION="${NO_TAKEOVER_HANDOFF_QUALIFICATION:-none}"
          case "$NO_TAKEOVER_HANDOFF_QUALIFICATION" in
            none) ;;
            expired-own-handoff)
              [ "${{ steps.provenance_request.outputs.resume_maintenance_mode }}" = pre-runtime-hold ]
              [ "$FAILED_ACTIVATION_RUN_ID" = 0 ] && [ "$HELD_HANDOFF_RUN_ID" = 0 ]
              ;;
            *) echo "unsupported native no-takeover qualification" >&2; exit 1 ;;
          esac
          if [ "$FAILED_ACTIVATION_RUN_ID" != "0" ] &&
             [ "${CONFIRMATION:-}" = "RESUME APPLIED LIVE DATA FROM RELEASED RUNTIME AND CLEAN FAILED ACTIVATION EXACT SHA" ]; then
            case "$RELEASED_ACTIVATION_QUALIFICATION" in
              pre-arm-no-account) [ "$FAILED_ACTIVATION_USER_ID" = "0" ] || exit 1 ;;
              cleanup-required) [[ "$FAILED_ACTIVATION_USER_ID" =~ ^[0-9a-f]{24}$ ]] || exit 1 ;;
              *) echo "released activation reader qualification is required" >&2; exit 1 ;;
            esac
          elif [ "$FAILED_ACTIVATION_RUN_ID" != "0" ] &&
               [ "$FAILED_ACTIVATION_USER_ID" = "0" ]; then
            echo "pre-arm sentinel requires the qualified released operation" >&2
            exit 1
          fi
          if [ "$RELEASED_ACTIVATION_QUALIFICATION" = "pre-arm-no-account" ]; then
            umask 077
            [ "$FAILED_ACTIVATION_USER_ID" = "0" ]
            snapshot="$RUNNER_TEMP/released-activation-lock.json"
            [ -f "$snapshot" ] && [ ! -L "$snapshot" ]
            generation="$RUNNER_TEMP/released-activation-gamemaster.json"
            [ -f "$generation" ] && [ ! -L "$generation" ]
            kubectl get deployment gaming-gamemaster-depl -n "$OCI_K8S_NAMESPACE" -o json \
              >"$RUNNER_TEMP/released-activation-gamemaster-current.json"
            jq -es '
              length == 2 and .[0].metadata.uid == .[1].metadata.uid and
              .[0].metadata.generation == .[1].metadata.generation and
              .[0].spec.template == .[1].spec.template
            ' "$generation" "$RUNNER_TEMP/released-activation-gamemaster-current.json" \
              >/dev/null || { echo "released generation changed before acquisition" >&2; exit 1; }
            kubectl get configmap gaming-mongo-migration-lock -n "$OCI_K8S_NAMESPACE" -o json \
              >"$RUNNER_TEMP/released-activation-lock-current.json"
            jq -es '
              length == 2 and .[0].metadata.uid == .[1].metadata.uid and
              .[0].metadata.resourceVersion == .[1].metadata.resourceVersion and
              .[0].data == .[1].data
            ' "$snapshot" "$RUNNER_TEMP/released-activation-lock-current.json" \
              >/dev/null || { echo "released lock changed before acquisition" >&2; exit 1; }
            expected_uid="$(jq -er '.metadata.uid' "$snapshot")"
            expected_generation="$(jq -er '.data["fencing-generation"]' "$snapshot")"
            if ! acquisition_result="$(
              NAMESPACE="$OCI_K8S_NAMESPACE" \
            LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
            OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
            SOURCE_SHA="$SOURCE_SHA" \
            LOCK_LEASE_SECONDS="$SHARED_MONGO_LOCK_LEASE_SECONDS" \
            EXPECTED_LOCK_UID="$expected_uid" \
            EXPECTED_FENCING_GENERATION="$expected_generation" \
              ./infra/azure/agents/shared-mongo-operation-lock-stan.sh acquire-released
            )"; then
              printf '%s\n' "$acquisition_result"
              exit 1
            fi
            printf '%s\n' "$acquisition_result"
            [[ "$acquisition_result" == "shared_mongo_lock=acquire-released status=PASS "* &&
               "$acquisition_result" == *" fencing_generation=$((expected_generation + 1))" &&
               "$acquisition_result" != *$'\n'* ]] || exit 1
            if ! verification_result="$(
              NAMESPACE="$OCI_K8S_NAMESPACE" \
            LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
            OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
            SOURCE_SHA="$SOURCE_SHA" \
              ./infra/azure/agents/shared-mongo-operation-lock-stan.sh verify
            )"; then
              printf '%s\n' "$verification_result"
              exit 1
            fi
            printf '%s\n' "$verification_result"
            [[ "$verification_result" == "shared_mongo_lock=verify status=PASS "* &&
               "$verification_result" != *$'\n'* ]] || exit 1
            exit 0
          fi
          resume_mode="${{ steps.provenance_request.outputs.resume_maintenance_mode }}"
          retained_transfer=false
          if [ "$resume_mode" = "retained-hold" ] &&
             [ "$FAILED_ACTIVATION_RUN_ID" = "0" ] &&
             [ "$FAILED_DEPLOY_RUN_ID" != "0" ]; then
            retained_transfer=true
          fi
          record_transfer() {
            [ "$resume_mode" = "pre-runtime-hold" ] || return 0
            [ "$HELD_HANDOFF_RUN_ID" != "0" ] || return 0
            python3 - \
              artifacts/oci-live-data-rollout/evidence/held-handoff-transfer.json \
              "$RUNNER_TEMP/pre-runtime-lock.json" \
              "$HELD_HANDOFF_RUN_ID" "$HELD_HANDOFF_SOURCE_SHA" \
              "$GITHUB_RUN_ID" "$SOURCE_SHA" "$1" "$2" <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location(
              "upstream_binding", "infra/oci/scripts/upstream_run_binding_stan.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.record_held_handoff_transfer(*sys.argv[1:])
          PY
          }
          if [ "$resume_mode" = "pre-runtime-hold" ] || [ "$retained_transfer" = true ]; then
            snapshot="$RUNNER_TEMP/pre-runtime-lock.json"
            strict_transfer=false
            if [ "$retained_transfer" = true ]; then
              snapshot="$RUNNER_TEMP/retained-lock.json"
              strict_transfer=true
            elif [ "$HELD_HANDOFF_RUN_ID" != "0" ] ||
                 [ "$NO_TAKEOVER_HANDOFF_QUALIFICATION" = expired-own-handoff ]; then
              strict_transfer=true
            fi
            [ -f "$snapshot" ] && [ ! -L "$snapshot" ]
            expected_uid="$(jq -er '.metadata.uid' "$snapshot")"
            observed_generation="$(jq -er '.data["fencing-generation"]' "$snapshot")"
            released_generation="$((observed_generation + 1))"
            if [ "$strict_transfer" = true ]; then
              ./infra/azure/agents/production-run-exclusivity-stan.sh
              if [ "$HELD_HANDOFF_RUN_ID" != "0" ]; then
                [ ! -e artifacts/oci-live-data-rollout/evidence/held-handoff-transfer.json ] &&
                  [ ! -L artifacts/oci-live-data-rollout/evidence/held-handoff-transfer.json ]
                umask 077
                transfer_dir="$RUNNER_TEMP/held-pre-transfer"
                mkdir -m 700 "$transfer_dir"
                if [ "$OCI_RUNTIME_MODE" = k3s ]; then
                  SESSION_STATE_FILE=artifacts/oci-live-data-rollout/k3s-access.env \
                  INFRA_PROVENANCE_FILE=artifacts/infrastructure/provenance.env \
                  CANDIDATE_IMAGES_FILE=artifacts/oci-live-data-rollout/images.tsv \
                  CHECKPOINT_FILE=artifacts/disk-checkpoint/checkpoint.json \
                  WORK_DIR="$RUNNER_TEMP/held-pre-transfer-disk-checkpoint" \
                  CONTROL_SHA="$SOURCE_SHA" SOURCE_SHA="$CHECKPOINT_SOURCE_SHA" \
                  GHCR_BUILD_RUN_ID="$BUILD_RUN_ID" DISK_CHECKPOINT_RUN_ID="$DISK_CHECKPOINT_RUN_ID" \
                  REVALIDATION_PROFILE=held \
                    ./infra/oci/scripts/k3s-node-disk-recovery-stan.sh revalidate
                fi
                BASELINE_DIR=artifacts/oci-data-baseline-before \
                EXPECTED_NAMESPACE="$OCI_K8S_NAMESPACE" REQUIRE_CURRENT_DEPLOY_PROVENANCE=true \
                  ./infra/oci/scripts/validate-rollback-baseline-stan.sh
                ./infra/oci/scripts/live-data-maintenance-stan.sh verify-held
                [ "$(gh api "repos/$REPO/commits/master" --jq .sha)" = "$SOURCE_SHA" ]
                [ "$(gh api "repos/$REPO/actions/workflows/oci-live-data-rollout.yml" --jq .state)" = disabled_manually ]
                for path in .github/workflows/oci-live-data-rollout.yml \
                  infra/azure/agents/copilot-cli-protected-operation-policy-stan.sh; do
                  [ "$(gh api "repos/$REPO/contents/$path?ref=$SOURCE_SHA" --jq .sha)" = \
                    "$(git rev-parse "$SOURCE_SHA:$path")" ]
                done
                services=(auth bet backoffice client event gamemaster moderation resulting slip telemetry)
                deployments=()
                for service in "${services[@]}"; do deployments+=("gaming-${service}-depl"); done
                kubectl get deployment "${deployments[@]}" -n "$OCI_K8S_NAMESPACE" -o json \
                  >"$transfer_dir/deployments.json"
                kubectl get pods -n "$OCI_K8S_NAMESPACE" -o json \
                  >"$transfer_dir/pods.json"
                kubectl get configmap gaming-mongo-migration-lock -n "$OCI_K8S_NAMESPACE" -o json \
                  >"$transfer_dir/lock.json"
                python3 - "$snapshot" "$transfer_dir" \
                  "$RUNNER_TEMP/live-data-upstream-result.json" "$OCI_K8S_NAMESPACE" \
                  "$HELD_HANDOFF_RUN_ID" "$HELD_HANDOFF_SOURCE_SHA" "$GITHUB_RUN_ID" "$SOURCE_SHA" <<'PY'
          import importlib.util, json, os, stat, sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location(
              "upstream_binding", "infra/oci/scripts/upstream_run_binding_stan.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          snapshot, temporary, upstream_result, namespace, held_run, held_source, run, source = sys.argv[1:]
          temporary = Path(temporary)
          baseline = Path("artifacts/oci-data-baseline-before")
          if baseline.is_symlink() or any(path.is_symlink() for path in baseline.rglob("*")):
              raise SystemExit("original held rollback baseline contains a symbolic link")
          baseline_files = {
              path.relative_to(baseline).as_posix(): path.read_bytes()
              for path in baseline.rglob("*") if path.is_file()}
          upstream_result = Path(upstream_result)
          descriptor = None
          try:
              path_status = upstream_result.lstat()
              if (
                  stat.S_ISLNK(path_status.st_mode)
                  or not stat.S_ISREG(path_status.st_mode)
              ):
                  raise ValueError
              descriptor = os.open(
                  upstream_result,
                  os.O_RDONLY | getattr(os, "O_NOFOLLOW", 0))
              open_status = os.fstat(descriptor)
              if (
                  not stat.S_ISREG(open_status.st_mode)
                  or (open_status.st_dev, open_status.st_ino)
                  != (path_status.st_dev, path_status.st_ino)
              ):
                  raise ValueError
              with os.fdopen(descriptor, "r", encoding="utf-8") as source_file:
                  descriptor = None
                  result = json.load(source_file)
              final_status = upstream_result.lstat()
              if (
                  stat.S_ISLNK(final_status.st_mode)
                  or not stat.S_ISREG(final_status.st_mode)
                  or (final_status.st_dev, final_status.st_ino)
                  != (path_status.st_dev, path_status.st_ino)
              ):
                  raise ValueError
          except (OSError, UnicodeError, ValueError):
              raise SystemExit("initial upstream result is unavailable or invalid")
          finally:
              if descriptor is not None:
                  os.close(descriptor)
          if type(result) is not dict:
              raise SystemExit("initial upstream result root must be an object")
          authority = module.parse_env(
              Path("artifacts/oci-live-data-rollout/evidence/resume-authority.env").read_bytes(),
              "held transfer resume authority")
          fresh = result.get("held_handoff_run_id")
          if type(fresh) is not dict:
              raise SystemExit("initial held-handoff authority must be an object")
          if any(authority.get(key) != fresh.get(key) for key in (
              "applied_data_run_id", "applied_source_sha", "failed_deploy_run_id", "baseline_sha256",
              "held_handoff_run_id", "held_handoff_source_sha", "held_handoff_evidence_sha256")):
              raise SystemExit("local held authority differs from its fresh authenticated root")
          module.validate_held_transfer_runtime(
              json.loads(Path(snapshot).read_bytes()),
              json.loads((temporary / "lock.json").read_bytes()),
              json.loads((temporary / "deployments.json").read_bytes()),
              json.loads((temporary / "pods.json").read_bytes()),
              baseline_files, authority, namespace, held_run, held_source, run, source,
              fresh.get("held_handoff_lease_until_epoch", ""),
              fresh.get("held_handoff_fencing_generation", ""),
              fresh["held_handoff_lease_seconds"])
          PY
              fi
              record_transfer release unconfirmed
            fi
            if [ "$NO_TAKEOVER_HANDOFF_QUALIFICATION" = expired-own-handoff ]; then
              runtime="$RUNNER_TEMP/expired-handoff-runtime.json"
              [ -f "$runtime" ] && [ ! -L "$runtime" ]
              services=(auth bet backoffice client event gamemaster moderation resulting slip telemetry)
              deployments=()
              for service in "${services[@]}"; do deployments+=("gaming-${service}-depl"); done
              kubectl get deployment "${deployments[@]}" -n "$OCI_K8S_NAMESPACE" -o json \
                >"$RUNNER_TEMP/expired-handoff-deployments-current.json"
              kubectl get pods -n "$OCI_K8S_NAMESPACE" -o json \
                >"$RUNNER_TEMP/expired-handoff-pods-current.json"
              jq -en --slurpfile before "$runtime" \
                --slurpfile deployments "$RUNNER_TEMP/expired-handoff-deployments-current.json" \
                --slurpfile pods "$RUNNER_TEMP/expired-handoff-pods-current.json" '
                def deployments($list):
                  [$list.items[] | {kind, apiVersion, name: .metadata.name,
                    namespace: .metadata.namespace, uid: .metadata.uid,
                    generation: .metadata.generation, spec,
                    status: {observedGeneration: .status.observedGeneration,
                      replicas: (.status.replicas // 0), updatedReplicas: (.status.updatedReplicas // 0),
                      readyReplicas: (.status.readyReplicas // 0), availableReplicas: (.status.availableReplicas // 0)}}]
                  | sort_by(.name);
                def pods($list):
                  [$list.items[] | select(.metadata.labels.app |
                    IN("gaming-auth", "gaming-bet", "gaming-backoffice", "gaming-client",
                      "gaming-event", "gaming-gamemaster", "gaming-moderation", "gaming-resulting",
                      "gaming-slip", "gaming-telemetry")) |
                    {name: .metadata.name, namespace: .metadata.namespace, uid: .metadata.uid,
                     deletionTimestamp: .metadata.deletionTimestamp, ownerReferences: .metadata.ownerReferences,
                     spec, phase: .status.phase, conditions: .status.conditions,
                     containerStatuses: .status.containerStatuses}] | sort_by(.uid);
                ($before | length) == 1 and ($deployments | length) == 1 and ($pods | length) == 1 and
                ($deployments[0].items | length) == 10 and
                deployments($before[0].deployments) == deployments($deployments[0]) and
                pods($before[0].pods) == pods($pods[0])
              ' >/dev/null || { echo "expired-handoff workload changed before release" >&2; exit 1; }
              ./infra/oci/scripts/live-data-maintenance-stan.sh verify-held
              kubectl get configmap gaming-mongo-migration-lock -n "$OCI_K8S_NAMESPACE" -o json \
                >"$RUNNER_TEMP/expired-handoff-lock-current.json"
              jq -es '
                length == 2 and .[0].metadata.uid == .[1].metadata.uid and
                .[0].metadata.resourceVersion == .[1].metadata.resourceVersion and
                .[0].data == .[1].data and
                (.[1].data["lease-until-epoch"] | tonumber) < now
              ' "$snapshot" "$RUNNER_TEMP/expired-handoff-lock-current.json" \
                >/dev/null || { echo "expired own lock changed before release" >&2; exit 1; }
            fi
            [ "$retained_transfer" != true ] ||
              echo "retained_lock_transfer=release status=UNCONFIRMED"
            if ! release_result="$(
              NAMESPACE="$OCI_K8S_NAMESPACE" \
              LOCK_TOKEN="$(jq -er '.data.holder' "$snapshot")" \
              OPERATION_ID="$(jq -er '.data["operation-id"]' "$snapshot")" \
              SOURCE_SHA="$(jq -er '.data["source-sha"]' "$snapshot")" \
              EXPECTED_LOCK_UID="$expected_uid" \
              EXPECTED_RESOURCE_VERSION="$(jq -er '.metadata.resourceVersion' "$snapshot")" \
              EXPECTED_FENCING_GENERATION="$observed_generation" \
              EXPECTED_LEASE_UNTIL_EPOCH="$(jq -er '.data["lease-until-epoch"]' "$snapshot")" \
                ./infra/azure/agents/shared-mongo-operation-lock-stan.sh release 2>&1
            )"; then
              printf '%s\n' "$release_result"
              exit 1
            fi
            printf '%s\n' "$release_result"
            [[ "$release_result" == "shared_mongo_lock=release status=PASS "* ]] || exit 1
            [[ "$release_result" == *" strict_snapshot=true fencing_generation=$released_generation" ]] || exit 1
            if [ "$strict_transfer" = true ]; then
              [[ "$release_result" != *$'\n'* ]] || exit 1
            fi
            record_transfer release confirmed
            if [ "$NO_TAKEOVER_HANDOFF_QUALIFICATION" = expired-own-handoff ]; then
              kubectl get configmap gaming-mongo-migration-lock -n "$OCI_K8S_NAMESPACE" -o json |
                jq -e --arg uid "$expected_uid" --arg namespace "$OCI_K8S_NAMESPACE" \
                  --arg source "$(jq -er '.data["source-sha"]' "$snapshot")" \
                  --arg generation "$released_generation" '
                  .kind == "ConfigMap" and .apiVersion == "v1" and
                  .metadata.name == "gaming-mongo-migration-lock" and .metadata.namespace == $namespace and
                  .metadata.uid == $uid and (.metadata.resourceVersion | test("^[1-9][0-9]*$")) and
                  .data.state == "released" and .data.holder == "" and
                  .data["operation-id"] == "live-data-apply-slip-index" and .data["source-sha"] == $source and
                  .data["fencing-generation"] == $generation and
                  .data["lease-duration-seconds"] == "0" and .data["lease-until-epoch"] == "0" and
                  (.data["released-at-epoch"] | test("^[1-9][0-9]*$")) and
                  (.data["released-at-epoch"] | tonumber) <= now
                ' >/dev/null || { echo "expired handoff did not confirm canonical release" >&2; exit 1; }
            fi
            record_transfer acquire unconfirmed
            [ "$retained_transfer" != true ] ||
              echo "retained_lock_transfer=release status=CONFIRMED acquire=UNCONFIRMED"
            if ! acquisition_result="$(
              NAMESPACE="$OCI_K8S_NAMESPACE" \
            LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
            OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
            SOURCE_SHA="$SOURCE_SHA" \
            LOCK_LEASE_SECONDS="$SHARED_MONGO_LOCK_LEASE_SECONDS" \
            EXPECTED_LOCK_UID="$expected_uid" \
            EXPECTED_FENCING_GENERATION="$released_generation" \
                ./infra/azure/agents/shared-mongo-operation-lock-stan.sh acquire-released 2>&1
            )"; then
              printf '%s\n' "$acquisition_result"
              exit 1
            fi
            printf '%s\n' "$acquisition_result"
            if [ "$strict_transfer" = true ]; then
              [[ "$acquisition_result" == "shared_mongo_lock=acquire-released status=PASS "* ]] || exit 1
              [[ "$acquisition_result" == *" fencing_generation=$((released_generation + 1))" ]] || exit 1
              [[ "$acquisition_result" != *$'\n'* ]] || exit 1
            fi
            record_transfer acquire confirmed
            record_transfer verify unconfirmed
            [ "$retained_transfer" != true ] ||
              echo "retained_lock_transfer=acquire status=CONFIRMED verify=UNCONFIRMED"
            if ! verification_result="$(
              NAMESPACE="$OCI_K8S_NAMESPACE" \
            LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
            OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
            SOURCE_SHA="$SOURCE_SHA" \
                ./infra/azure/agents/shared-mongo-operation-lock-stan.sh verify 2>&1
            )"; then
              printf '%s\n' "$verification_result"
              exit 1
            fi
            printf '%s\n' "$verification_result"
            if [ "$strict_transfer" = true ]; then
              [[ "$verification_result" == "shared_mongo_lock=verify status=PASS "* ]] || exit 1
              [[ "$verification_result" != *$'\n'* ]] || exit 1
            fi
            record_transfer verify confirmed
            if [ "$NO_TAKEOVER_HANDOFF_QUALIFICATION" = expired-own-handoff ]; then
              [ "$SHARED_MONGO_LOCK_LEASE_SECONDS" = 14400 ]
              kubectl get configmap gaming-mongo-migration-lock -n "$OCI_K8S_NAMESPACE" -o json |
                jq -e --arg uid "$expected_uid" --arg holder "$SHARED_MONGO_LOCK_TOKEN" \
                  --arg namespace "$OCI_K8S_NAMESPACE" --arg source "$SOURCE_SHA" \
                  --arg generation "$((released_generation + 1))" '
                  .kind == "ConfigMap" and .apiVersion == "v1" and
                  .metadata.name == "gaming-mongo-migration-lock" and .metadata.namespace == $namespace and
                  .metadata.uid == $uid and (.metadata.resourceVersion | test("^[1-9][0-9]*$")) and
                  .data.state == "active" and .data.holder == $holder and
                  .data["operation-id"] == "live-data-apply-slip-index" and .data["source-sha"] == $source and
                  .data["fencing-generation"] == $generation and .data["lease-duration-seconds"] == "14400" and
                  .data["released-at-epoch"] == "0" and
                  (.data["lease-until-epoch"] | tonumber) > now and
                  (.data["acquired-at-epoch"] | tonumber) <= now and
                  ((.data["lease-until-epoch"] | tonumber) - (.data["acquired-at-epoch"] | tonumber)) == 14400
                ' >/dev/null || { echo "expired handoff did not confirm the new operation lease" >&2; exit 1; }
            fi
            [ "$retained_transfer" != true ] ||
              echo "retained_lock_transfer=verify status=CONFIRMED"
            exit 0
          fi
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
          OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
          LOCK_LEASE_SECONDS="$SHARED_MONGO_LOCK_LEASE_SECONDS" \
          SOURCE_SHA="$SOURCE_SHA" \
            ./infra/azure/agents/shared-mongo-operation-lock-stan.sh acquire

      - name: Enter or re-establish live data maintenance
        id: maintenance_enter
        if: inputs.phase != 'dry-run'
        env:
          RESUME_MAINTENANCE_MODE: ${{ steps.provenance_request.outputs.resume_maintenance_mode || 'none' }}
          STATE_FILE: ${{ runner.temp }}/live-data-maintenance.tsv
        run: |
          set -euo pipefail
          if [ "$FAILED_ACTIVATION_RUN_ID" != "0" ] ||
             [ "$FAILED_DEPLOY_RUN_ID" = "0" ] ||
             [ "$RESUME_MAINTENANCE_MODE" = "released-runtime" ]; then
            ./infra/oci/scripts/live-data-maintenance-stan.sh enter
          else
            { [ "$RESUME_MAINTENANCE_MODE" = "retained-hold" ] ||
              [ "$RESUME_MAINTENANCE_MODE" = "pre-runtime-hold" ]; } || {
              echo "Unsupported resume maintenance mode: $RESUME_MAINTENANCE_MODE" >&2
              exit 1
            }
            ./infra/oci/scripts/live-data-maintenance-stan.sh hold
          fi

      - name: Demote and verify exact retained live-acceptance account
        if: >-
          inputs.failed_activation_run_id != '0' &&
          steps.provenance_request.outputs.released_activation_qualification != 'pre-arm-no-account'
        run: |
          set -euo pipefail
          [[ "$FAILED_ACTIVATION_USER_ID" =~ ^[0-9a-f]{24}$ ]]
          kubectl exec -n "$OCI_K8S_NAMESPACE" \
            deployment/gaming-auth-depl \
            -c gaming-auth -- \
            env \
              "USER_ID=$FAILED_ACTIVATION_USER_ID" \
              USER_ROLE=USER \
              "USER_ROLE_CHANGE_CONFIRMATION=SET_ROLE:$FAILED_ACTIVATION_USER_ID:USER" \
              node dist/scripts/SetUserRole.js

          pods_json="$(
            kubectl get pods -n "$OCI_K8S_NAMESPACE" \
              -l app=gaming-auth-mongo -o json
          )"
          mongo_pod="$(
            jq -er '
              [
                .items[] |
                select(
                  .metadata.deletionTimestamp == null and
                  .status.phase == "Running"
                ) |
                .metadata.name
              ] |
              if length == 1 then .[0]
              else error("expected one running Mongo pod")
              end
            ' <<<"$pods_json"
          )"
          mongo_script="$(
            cat <<EOF
          const userId = "$FAILED_ACTIVATION_USER_ID";
          const users = db.getSiblingDB("gaming_auth").users;
          const matches = users.find(
            {_id: ObjectId(userId)},
            {_id: 1, role: 1}
          ).toArray();
          if (matches.length !== 1 || matches[0].role !== "USER") {
            throw new Error("retained live-acceptance account role differs");
          }
          print(JSON.stringify({
            verified: true,
            userCount: matches.length,
            role: matches[0].role
          }));
          EOF
          )"
          raw_result="$(
            kubectl exec -n "$OCI_K8S_NAMESPACE" "$mongo_pod" -- \
              mongosh --quiet --norc --eval "$mongo_script"
          )"
          result="$(tail -n 1 <<<"$raw_result")"
          jq -e '
            type == "object" and
            .verified == true and
            .userCount == 1 and
            .role == "USER" and
            (keys | sort) == ["role", "userCount", "verified"]
          ' <<<"$result" >/dev/null

          output=artifacts/oci-live-data-rollout/evidence/failed-live-acceptance-role.json
          temporary="${output}.tmp"
          trap 'rm -f "$temporary"' EXIT
          jq -cS \
            --arg run_id "$FAILED_ACTIVATION_RUN_ID" '
              {
                schemaVersion: "failed-live-acceptance-role.v1",
                failedActivationRunId: $run_id,
                verified: .verified,
                userCount: .userCount,
                role: .role
              }
            ' <<<"$result" >"$temporary"
          chmod 600 "$temporary"
          mv "$temporary" "$output"
          trap - EXIT

      - name: Delete exact orphaned live-acceptance slips
        if: >-
          inputs.failed_activation_run_id != '0' &&
          steps.provenance_request.outputs.released_activation_qualification != 'pre-arm-no-account'
        env:
          OUTPUT_FILE: artifacts/oci-live-data-rollout/evidence/failed-live-acceptance-cleanup.json
        run: |
          [[ "$FAILED_ACTIVATION_USER_ID" =~ ^[0-9a-f]{24}$ ]] || exit 1
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          CONFIRMATION="DELETE_FAILED_LIVE_DRAFT:$FAILED_ACTIVATION_RUN_ID:$FAILED_ACTIVATION_USER_ID" \
          EXPECTED_AUTH_USER_COUNT=1 \
          ALLOWED_BET_KINDS=LIVE,PRE_MATCH \
          MAX_ACTIVE_SLIPS=2 \
            ./infra/oci/scripts/cleanup-live-acceptance-slips-stan.sh

      - name: Execute exact-digest live data phase
        id: data
        env:
          IMAGE_PROVENANCE_FILE: artifacts/oci-live-data-rollout/images.tsv
          OUTPUT_DIR: artifacts/oci-live-data-rollout/evidence
          JOB_TIMEOUT_SECONDS: "1800"
          BATCH_SIZE: "100"
          MAINTENANCE_FENCE_ENFORCED: ${{ inputs.phase != 'dry-run' }}
          WRITERS_QUIESCED: ${{ inputs.phase != 'dry-run' }}
          RUNTIME_HELD_FOR_DEPLOY: ${{ inputs.phase == 'apply-slip-index' }}
          OPERATION_LOCK_ENFORCED: "true"
          OPERATION_LOCK_HANDOFF: ${{ inputs.phase == 'apply-slip-index' }}
          BASELINE_RECOVERY_RUN_ID: ${{ inputs.baseline_recovery_run_id }}
          BASELINE_RECOVERY_SOURCE_SHA: ${{ inputs.baseline_recovery_source_sha }}
          DISK_CHECKPOINT_SHA256: ${{ steps.provenance.outputs.disk_checkpoint_sha256 }}
          DISK_CHECKPOINT_DISPOSITION: ${{ steps.provenance.outputs.disk_checkpoint_disposition }}
        run: ./infra/oci/scripts/live-betting-data-rollout-stan.sh

      - name: Restore runtime or verify final deploy handoff
        id: maintenance
        if: always() && steps.maintenance_enter.outcome == 'success'
        env:
          DATA_OUTCOME: ${{ steps.data.outcome }}
          RESUME_MAINTENANCE_MODE: ${{ steps.provenance_request.outputs.resume_maintenance_mode || 'none' }}
          STATE_FILE: ${{ runner.temp }}/live-data-maintenance.tsv
        run: |
          set -euo pipefail
          restore_or_verify_retained_hold() {
            if [ "$PHASE" = "apply-slip-index" ]; then
              ./infra/oci/scripts/live-data-maintenance-stan.sh hold
              ./infra/oci/scripts/live-data-maintenance-stan.sh verify-held
              NAMESPACE="$OCI_K8S_NAMESPACE" \
              LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
              OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
              LOCK_LEASE_SECONDS="$SHARED_MONGO_LOCK_LEASE_SECONDS" \
              SOURCE_SHA="$SOURCE_SHA" \
                ./infra/azure/agents/shared-mongo-operation-lock-stan.sh renew
              NAMESPACE="$OCI_K8S_NAMESPACE" \
              LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
              OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
              SOURCE_SHA="$SOURCE_SHA" \
                ./infra/azure/agents/shared-mongo-operation-lock-stan.sh verify
              return
            fi
            if [ "$FAILED_DEPLOY_RUN_ID" = "0" ] ||
               [ "$RESUME_MAINTENANCE_MODE" = "released-runtime" ]; then
              ./infra/oci/scripts/live-data-maintenance-stan.sh restore
            else
              [ "$RESUME_MAINTENANCE_MODE" = "retained-hold" ] || {
                echo "Unsupported resume maintenance mode: $RESUME_MAINTENANCE_MODE" >&2
                exit 1
              }
              ./infra/oci/scripts/live-data-maintenance-stan.sh verify-held
            fi
          }
          if [[ "$PHASE" == "apply-slip-index" && "$DATA_OUTCOME" == "success" ]]; then
            if ! ./infra/oci/scripts/live-data-maintenance-stan.sh verify-held; then
              restore_or_verify_retained_hold
              exit 1
            fi
            if ! NAMESPACE="$OCI_K8S_NAMESPACE" \
              LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
              OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
              SOURCE_SHA="$SOURCE_SHA" \
                ./infra/azure/agents/shared-mongo-operation-lock-stan.sh verify; then
              restore_or_verify_retained_hold
              exit 1
            fi
            if ! NAMESPACE="$OCI_K8S_NAMESPACE" \
              LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
              OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
              LOCK_LEASE_SECONDS="$SHARED_MONGO_HANDOFF_LOCK_LEASE_SECONDS" \
              SOURCE_SHA="$SOURCE_SHA" \
                ./infra/azure/agents/shared-mongo-operation-lock-stan.sh renew; then
              restore_or_verify_retained_hold
              exit 1
            fi
          else
            restore_or_verify_retained_hold
          fi

      - name: Capture post-phase runtime baseline
        if: >-
          steps.data.outcome == 'success' &&
          inputs.phase != 'apply-slip-index' &&
          (inputs.phase == 'dry-run' || steps.maintenance.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUTPUT_DIR: artifacts/oci-data-baseline-after
          OCI_PUBLIC_URL: ${{ steps.provenance.outputs.public_url }}
          OCI_REDIRECT_URL: ${{ steps.provenance.outputs.redirect_url }}
          OCI_DIAGNOSTIC_URL: ${{ steps.provenance.outputs.diagnostic_url }}
          SSE_REQUIREMENT: deployed-source
        run: |
          if [ "$BASELINE_RECOVERY_RUN_ID" = "0" ]; then
            ./infra/oci/scripts/baseline-capture-stan.sh
          else
            BASELINE_RECOVERY_DIR=artifacts/recovery \
              ./infra/oci/scripts/baseline-capture-stan.sh
          fi

      - name: Require executed data-step evidence
        if: always() && steps.data.outcome != 'skipped'
        run: |
          test -f artifacts/oci-live-data-rollout/evidence/SHA256SUMS || {
            echo "Executed live-data step did not produce checksummed evidence" >&2
            exit 1
          }

      - name: Upload exact sanitized data evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: oci-live-data-rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oci-live-data-rollout/evidence
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload protected rollout baselines
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: oci-live-data-baselines-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/oci-data-baseline-before
            artifacts/oci-data-baseline-after
            ${{ inputs.held_handoff_run_id != '0' && format('{0}/pre-runtime-lock.json', runner.temp) || '' }}
            ${{ steps.provenance_request.outputs.resume_maintenance_mode == 'retained-hold' && format('{0}/retained-lock.json', runner.temp) || '' }}
          if-no-files-found: ignore
          retention-days: 30

      - name: Restore runtime or retain hold if final handoff packaging failed
        id: abort_handoff
        if: >-
          always() &&
          (failure() || cancelled()) &&
          inputs.phase == 'apply-slip-index' &&
          steps.maintenance_enter.outcome == 'success'
        env:
          STATE_FILE: ${{ runner.temp }}/live-data-maintenance.tsv
        run: |
          set -euo pipefail
          ./infra/oci/scripts/live-data-maintenance-stan.sh hold
          ./infra/oci/scripts/live-data-maintenance-stan.sh verify-held
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
          OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
          LOCK_LEASE_SECONDS="$SHARED_MONGO_LOCK_LEASE_SECONDS" \
          SOURCE_SHA="$SOURCE_SHA" \
            ./infra/azure/agents/shared-mongo-operation-lock-stan.sh renew
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
          OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
          SOURCE_SHA="$SOURCE_SHA" \
            ./infra/azure/agents/shared-mongo-operation-lock-stan.sh verify

      - name: Release database operation lock unless handed to deploy
        if: >-
          always() &&
          steps.operation_lock.outcome == 'success' &&
          (inputs.phase != 'apply-slip-index' ||
           steps.maintenance_enter.outcome != 'success')
        run: |
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
          OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
          SOURCE_SHA="$SOURCE_SHA" \
            ./infra/azure/agents/shared-mongo-operation-lock-stan.sh release
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
          OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
          SOURCE_SHA="$SOURCE_SHA" \
            ./infra/azure/agents/shared-mongo-operation-lock-stan.sh verify-released

      - name: Revoke exact runner rule
        if: always() && env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          RULE_STATE_FILE: artifacts/oci-live-data-rollout/runner-rule.env
        run: |
          if [ -f "$RULE_STATE_FILE" ]; then
            ./infra/oci/scripts/revoke-github-runner.sh "$RULE_STATE_FILE"
          fi

      - name: Close ephemeral OCI Bastion access
        if: >-
          always() &&
          env.OCI_RUNTIME_MODE == 'k3s' &&
          steps.oci_cli.outcome == 'success'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          SESSION_STATE_FILE: artifacts/oci-live-data-rollout/k3s-access.env
          WORK_DIR: ${{ runner.temp }}/betstan-k3s-access
        run: ./infra/oci/scripts/configure-k3s-access.sh cleanup

      - name: Remove isolated OCI client state
        if: always()
        run: rm -rf "$RUNNER_TEMP/oci-home"
