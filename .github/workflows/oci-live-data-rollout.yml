name: oci-live-data-rollout
run-name: oci-live-data ${{ inputs.phase }} ${{ inputs.approved_sha }}

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current master SHA approved for the live-betting data phase
        required: true
        type: string
      resume_source_sha:
        description: Exact source SHA of the predecessor and failed runs; current SHA for fresh phases
        required: true
        type: string
      build_run_id:
        description: Successful first-attempt oci-production-build run ID
        required: true
        type: string
      infrastructure_run_id:
        description: Successful first-attempt finalized oci-infrastructure run ID
        required: true
        type: string
      checkpoint_source_sha:
        description: Exact source SHA of the release disk checkpoint
        required: true
        type: string
      disk_checkpoint_run_id:
        description: Successful first-attempt release disk checkpoint producer run ID
        required: true
        type: string
      phase:
        description: Read, backfill, or create and verify the Slip index
        required: true
        type: choice
        options:
          - dry-run
          - apply-backfills
          - apply-slip-index
      prerequisite_run_id:
        description: Prior successful phase run ID, or 0 for dry-run
        required: true
        default: "0"
        type: string
      baseline_recovery_run_id:
        description: Exact first-attempt cache or partial-rollback recovery authorizing the live GHCR baseline, or 0
        required: true
        default: "0"
        type: string
      baseline_recovery_source_sha:
        description: Exact historical source restored by the selected recovery, or none
        required: true
        default: none
        type: string
      failed_deploy_run_id:
        description: Failed dark deploy to resume after data was already applied, or 0
        required: true
        default: "0"
        type: string
      failed_activation_run_id:
        description: Failed live activation that left exact synthetic Slip data, or 0
        required: true
        default: "0"
        type: string
      failed_activation_user_id:
        description: Exact synthetic user ID from that failed activation, or 0
        required: true
        default: "0"
        type: string
      confirmation:
        description: Type the exact confirmation phrase for the selected phase
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: oci-control-plane
  cancel-in-progress: false

jobs:
  rollout:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: oci-migration
    env:
      SOURCE_SHA: ${{ inputs.approved_sha }}
      RESUME_SOURCE_SHA: ${{ inputs.resume_source_sha }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      INFRASTRUCTURE_RUN_ID: ${{ inputs.infrastructure_run_id }}
      CHECKPOINT_SOURCE_SHA: ${{ inputs.checkpoint_source_sha }}
      DISK_CHECKPOINT_RUN_ID: ${{ inputs.disk_checkpoint_run_id }}
      PHASE: ${{ inputs.phase }}
      PREREQUISITE_RUN_ID: ${{ inputs.prerequisite_run_id }}
      BASELINE_RECOVERY_RUN_ID: ${{ inputs.baseline_recovery_run_id }}
      BASELINE_RECOVERY_SOURCE_SHA: ${{ inputs.baseline_recovery_source_sha }}
      FAILED_DEPLOY_RUN_ID: ${{ inputs.failed_deploy_run_id }}
      FAILED_ACTIVATION_RUN_ID: ${{ inputs.failed_activation_run_id }}
      FAILED_ACTIVATION_USER_ID: ${{ inputs.failed_activation_user_id }}
      CONFIRMATION: ${{ inputs.confirmation }}
      DISPATCH_INPUTS: ${{ toJSON(inputs) }}
      OCI_RUNTIME_MODE: ${{ vars.OCI_RUNTIME_MODE }}
      OCI_CLI_VERSION: "3.90.0"
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_CI_USER_OCID: ${{ vars.OCI_CI_USER_OCID }}
      OCI_CI_KEY_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_AVAILABILITY_DOMAIN: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
      OCI_K8S_NAMESPACE: ${{ vars.OCI_K8S_NAMESPACE }}
      OCI_K3S_NODE_NAME: ${{ vars.OCI_K3S_NODE_NAME || 'betstan-k3s' }}
      OCI_BASTION_DEFAULT_CLIENT_CIDR: 192.0.2.1/32
      APPLICATION_REGISTRY_PROVIDER: ghcr
      APPLICATION_REGISTRY_HOST: ghcr.io
      APPLICATION_REGISTRY_REPOSITORY: vasilyevstan/betstan-images
      APPLICATION_REGISTRY_TAG_PREFIX: arm64
      APPLICATION_REGISTRY_TAG_SCHEMA: v1
      OCI_MEMORY_MAX_PERCENT: ${{ vars.OCI_MEMORY_MAX_PERCENT }}
      OCI_DISK_MAX_PERCENT: ${{ vars.OCI_DISK_MAX_PERCENT }}
      OCI_CPU_MAX_PERCENT: "90"
      SHARED_MONGO_LOCK_TOKEN: live-data-${{ github.run_id }}-${{ github.run_attempt }}
      SHARED_MONGO_LOCK_OPERATION: live-data-${{ inputs.phase }}
      SHARED_MONGO_LOCK_LEASE_SECONDS: "14400"
      SHARED_MONGO_HANDOFF_LOCK_LEASE_SECONDS: "1800"

    steps:
      - name: Initialize isolated OCI data paths
        run: |
          {
            echo "HOME=$RUNNER_TEMP/oci-home"
            echo "KUBECONFIG=$RUNNER_TEMP/oci-home/.kube/config"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/oci-home/.local/bin" >> "$GITHUB_PATH"
          mkdir -p \
            "$RUNNER_TEMP/oci-home/.kube" \
            artifacts/build \
            artifacts/infrastructure \
            artifacts/disk-checkpoint \
            artifacts/prerequisite \
            artifacts/recovery \
            artifacts/resume-build \
            artifacts/oci-live-data-rollout \
            artifacts/oci-data-baseline-before \
            artifacts/oci-data-baseline-after
          chmod 700 "$RUNNER_TEMP/oci-home" "$RUNNER_TEMP/oci-home/.kube"

      - name: Checkout approved current master commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0

      - name: Validate exact SHA phase and trusted upstream runs
        id: provenance_request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "master" ]
          [ "$GITHUB_RUN_ATTEMPT" = "1" ]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RESUME_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$INFRASTRUCTURE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CHECKPOINT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DISK_CHECKPOINT_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BASELINE_RECOVERY_RUN_ID" == "0" ||
             "$BASELINE_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [ "$BASELINE_RECOVERY_RUN_ID" = "0" ]; then
            [ "$BASELINE_RECOVERY_SOURCE_SHA" = "none" ]
          else
            [[ "$BASELINE_RECOVERY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
          [[ "$FAILED_DEPLOY_RUN_ID" == "0" ||
             "$FAILED_DEPLOY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_ACTIVATION_RUN_ID" == "0" ||
             "$FAILED_ACTIVATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [ "$FAILED_ACTIVATION_RUN_ID" = "0" ]; then
            [ "$FAILED_ACTIVATION_USER_ID" = "0" ]
          else
            [[ "$FAILED_ACTIVATION_USER_ID" =~ ^[0-9a-f]{24}$ ]]
          fi
          case "$PHASE" in
            dry-run)
              [ "$CONFIRMATION" = "DRY RUN LIVE DATA EXACT SHA" ]
              [ "$PREREQUISITE_RUN_ID" = "0" ]
              [ "$FAILED_DEPLOY_RUN_ID" = "0" ]
              [ "$FAILED_ACTIVATION_RUN_ID" = "0" ]
              [ "$RESUME_SOURCE_SHA" = "$SOURCE_SHA" ]
              [ "$CHECKPOINT_SOURCE_SHA" = "$SOURCE_SHA" ]
              protected_operation=oci-live-data-dry-run
              ;;
            apply-backfills)
              [ "$CONFIRMATION" = "APPLY LIVE BACKFILLS EXACT SHA" ]
              [[ "$PREREQUISITE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [ "$FAILED_DEPLOY_RUN_ID" = "0" ]
              [ "$FAILED_ACTIVATION_RUN_ID" = "0" ]
              [ "$RESUME_SOURCE_SHA" = "$SOURCE_SHA" ]
              [ "$CHECKPOINT_SOURCE_SHA" = "$SOURCE_SHA" ]
              protected_operation=oci-live-data-apply-backfills
              ;;
            apply-slip-index)
              [[ "$PREREQUISITE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              if [ "$FAILED_ACTIVATION_RUN_ID" != "0" ]; then
                case "$CONFIRMATION" in
                  "RESUME APPLIED LIVE DATA AND CLEAN FAILED ACTIVATION EXACT SHA")
                    protected_operation=oci-live-data-resume-activation ;;
                  "RESUME APPLIED LIVE DATA FROM RELEASED RUNTIME AND CLEAN FAILED ACTIVATION EXACT SHA")
                    protected_operation=oci-live-data-resume-activation-released ;;
                  *)
                    exit 1
                    ;;
                esac
              elif [ "$FAILED_DEPLOY_RUN_ID" = "0" ]; then
                [ "$CONFIRMATION" = "APPLY LIVE SLIP INDEX EXACT SHA" ]
                [ "$RESUME_SOURCE_SHA" = "$SOURCE_SHA" ]
                [ "$CHECKPOINT_SOURCE_SHA" = "$SOURCE_SHA" ]
                protected_operation=oci-live-data-apply-slip-index
              else
                case "$CONFIRMATION" in
                  "RESUME APPLIED LIVE DATA EXACT SHA")
                    protected_operation=oci-live-data-resume-deploy ;;
                  "RESUME APPLIED LIVE DATA FROM RELEASED RUNTIME EXACT SHA")
                    protected_operation=oci-live-data-resume-deploy-released ;;
                  *)
                    exit 1
                    ;;
                esac
              fi
              ;;
            *)
              exit 1
              ;;
          esac
          git fetch --quiet origin master:refs/remotes/origin/master
          [ "$SOURCE_SHA" = "$GITHUB_SHA" ]
          [ "$SOURCE_SHA" = "$(git rev-parse origin/master)" ]
          git cat-file -e "${RESUME_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$RESUME_SOURCE_SHA" "$SOURCE_SHA"
          if [ "$BASELINE_RECOVERY_RUN_ID" != "0" ]; then
            git cat-file -e "${BASELINE_RECOVERY_SOURCE_SHA}^{commit}"
            git merge-base --is-ancestor \
              "$BASELINE_RECOVERY_SOURCE_SHA" "$SOURCE_SHA"
          fi
          policy_json="$(
            ./infra/azure/agents/copilot-cli-protected-operation-policy-stan.sh \
              get "$protected_operation"
          )"
          ./infra/oci/scripts/upstream_run_binding_stan.py validate-all \
            --repository "$REPOSITORY" \
            --policy-json "$policy_json" \
            --subject-sha "$SOURCE_SHA" \
            --dispatch-inputs "$DISPATCH_INPUTS" \
            --runtime-mode "$OCI_RUNTIME_MODE"

          validate_run() {
            local workflow_file="$1"
            local run_id="$2"
            local expected_event="$3"
            local expected_sha="$4"
            local expected_conclusion="$5"
            local workflow_id
            workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/$workflow_file" --jq '.id'
            )"
            read -r observed_workflow path event head_sha head_branch repository status conclusion attempt <<<"$(
              gh api "repos/$REPOSITORY/actions/runs/$run_id/attempts/1" \
                --jq '[.workflow_id,.path,.event,.head_sha,.head_branch,.head_repository.full_name,.status,.conclusion,.run_attempt] | @tsv'
            )"
            [ "$observed_workflow" = "$workflow_id" ]
            [ "$path" = ".github/workflows/$workflow_file" ]
            [ "$event" = "$expected_event" ]
            [ "$head_sha" = "$expected_sha" ]
            [ "$head_branch" = "master" ]
            [ "$repository" = "$REPOSITORY" ]
            [ "$status" = "completed" ]
            [ "$conclusion" = "$expected_conclusion" ]
            [ "$attempt" = "1" ]
          }

          validate_run \
            oci-production-build.yml "$BUILD_RUN_ID" workflow_run \
            "$CHECKPOINT_SOURCE_SHA" success
          validate_run \
            oci-infrastructure.yml "$INFRASTRUCTURE_RUN_ID" workflow_dispatch \
            "$CHECKPOINT_SOURCE_SHA" success
          if [ "$BASELINE_RECOVERY_RUN_ID" != "0" ]; then
            cache_recovery_workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/oci-ghcr-cache-recovery.yml" --jq '.id'
            )"
            rollback_recovery_workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/oci-production-rollback.yml" --jq '.id'
            )"
            read -r workflow_id path event recovery_head_sha head_branch \
              repository status conclusion attempt display_title <<<"$(
              gh api "repos/$REPOSITORY/actions/runs/$BASELINE_RECOVERY_RUN_ID/attempts/1" \
                --jq '[.workflow_id,.path,.event,.head_sha,.head_branch,.head_repository.full_name,.status,.conclusion,.run_attempt,.display_title] | @tsv'
            )"
            [ "$event" = "workflow_dispatch" ]
            [[ "$recovery_head_sha" =~ ^[0-9a-f]{40}$ ]]
            [ "$head_branch" = "master" ]
            [ "$repository" = "$REPOSITORY" ]
            [ "$status" = "completed" ] && [ "$conclusion" = "success" ] && [ "$attempt" = "1" ]
            git cat-file -e "${recovery_head_sha}^{commit}"
            git merge-base --is-ancestor "$recovery_head_sha" "$SOURCE_SHA"
            if [ "$workflow_id" = "$cache_recovery_workflow_id" ] &&
               [ "$path" = ".github/workflows/oci-ghcr-cache-recovery.yml" ]; then
              recovery_kind=ghcr-cache
              recovery_artifact_name="$(
                gh api "repos/$REPOSITORY/actions/runs/$BASELINE_RECOVERY_RUN_ID/artifacts?per_page=100" \
                  --jq '.artifacts[] | select(.expired == false) | .name' |
                  awk -v run_id="$BASELINE_RECOVERY_RUN_ID" \
                    '$0 ~ ("^ghcr-cache-recovery-[0-9a-f]{40}-" run_id "-1$") { count++; name=$0 } END { if (count != 1) exit 1; print name }'
              )"
            elif [ "$workflow_id" = "$rollback_recovery_workflow_id" ] &&
                 [ "$path" = ".github/workflows/oci-production-rollback.yml" ]; then
              recovery_kind=partial-rollback
              [[ "$display_title" =~ ^oci-rollback\ [0-9a-f]{40}$ ]]
              recovery_artifact_name="oci-production-rollback-${BASELINE_RECOVERY_RUN_ID}-1"
              artifact_count="$(
                gh api "repos/$REPOSITORY/actions/runs/$BASELINE_RECOVERY_RUN_ID/artifacts?per_page=100" \
                  --jq "[.artifacts[] | select(.name == \"$recovery_artifact_name\" and .expired == false)] | length"
              )"
              [ "$artifact_count" = "1" ]
            else
              echo "selected baseline recovery workflow is not trusted" >&2
              exit 1
            fi
            printf 'recovery_artifact_name=%s\n' "$recovery_artifact_name" >> "$GITHUB_OUTPUT"
            printf 'recovery_kind=%s\n' "$recovery_kind" >> "$GITHUB_OUTPUT"
          fi
          if [ "$PHASE" != "dry-run" ]; then
            prerequisite_source_sha="$RESUME_SOURCE_SHA"
            validate_run \
              oci-live-data-rollout.yml "$PREREQUISITE_RUN_ID" \
              workflow_dispatch "$prerequisite_source_sha" success
            artifact_name="oci-live-data-rollout-${PREREQUISITE_RUN_ID}-1"
            artifact_count="$(
              gh api "repos/$REPOSITORY/actions/runs/$PREREQUISITE_RUN_ID/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(.name == \"$artifact_name\" and .expired == false)] | length"
            )"
            [ "$artifact_count" = "1" ]
            printf 'resume_source_sha=%s\n' \
              "$prerequisite_source_sha" >> "$GITHUB_OUTPUT"
            if [ "$FAILED_DEPLOY_RUN_ID" != "0" ] &&
               [ "$FAILED_ACTIVATION_RUN_ID" = "0" ]; then
              validate_run \
                oci-production-deploy.yml "$FAILED_DEPLOY_RUN_ID" \
                workflow_dispatch "$prerequisite_source_sha" failure
              failed_deploy_jobs="$(
                gh api \
                  "repos/$REPOSITORY/actions/runs/$FAILED_DEPLOY_RUN_ID/attempts/1/jobs?per_page=100"
              )"
              deploy_job_count="$(
                jq '[.jobs[] | select(.name == "deploy")] | length' \
                  <<<"$failed_deploy_jobs"
              )"
              public_validate_job_count="$(
                jq '[.jobs[] | select(.name == "public-validate")] | length' \
                  <<<"$failed_deploy_jobs"
              )"
              [ "$deploy_job_count" = "1" ]
              [ "$public_validate_job_count" = "1" ]
              deploy_job_conclusion="$(
                jq -r '.jobs[] | select(.name == "deploy") | .conclusion' \
                  <<<"$failed_deploy_jobs"
              )"
              public_validate_job_conclusion="$(
                jq -r \
                  '.jobs[] | select(.name == "public-validate") | .conclusion' \
                  <<<"$failed_deploy_jobs"
              )"
              lock_release_step_count="$(
                jq '[
                  .jobs[] |
                  select(.name == "deploy") |
                  .steps[] |
                  select(.name == "Release transferred lock after protected validation")
                ] | length' <<<"$failed_deploy_jobs"
              )"
              fence_release_step_count="$(
                jq '[
                  .jobs[] |
                  select(.name == "deploy") |
                  .steps[] |
                  select(.name == "Release live data maintenance fence")
                ] | length' <<<"$failed_deploy_jobs"
              )"
              rehold_step_count="$(
                jq '[
                  .jobs[] |
                  select(.name == "deploy") |
                  .steps[] |
                  select(.name == "Re-enter maintenance after an incomplete deployment")
                ] | length' <<<"$failed_deploy_jobs"
              )"
              [ "$lock_release_step_count" = "1" ]
              [ "$fence_release_step_count" = "1" ]
              [ "$rehold_step_count" = "1" ]
              lock_release_step_conclusion="$(
                jq -r '
                  .jobs[] |
                  select(.name == "deploy") |
                  .steps[] |
                  select(.name == "Release transferred lock after protected validation") |
                  .conclusion
                ' <<<"$failed_deploy_jobs"
              )"
              fence_release_step_conclusion="$(
                jq -r '
                  .jobs[] |
                  select(.name == "deploy") |
                  .steps[] |
                  select(.name == "Release live data maintenance fence") |
                  .conclusion
                ' <<<"$failed_deploy_jobs"
              )"
              rehold_step_conclusion="$(
                jq -r '
                  .jobs[] |
                  select(.name == "deploy") |
                  .steps[] |
                  select(.name == "Re-enter maintenance after an incomplete deployment") |
                  .conclusion
                ' <<<"$failed_deploy_jobs"
              )"
              case "$deploy_job_conclusion:$public_validate_job_conclusion:$lock_release_step_conclusion:$fence_release_step_conclusion:$rehold_step_conclusion" in
                success:failure:success:success:skipped)
                  resume_maintenance_mode=released-runtime
                  ;;
                failure:skipped:skipped:skipped:success | \
                  failure:skipped:failure:skipped:success | \
                  failure:skipped:success:failure:success)
                  resume_maintenance_mode=retained-hold
                  ;;
                *)
                  echo "Unsupported failed deployment outcomes: deploy=$deploy_job_conclusion public-validate=$public_validate_job_conclusion lock-release=$lock_release_step_conclusion fence-release=$fence_release_step_conclusion rehold=$rehold_step_conclusion" >&2
                  exit 1
                  ;;
              esac
              if [ "$resume_maintenance_mode" = "released-runtime" ]; then
                [ "$CONFIRMATION" = \
                  "RESUME APPLIED LIVE DATA FROM RELEASED RUNTIME EXACT SHA" ]
              else
                [ "$CONFIRMATION" = "RESUME APPLIED LIVE DATA EXACT SHA" ]
              fi
              printf 'resume_maintenance_mode=%s\n' \
                "$resume_maintenance_mode" >> "$GITHUB_OUTPUT"
              {
                printf 'failed_deploy_job_conclusion=%s\n' "$deploy_job_conclusion"
                printf 'public_validate_job_conclusion=%s\n' \
                  "$public_validate_job_conclusion"
                printf 'lock_release_step_conclusion=%s\n' \
                  "$lock_release_step_conclusion"
                printf 'fence_release_step_conclusion=%s\n' \
                  "$fence_release_step_conclusion"
                printf 'rehold_step_conclusion=%s\n' "$rehold_step_conclusion"
              } >> "$GITHUB_OUTPUT"
              baseline_artifact_name="oci-production-baseline-${FAILED_DEPLOY_RUN_ID}-1"
              baseline_artifact_count="$(
                gh api "repos/$REPOSITORY/actions/runs/$FAILED_DEPLOY_RUN_ID/artifacts?per_page=100" \
                  --jq "[.artifacts[] | select(.name == \"$baseline_artifact_name\" and .expired == false)] | length"
              )"
              [ "$baseline_artifact_count" = "1" ]
            fi
            if [ "$FAILED_ACTIVATION_RUN_ID" != "0" ]; then
              printf 'resume_maintenance_mode=released-runtime\n' \
                >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Reject competing production activity
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXCLUDE_RUN_ID: ${{ github.run_id }}
        run: ./infra/azure/agents/production-run-exclusivity-stan.sh

      - name: Download exact OCI image provenance
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oci-image-provenance-${{ inputs.checkpoint_source_sha }}-${{ inputs.build_run_id }}-1
          path: artifacts/build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Download exact OCI infrastructure provenance
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oci-infrastructure-provenance-${{ inputs.infrastructure_run_id }}-1
          path: artifacts/infrastructure
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.infrastructure_run_id }}

      - name: Download exact release disk checkpoint
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oci-release-disk-checkpoint-${{ inputs.checkpoint_source_sha }}-${{ inputs.disk_checkpoint_run_id }}-1
          path: artifacts/disk-checkpoint
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.disk_checkpoint_run_id }}

      - name: Download prerequisite data evidence
        if: inputs.phase != 'dry-run'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oci-live-data-rollout-${{ inputs.prerequisite_run_id }}-1
          path: artifacts/prerequisite
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.prerequisite_run_id }}

      - name: Download failed deploy protected baseline
        if: >-
          inputs.failed_deploy_run_id != '0' &&
          inputs.failed_activation_run_id == '0'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: oci-production-baseline-${{ inputs.failed_deploy_run_id }}-1
          path: artifacts/oci-data-baseline-before
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.failed_deploy_run_id }}

      - name: Download explicitly selected recovery baseline authority
        if: inputs.baseline_recovery_run_id != '0'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ steps.provenance_request.outputs.recovery_artifact_name }}
          path: artifacts/recovery
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.baseline_recovery_run_id }}

      - name: Bind historical recovery source through its exact artifact
        id: recovery_authority
        if: inputs.baseline_recovery_run_id != '0'
        env:
          BASELINE_RECOVERY_KIND: ${{ steps.provenance_request.outputs.recovery_kind }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          recovery=artifacts/recovery
          if [ "$BASELINE_RECOVERY_KIND" = "partial-rollback" ]; then
            authority="$recovery/partial-recovery-authority.env"
            PARTIAL_RECOVERY_DIR="$recovery" \
            EXPECTED_RECOVERY_RUN_ID="$BASELINE_RECOVERY_RUN_ID" \
              ./infra/oci/scripts/validate-partial-recovery-authority-stan.sh
            source_sha="$(awk -F= '$1 == "restored_source_sha" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$authority")"
            build_run_id="$(awk -F= '$1 == "restored_build_run_id" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$authority")"
            recovery_head_sha="$(awk -F= '$1 == "recovery_head_sha" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$authority")"
            source_rollback_run_id="$(awk -F= '$1 == "source_rollback_run_id" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$authority")"
            target_sha="$(awk -F= '$1 == "target_sha" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$authority")"
            rollback_workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/oci-production-rollback.yml" --jq '.id'
            )"
            gh api "repos/$REPOSITORY/actions/runs/$BASELINE_RECOVERY_RUN_ID/attempts/1" |
              jq -e \
                --argjson workflow_id "$rollback_workflow_id" \
                --arg repo "$REPOSITORY" \
                --arg head_sha "$recovery_head_sha" \
                --arg title "oci-rollback $target_sha" '
                  .workflow_id == $workflow_id and
                  .path == ".github/workflows/oci-production-rollback.yml" and
                  .event == "workflow_dispatch" and
                  .head_sha == $head_sha and
                  .head_branch == "master" and
                  .head_repository.full_name == $repo and
                  .status == "completed" and
                  .conclusion == "success" and
                  .run_attempt == 1 and
                  .display_title == $title
                ' >/dev/null
            gh api "repos/$REPOSITORY/actions/runs/$source_rollback_run_id/attempts/1" |
              jq -e \
                --argjson workflow_id "$rollback_workflow_id" \
                --arg repo "$REPOSITORY" \
                --arg title "oci-rollback $target_sha" '
                  .workflow_id == $workflow_id and
                  .path == ".github/workflows/oci-production-rollback.yml" and
                  .event == "workflow_dispatch" and
                  .head_branch == "master" and
                  .head_repository.full_name == $repo and
                  .status == "completed" and
                  .conclusion == "failure" and
                  .run_attempt == 1 and
                  .display_title == $title
                ' >/dev/null
            source_artifact_name="oci-production-rollback-${source_rollback_run_id}-1"
            [ "$(
              gh api "repos/$REPOSITORY/actions/runs/$source_rollback_run_id/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(.name == \"$source_artifact_name\" and .expired == false)] | length"
            )" = "1" ]
            build_workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/oci-production-build.yml" --jq '.id'
            )"
            gh api "repos/$REPOSITORY/actions/runs/$build_run_id/attempts/1" |
              jq -e \
                --argjson workflow_id "$build_workflow_id" \
                --arg repo "$REPOSITORY" \
                --arg source_sha "$source_sha" '
                  .workflow_id == $workflow_id and
                  .path == ".github/workflows/oci-production-build.yml" and
                  .event == "workflow_run" and
                  .head_sha == $source_sha and
                  .head_branch == "master" and
                  .head_repository.full_name == $repo and
                  .status == "completed" and
                  .conclusion == "success" and
                  .run_attempt == 1
                ' >/dev/null
            build_artifact_name="oci-image-provenance-${source_sha}-${build_run_id}-1"
            [ "$(
              gh api "repos/$REPOSITORY/actions/runs/$build_run_id/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(.name == \"$build_artifact_name\" and .expired == false)] | length"
            )" = "1" ]
            git cat-file -e "${source_sha}^{commit}"
            git cat-file -e "${recovery_head_sha}^{commit}"
            git merge-base --is-ancestor "$source_sha" "$SOURCE_SHA"
            git merge-base --is-ancestor "$recovery_head_sha" "$SOURCE_SHA"
          else
            evidence="$recovery/recovery-evidence.env"
            transition="$recovery/transition-provenance.env"
            [ -f "$evidence" ] && [ -f "$transition" ] && [ -f "$recovery/images.tsv" ]
            source_sha="$(awk -F= '$1 == "source_sha" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$evidence")"
            recovery_run_id="$(awk -F= '$1 == "recovery_run_id" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$evidence")"
            recovery_attempt="$(awk -F= '$1 == "recovery_run_attempt" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$evidence")"
            transition_source="$(awk -F= '$1 == "source_sha" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$transition")"
            transition_run_id="$(awk -F= '$1 == "transition_run_id" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$transition")"
            transition_attempt="$(awk -F= '$1 == "transition_run_attempt" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$transition")"
            image_hash="$(awk -F= '$1 == "images_sha256" { count++; value=$2 } END { if (count != 1) exit 1; print value }' "$evidence")"
            [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
            [ "$recovery_run_id" = "$BASELINE_RECOVERY_RUN_ID" ]
            [ "$recovery_attempt" = "1" ]
            [ "$transition_source" = "$source_sha" ]
            [ "$transition_run_id" = "$BASELINE_RECOVERY_RUN_ID" ]
            [ "$transition_attempt" = "1" ]
            [ "$image_hash" = "$(sha256sum "$recovery/images.tsv" | awk '{print $1}')" ]
            grep -Fxq 'credential_retirement=pass' "$transition"
            grep -Fxq 'ocir_repository_retirement=pass' "$transition"
            grep -Fxq 'transition_status=PASS' "$transition"
          fi
          [ "$source_sha" = "$BASELINE_RECOVERY_SOURCE_SHA" ]
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"

      - name: Verify immutable release and phase provenance
        id: provenance
        env:
          BASELINE_RECOVERY_SOURCE_SHA: ${{ inputs.baseline_recovery_source_sha }}
          RESUME_SOURCE_SHA: ${{ inputs.resume_source_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          set_output() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }
          PROVENANCE_DIR=artifacts/build \
          SOURCE_SHA="$CHECKPOINT_SOURCE_SHA" \
          EXPECTED_BUILD_RUN_ID="$BUILD_RUN_ID" \
          EXPECTED_BUILD_RUN_ATTEMPT=1 \
          OUTPUT_FILE=artifacts/oci-live-data-rollout/images.tsv \
          VERIFY_REMOTE=0 BOOT_IMAGES=0 \
            ./infra/oci/scripts/verify-images.sh

          checkpoint_args=(
            validate-release-checkpoint
            --checkpoint artifacts/disk-checkpoint/checkpoint.json
            --source-sha "$CHECKPOINT_SOURCE_SHA"
            --producer-run-id "$DISK_CHECKPOINT_RUN_ID"
            --runtime-mode "$OCI_RUNTIME_MODE"
          )
          checkpoint_args+=(
            --infrastructure-run-id "$INFRASTRUCTURE_RUN_ID"
            --ghcr-build-run-id "$BUILD_RUN_ID"
          )
          if [ "$OCI_RUNTIME_MODE" = "k3s" ]; then
            checkpoint_args+=(
              --candidate-images artifacts/oci-live-data-rollout/images.tsv
            )
          fi
          ./infra/oci/scripts/k3s_disk_recovery_stan.py \
            "${checkpoint_args[@]}"
          disk_checkpoint_sha256="$(
            jq -er '.contentChecksumSha256' \
              artifacts/disk-checkpoint/checkpoint.json
          )"
          disk_checkpoint_disposition="$(
            jq -er '.disposition' artifacts/disk-checkpoint/checkpoint.json
          )"
          set_output disk_checkpoint_sha256 "$disk_checkpoint_sha256"
          set_output disk_checkpoint_disposition "$disk_checkpoint_disposition"

          # shellcheck disable=SC1091
          source artifacts/infrastructure/provenance.env
          [ "$source_sha" = "$CHECKPOINT_SOURCE_SHA" ]
          [ "$infrastructure_run_id" = "$INFRASTRUCTURE_RUN_ID" ]
          [ "$infrastructure_run_attempt" = "1" ]
          [ "$compartment_ocid" = "$OCI_COMPARTMENT_OCID" ]
          [ "$namespace" = "$OCI_K8S_NAMESPACE" ]
          [ "$runtime_mode" = "$OCI_RUNTIME_MODE" ]
          [ "$infrastructure_finalized" = "true" ]
          [ "$application_registry_provider" = "ghcr" ]
          [ "$application_registry_host" = "ghcr.io" ]
          [ "$application_registry_repository" = "ghcr.io/vasilyevstan/betstan-images" ]
          [ "$application_registry_public_anonymous" = "true" ]
          [ "$ocir_application_repository_absent" = "true" ]
          if [ "$runtime_mode" = "oke" ]; then
            echo "::add-mask::$cluster_ocid"
            echo "::add-mask::$endpoint_nsg_ocid"
            set_output cluster_ocid "$cluster_ocid"
            set_output endpoint_nsg_ocid "$endpoint_nsg_ocid"
          else
            echo "::add-mask::$instance_ocid"
            set_output instance_ocid "$instance_ocid"
          fi
          set_output public_url "https://$public_host"
          set_output redirect_url "https://$redirect_host"
          set_output diagnostic_url "https://$diagnostic_host"

          if [ "$FAILED_ACTIVATION_RUN_ID" != "0" ]; then
            EVIDENCE_DIR=artifacts/prerequisite \
            EXPECTED_SOURCE_SHA="$RESUME_SOURCE_SHA" \
            EXPECTED_BUILD_RUN_ID="$BUILD_RUN_ID" \
            EXPECTED_INFRASTRUCTURE_RUN_ID="$INFRASTRUCTURE_RUN_ID" \
            EXPECTED_CHECKPOINT_SOURCE_SHA="$CHECKPOINT_SOURCE_SHA" \
            EXPECTED_DISK_CHECKPOINT_RUN_ID="$DISK_CHECKPOINT_RUN_ID" \
            EXPECTED_DISK_CHECKPOINT_SHA256="$disk_checkpoint_sha256" \
            EXPECTED_DISK_CHECKPOINT_DISPOSITION="$disk_checkpoint_disposition" \
            EXPECTED_PHASE=apply-slip-index \
            EXPECTED_RUN_ID="$PREREQUISITE_RUN_ID" \
            EXPECTED_RUN_ATTEMPT=1 \
            EXPECTED_BASELINE_RECOVERY_RUN_ID="$BASELINE_RECOVERY_RUN_ID" \
            EXPECTED_BASELINE_RECOVERY_SOURCE_SHA="$BASELINE_RECOVERY_SOURCE_SHA" \
              ./infra/oci/scripts/verify-live-betting-data-evidence-stan.sh
          elif [ "$PHASE" != "dry-run" ] &&
               [ "$FAILED_DEPLOY_RUN_ID" = "0" ]; then
            expected_phase=dry-run
            [ "$PHASE" != "apply-slip-index" ] || expected_phase=apply-backfills
            EVIDENCE_DIR=artifacts/prerequisite \
            EXPECTED_SOURCE_SHA="$SOURCE_SHA" \
            EXPECTED_BUILD_RUN_ID="$BUILD_RUN_ID" \
            EXPECTED_INFRASTRUCTURE_RUN_ID="$INFRASTRUCTURE_RUN_ID" \
            EXPECTED_CHECKPOINT_SOURCE_SHA="$CHECKPOINT_SOURCE_SHA" \
            EXPECTED_DISK_CHECKPOINT_RUN_ID="$DISK_CHECKPOINT_RUN_ID" \
            EXPECTED_DISK_CHECKPOINT_SHA256="$disk_checkpoint_sha256" \
            EXPECTED_DISK_CHECKPOINT_DISPOSITION="$disk_checkpoint_disposition" \
            EXPECTED_PHASE="$expected_phase" \
            EXPECTED_RUN_ID="$PREREQUISITE_RUN_ID" \
            EXPECTED_RUN_ATTEMPT=1 \
            EXPECTED_BASELINE_RECOVERY_RUN_ID="$BASELINE_RECOVERY_RUN_ID" \
            EXPECTED_BASELINE_RECOVERY_SOURCE_SHA="$BASELINE_RECOVERY_SOURCE_SHA" \
              ./infra/oci/scripts/verify-live-betting-data-evidence-stan.sh
          elif [ "$FAILED_DEPLOY_RUN_ID" != "0" ]; then
            evidence_value() {
              local key="$1"
              awk -F= -v key="$key" '
                $1 == key {
                  if (found++) exit 1
                  value = substr($0, length(key) + 2)
                }
                END {
                  if (found != 1) exit 1
                  print value
                }
              ' artifacts/prerequisite/provenance.env
            }

            prior_source_sha="$(evidence_value source_sha)"
            prior_build_run_id="$(evidence_value build_run_id)"
            prior_infrastructure_run_id="$(evidence_value infrastructure_run_id)"
            prior_checkpoint_source_sha="$(evidence_value checkpoint_source_sha)"
            prior_disk_checkpoint_run_id="$(evidence_value disk_checkpoint_run_id)"
            prior_disk_checkpoint_sha256="$(evidence_value disk_checkpoint_sha256)"
            prior_disk_checkpoint_disposition="$(
              evidence_value disk_checkpoint_disposition
            )"
            prior_baseline_recovery_run_id="$(evidence_value baseline_recovery_run_id)"
            prior_baseline_recovery_source_sha="$(
              evidence_value baseline_recovery_source_sha
            )"
            [ "$prior_source_sha" = "$RESUME_SOURCE_SHA" ]
            [ "$prior_build_run_id" = "$BUILD_RUN_ID" ]
            [ "$prior_infrastructure_run_id" = "$INFRASTRUCTURE_RUN_ID" ]
            [ "$prior_baseline_recovery_run_id" = "$BASELINE_RECOVERY_RUN_ID" ]
            [ "$prior_baseline_recovery_source_sha" = "$BASELINE_RECOVERY_SOURCE_SHA" ]
            [ "$prior_checkpoint_source_sha" = "$CHECKPOINT_SOURCE_SHA" ]
            [ "$prior_disk_checkpoint_run_id" = "$DISK_CHECKPOINT_RUN_ID" ]
            [ "$prior_disk_checkpoint_sha256" = "$disk_checkpoint_sha256" ]
            [ "$prior_disk_checkpoint_disposition" = \
              "$disk_checkpoint_disposition" ]
            git merge-base --is-ancestor "$prior_source_sha" "$SOURCE_SHA"
            while IFS= read -r changed_path; do
              case "$changed_path" in
                .github/*|infra/*|*.md) ;;
                *)
                  echo "Application path changed after applied data: $changed_path" >&2
                  exit 1
                  ;;
              esac
            done < <(git diff --name-only "$prior_source_sha" "$SOURCE_SHA" --)

            resume_resolution="$(
              EVIDENCE_DIR=artifacts/prerequisite \
              EXPECTED_SOURCE_SHA="$prior_source_sha" \
              EXPECTED_BUILD_RUN_ID="$prior_build_run_id" \
              EXPECTED_INFRASTRUCTURE_RUN_ID="$prior_infrastructure_run_id" \
              EXPECTED_CHECKPOINT_SOURCE_SHA="$CHECKPOINT_SOURCE_SHA" \
              EXPECTED_DISK_CHECKPOINT_RUN_ID="$DISK_CHECKPOINT_RUN_ID" \
              EXPECTED_DISK_CHECKPOINT_SHA256="$disk_checkpoint_sha256" \
              EXPECTED_DISK_CHECKPOINT_DISPOSITION="$disk_checkpoint_disposition" \
              EXPECTED_PHASE=apply-slip-index \
              EXPECTED_RUN_ID="$PREREQUISITE_RUN_ID" \
              EXPECTED_RUN_ATTEMPT=1 \
              EXPECTED_BASELINE_RECOVERY_RUN_ID="$BASELINE_RECOVERY_RUN_ID" \
              EXPECTED_BASELINE_RECOVERY_SOURCE_SHA="$BASELINE_RECOVERY_SOURCE_SHA" \
              RESUME_BASELINE_DIR=artifacts/oci-data-baseline-before \
              VERIFY_RESUME_APPLIED_RUN=true \
              RESUME_REPOSITORY="$REPOSITORY" \
                ./infra/oci/scripts/verify-live-betting-data-evidence-stan.sh
            )"
            resolution_value() {
              local key="$1"
              awk -F= -v key="$key" '
                $1 == key {
                  if (found++) exit 1
                  value = substr($0, length(key) + 2)
                }
                END {
                  if (found != 1) exit 1
                  print value
                }
              ' <<<"$resume_resolution"
            }
            set_output \
              resume_applied_data_run_id \
              "$(resolution_value applied_data_run_id)"
            set_output \
              resume_applied_source_sha \
              "$(resolution_value applied_source_sha)"
            [ "$(resolution_value applied_source_sha)" = \
              "$CHECKPOINT_SOURCE_SHA" ]
            [ "$(resolution_value checkpoint_source_sha)" = \
              "$CHECKPOINT_SOURCE_SHA" ]
            [ "$(resolution_value disk_checkpoint_run_id)" = \
              "$DISK_CHECKPOINT_RUN_ID" ]
            [ "$(resolution_value disk_checkpoint_sha256)" = \
              "$disk_checkpoint_sha256" ]
            [ "$(resolution_value disk_checkpoint_disposition)" = \
              "$disk_checkpoint_disposition" ]
            printf '%s\n' "$resume_resolution"

            resume_artifact_name="oci-image-provenance-${prior_checkpoint_source_sha}-${prior_build_run_id}-1"
            gh run download "$prior_build_run_id" \
              --repo "$REPOSITORY" \
              --name "$resume_artifact_name" \
              --dir artifacts/resume-build
            PROVENANCE_DIR=artifacts/resume-build \
            SOURCE_SHA="$prior_checkpoint_source_sha" \
            EXPECTED_BUILD_RUN_ID="$prior_build_run_id" \
            EXPECTED_BUILD_RUN_ATTEMPT=1 \
            OUTPUT_FILE=artifacts/oci-live-data-rollout/resume-images.tsv \
            VERIFY_REMOTE=0 BOOT_IMAGES=0 \
              ./infra/oci/scripts/verify-images.sh
            cmp -s \
              artifacts/oci-live-data-rollout/images.tsv \
              artifacts/oci-live-data-rollout/resume-images.tsv
          fi

      - name: Install pinned OCI CLI
        id: oci_cli
        run: ./infra/oci/scripts/install-cli.sh

      - name: Verify OKE identity
        if: env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_CLUSTER_OCID: ${{ steps.provenance.outputs.cluster_ocid }}
        run: |
          oci ce cluster get \
            --cluster-id "$OCI_CLUSTER_OCID" \
            --query 'data.{type:type,state:"lifecycle-state"}' \
            >/dev/null

      - name: Verify k3s identity
        if: env.OCI_RUNTIME_MODE == 'k3s'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_INSTANCE_OCID: ${{ steps.provenance.outputs.instance_ocid }}
        run: |
          oci compute instance get \
            --instance-id "$OCI_INSTANCE_OCID" \
            --query 'data.{shape:shape,state:"lifecycle-state"}' \
            >/dev/null

      - name: Reconcile expired and authorize current runner IPv4
        if: env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_ENDPOINT_NSG_OCID: ${{ steps.provenance.outputs.endpoint_nsg_ocid }}
          RULE_STATE_FILE: artifacts/oci-live-data-rollout/runner-rule.env
        run: |
          set -euo pipefail
          ./infra/oci/scripts/authorize-github-runner.sh cleanup-stale
          RUNNER_PUBLIC_IPV4="$(curl --fail --silent --show-error --max-time 15 https://api.ipify.org)"
          export RUNNER_PUBLIC_IPV4
          ./infra/oci/scripts/authorize-github-runner.sh authorize

      - name: Configure kubectl from exact cluster OCID
        if: env.OCI_RUNTIME_MODE == 'oke'
        uses: oracle-actions/configure-kubectl-oke@77a733d79446dabe7bf0e58eb56197d33ce4dc58 # v1.5.0
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
        with:
          cluster: ${{ steps.provenance.outputs.cluster_ocid }}

      - name: Open ephemeral OCI Bastion access to k3s
        if: env.OCI_RUNTIME_MODE == 'k3s'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_K3S_SSH_PRIVATE_KEY: ${{ secrets.OCI_K3S_SSH_PRIVATE_KEY }}
          OCI_K3S_RETAIN_TARGET_SSH: "true"
          INFRA_PROVENANCE_FILE: artifacts/infrastructure/provenance.env
          SESSION_STATE_FILE: artifacts/oci-live-data-rollout/k3s-access.env
          WORK_DIR: ${{ runner.temp }}/betstan-k3s-access
        run: |
          set -euo pipefail
          RUNNER_PUBLIC_IPV4="$(
            curl --fail --silent --show-error --max-time 15 https://api.ipify.org
          )"
          export RUNNER_PUBLIC_IPV4
          ./infra/oci/scripts/configure-k3s-access.sh open

      - name: Verify exact failed-deploy resume state
        if: >-
          inputs.failed_deploy_run_id != '0' &&
          inputs.failed_activation_run_id == '0'
        env:
          RESUME_SOURCE_SHA: ${{ inputs.resume_source_sha }}
          RESUME_MAINTENANCE_MODE: ${{ steps.provenance_request.outputs.resume_maintenance_mode }}
          BASELINE_RECOVERY_SOURCE_SHA: ${{ inputs.baseline_recovery_source_sha }}
          RESOLVED_APPLIED_DATA_RUN_ID: ${{ steps.provenance.outputs.resume_applied_data_run_id }}
          RESOLVED_APPLIED_SOURCE_SHA: ${{ steps.provenance.outputs.resume_applied_source_sha }}
        run: |
          set -euo pipefail
          resume_images=artifacts/oci-live-data-rollout/resume-images.tsv
          prior_evidence=artifacts/prerequisite/provenance.env
          baseline_dir=artifacts/oci-data-baseline-before
          [ -f "$resume_images" ] && [ -f "$prior_evidence" ]
          expected_baseline_sha="$(
            awk -F= '$1 == "baseline_sha256" {
              if (found++) exit 1
              value=$2
            } END {
              if (found != 1) exit 1
              print value
            }' "$prior_evidence"
          )"
          observed_baseline_sha="$(
            sha256sum "$baseline_dir/SHA256SUMS" | awk '{print $1}'
          )"
          if [ "$observed_baseline_sha" != "$expected_baseline_sha" ]; then
            echo "::error::Resume rollback baseline digest differs from the prerequisite data evidence"
            exit 1
          fi
          [[ "$RESOLVED_APPLIED_DATA_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RESOLVED_APPLIED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor \
            "$RESOLVED_APPLIED_SOURCE_SHA" "$RESUME_SOURCE_SHA"
          expected_baseline_source_sha=
          expected_recovery_run_id=
          if [ "$BASELINE_RECOVERY_RUN_ID" != "0" ]; then
            expected_baseline_source_sha="$BASELINE_RECOVERY_SOURCE_SHA"
            expected_recovery_run_id="$BASELINE_RECOVERY_RUN_ID"
          fi
          BASELINE_DIR="$baseline_dir" \
          EXPECTED_SOURCE_SHA="$expected_baseline_source_sha" \
          EXPECTED_NAMESPACE="$OCI_K8S_NAMESPACE" \
          EXPECTED_RECOVERY_RUN_ID="$expected_recovery_run_id" \
          REQUIRE_CURRENT_DEPLOY_PROVENANCE=true \
            ./infra/oci/scripts/validate-rollback-baseline-stan.sh

          case "$RESUME_MAINTENANCE_MODE" in
            released-runtime)
              ;;
            retained-hold)
              ./infra/oci/scripts/live-data-maintenance-stan.sh verify-quiesced
              NAMESPACE="$OCI_K8S_NAMESPACE" \
              LOCK_TOKEN="live-data-${RESOLVED_APPLIED_DATA_RUN_ID}-1" \
              OPERATION_ID="live-data-apply-slip-index" \
              SOURCE_SHA="$RESOLVED_APPLIED_SOURCE_SHA" \
                ./infra/oci/scripts/shared-mongo-operation-lock-stan.sh verify
              ;;
            *)
              echo "Unsupported resume maintenance mode: $RESUME_MAINTENANCE_MODE" >&2
              exit 1
              ;;
          esac

          for service in auth bet backoffice client event gamemaster moderation resulting slip; do
            expected_ref="$(
              awk -F '\t' -v service="$service" '
                $1 == service { count++; value=$3 }
                END { if (count != 1) exit 1; print value }
              ' "$resume_images"
            )"
            deployment="gaming-${service}-depl"
            actual_ref="$(
              kubectl get deployment "$deployment" -n "$OCI_K8S_NAMESPACE" \
                -o jsonpath='{.spec.template.spec.containers[0].image}'
            )"
            case "$service" in
              auth|client)
                if [ "$actual_ref" != "$expected_ref" ]; then
                  echo "::error::Resume candidate-only deployment image mismatch for ${service}"
                  exit 1
                fi
                ;;
              backoffice|bet|event|gamemaster|moderation|resulting|slip)
                if [ "$RESUME_MAINTENANCE_MODE" = "released-runtime" ]; then
                  if [ "$actual_ref" != "$expected_ref" ]; then
                    echo "::error::Resume candidate-only deployment image mismatch for ${service}"
                    exit 1
                  fi
                elif [ "$actual_ref" != "$expected_ref" ]; then
                  if ! baseline_ref="$(
                    awk -F '\t' -v service="$service" '
                      $1 == service {
                        count++
                        if (NF != 2) invalid=1
                        value=$2
                      }
                      END {
                        if (count != 1 || invalid) exit 1
                        print value
                      }
                    ' "$baseline_dir/live-images.tsv"
                  )" || [[ ! "$baseline_ref" =~ ^ghcr\.io/vasilyevstan/betstan-images@sha256:[0-9a-f]{64}$ ]]; then
                    echo "::error::Resume baseline image evidence is invalid for writer ${service}"
                    exit 1
                  fi
                  if [ "$actual_ref" != "$baseline_ref" ]; then
                    echo "::error::Retained-hold writer image mismatch for ${service}: expected its candidate or validated own baseline image"
                    exit 1
                  fi
                fi
                ;;
            esac
          done

          for service in auth client; do
            expected_manifest="$(
              awk -F '\t' -v service="$service" '
                $1 == service { count++; value=$4 }
                END { if (count != 1) exit 1; print value }
              ' "$resume_images"
            )"
            expected_platform="$(
              awk -F '\t' -v service="$service" '
                $1 == service { count++; value=$5 }
                END { if (count != 1) exit 1; print value }
              ' "$resume_images"
            )"
            deployment="gaming-${service}-depl"
            container="gaming-${service}"
            kubectl rollout status "deployment/$deployment" \
              -n "$OCI_K8S_NAMESPACE" --timeout=2m >/dev/null
            pods_json="$(
              kubectl get pods -n "$OCI_K8S_NAMESPACE" \
                -l "app=gaming-${service}" -o json
            )"
            if ! jq -e \
                --arg container "$container" \
                --arg manifest "$expected_manifest" \
                --arg platform "$expected_platform" '
                  [
                    .items[] |
                    select(.metadata.deletionTimestamp == null) |
                    .status.containerStatuses[]? |
                    select(.name == $container)
                  ] as $statuses |
                  ($statuses | length) > 0 and
                  ($statuses | all(
                    .ready == true and
                    (
                      (.imageID | endswith("@" + $manifest)) or
                      (.imageID | endswith("@" + $platform))
                    )
                  ))
                ' <<<"$pods_json" >/dev/null; then
              observed_image_ids="$(
                jq -r \
                  --arg container "$container" '
                    [
                      .items[] |
                      select(.metadata.deletionTimestamp == null) |
                      .status.containerStatuses[]? |
                      select(.name == $container) |
                      (.imageID // "missing")
                    ] | unique | join(",")
                  ' <<<"$pods_json"
              )"
              echo "::error::Resume supporting pod image mismatch for ${service}: expected manifest ${expected_manifest} or ARM64 child ${expected_platform}, observed ${observed_image_ids:-none}"
              exit 1
            fi
          done

          mkdir -p artifacts/oci-live-data-rollout/evidence
          cat >artifacts/oci-live-data-rollout/evidence/resume-authority.env <<EOF
          schema_version=live-betting-data-resume-v2
          applied_data_run_id=$RESOLVED_APPLIED_DATA_RUN_ID
          applied_source_sha=$RESOLVED_APPLIED_SOURCE_SHA
          failed_deploy_run_id=$FAILED_DEPLOY_RUN_ID
          resume_maintenance_mode=$RESUME_MAINTENANCE_MODE
          failed_deploy_job_conclusion=${{ steps.provenance_request.outputs.failed_deploy_job_conclusion }}
          public_validate_job_conclusion=${{ steps.provenance_request.outputs.public_validate_job_conclusion }}
          lock_release_step_conclusion=${{ steps.provenance_request.outputs.lock_release_step_conclusion }}
          fence_release_step_conclusion=${{ steps.provenance_request.outputs.fence_release_step_conclusion }}
          rehold_step_conclusion=${{ steps.provenance_request.outputs.rehold_step_conclusion }}
          failed_activation_run_id=$FAILED_ACTIVATION_RUN_ID
          current_source_sha=$SOURCE_SHA
          baseline_sha256=$observed_baseline_sha
          runtime_images_sha256=$(sha256sum "$resume_images" | awk '{print $1}')
          checkpoint_source_sha=$CHECKPOINT_SOURCE_SHA
          disk_checkpoint_run_id=$DISK_CHECKPOINT_RUN_ID
          disk_checkpoint_sha256=${{ steps.provenance.outputs.disk_checkpoint_sha256 }}
          disk_checkpoint_disposition=${{ steps.provenance.outputs.disk_checkpoint_disposition }}
          application_change_scope=github-infra-docs-only
          status=PASS
          EOF

      - name: Capture and validate pre-mutation rollback baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUTPUT_DIR: artifacts/oci-data-baseline-before
          BASELINE_RECOVERY_SOURCE_SHA: ${{ inputs.baseline_recovery_source_sha }}
          OCI_PUBLIC_URL: ${{ steps.provenance.outputs.public_url }}
          OCI_REDIRECT_URL: ${{ steps.provenance.outputs.redirect_url }}
          OCI_DIAGNOSTIC_URL: ${{ steps.provenance.outputs.diagnostic_url }}
          SSE_REQUIREMENT: deployed-source
        run: |
          if [ "$FAILED_DEPLOY_RUN_ID" != "0" ] &&
             [ "$FAILED_ACTIVATION_RUN_ID" = "0" ]; then
            [ -f artifacts/oci-data-baseline-before/SHA256SUMS ]
          elif [ "$BASELINE_RECOVERY_RUN_ID" = "0" ]; then
            ./infra/oci/scripts/baseline-capture-stan.sh
          else
            BASELINE_RECOVERY_DIR=artifacts/recovery \
              ./infra/oci/scripts/baseline-capture-stan.sh
          fi
          if [ "$PHASE" = "apply-slip-index" ]; then
            source ./infra/oci/scripts/lib.sh || exit 1
            expected_baseline_source_sha=
            expected_recovery_run_id=
            if [ "$BASELINE_RECOVERY_RUN_ID" = "0" ]; then
              [ "$BASELINE_RECOVERY_SOURCE_SHA" = "none" ] ||
                oci_die "baseline recovery source requires a selected recovery run"
              if [ "$FAILED_DEPLOY_RUN_ID" = "0" ] ||
                 [ "$FAILED_ACTIVATION_RUN_ID" != "0" ]; then
                expected_recovery_run_id=0
              fi
            else
              [[ "$BASELINE_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ &&
                 "$BASELINE_RECOVERY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
                oci_die "selected baseline recovery requires its authenticated source SHA"
              expected_baseline_source_sha="$BASELINE_RECOVERY_SOURCE_SHA"
              expected_recovery_run_id="$BASELINE_RECOVERY_RUN_ID"
            fi
            EXPECTED_SOURCE_SHA="$expected_baseline_source_sha" \
            EXPECTED_NAMESPACE="$OCI_K8S_NAMESPACE" \
            EXPECTED_RECOVERY_RUN_ID="$expected_recovery_run_id" \
            REQUIRE_CURRENT_DEPLOY_PROVENANCE=true \
              oci_require_retained_telemetry_restore_profile "$OUTPUT_DIR" ||
              oci_die "final data handoff baseline validation failed"
          fi
          printf 'BASELINE_SHA256=%s\n' \
            "$(sha256sum artifacts/oci-data-baseline-before/SHA256SUMS | awk '{print $1}')" \
            >> "$GITHUB_ENV"

      - name: Revalidate exact release disk checkpoint before lock mutation
        if: env.OCI_RUNTIME_MODE == 'k3s'
        env:
          RESUME_MAINTENANCE_MODE: ${{ steps.provenance_request.outputs.resume_maintenance_mode || 'none' }}
          SESSION_STATE_FILE: artifacts/oci-live-data-rollout/k3s-access.env
          INFRA_PROVENANCE_FILE: artifacts/infrastructure/provenance.env
          CANDIDATE_IMAGES_FILE: artifacts/oci-live-data-rollout/images.tsv
          CHECKPOINT_FILE: artifacts/disk-checkpoint/checkpoint.json
          WORK_DIR: ${{ runner.temp }}/live-data-disk-checkpoint
        run: |
          set -euo pipefail
          profile=public
          if [ "$FAILED_DEPLOY_RUN_ID" != "0" ] &&
             [ "$FAILED_ACTIVATION_RUN_ID" = "0" ] &&
             [ "$RESUME_MAINTENANCE_MODE" = "retained-hold" ]; then
            profile=held
          fi
          SOURCE_SHA="$CHECKPOINT_SOURCE_SHA" \
          CONTROL_SHA="$CHECKPOINT_SOURCE_SHA" \
          GHCR_BUILD_RUN_ID="$BUILD_RUN_ID" \
          DISK_CHECKPOINT_RUN_ID="$DISK_CHECKPOINT_RUN_ID" \
          REVALIDATION_PROFILE="$profile" \
            ./infra/oci/scripts/k3s-node-disk-recovery-stan.sh revalidate

      - name: Acquire database operation lock
        id: operation_lock
        run: |
          if [ "$FAILED_DEPLOY_RUN_ID" != "0" ] &&
             [ "$FAILED_ACTIVATION_RUN_ID" = "0" ] &&
             [ "${{ steps.provenance_request.outputs.resume_maintenance_mode }}" = "retained-hold" ]; then
            NAMESPACE="$OCI_K8S_NAMESPACE" \
            LOCK_TOKEN="live-data-${{ steps.provenance.outputs.resume_applied_data_run_id }}-1" \
            OPERATION_ID="live-data-apply-slip-index" \
            SOURCE_SHA="${{ steps.provenance.outputs.resume_applied_source_sha }}" \
              ./infra/oci/scripts/shared-mongo-operation-lock-stan.sh release
          fi
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
          OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
          LOCK_LEASE_SECONDS="$SHARED_MONGO_LOCK_LEASE_SECONDS" \
          SOURCE_SHA="$SOURCE_SHA" \
            ./infra/azure/agents/shared-mongo-operation-lock-stan.sh acquire

      - name: Enter or re-establish live data maintenance
        id: maintenance_enter
        if: inputs.phase != 'dry-run'
        env:
          RESUME_MAINTENANCE_MODE: ${{ steps.provenance_request.outputs.resume_maintenance_mode || 'none' }}
          STATE_FILE: ${{ runner.temp }}/live-data-maintenance.tsv
        run: |
          set -euo pipefail
          if [ "$FAILED_ACTIVATION_RUN_ID" != "0" ] ||
             [ "$FAILED_DEPLOY_RUN_ID" = "0" ] ||
             [ "$RESUME_MAINTENANCE_MODE" = "released-runtime" ]; then
            ./infra/oci/scripts/live-data-maintenance-stan.sh enter
          else
            [ "$RESUME_MAINTENANCE_MODE" = "retained-hold" ] || {
              echo "Unsupported resume maintenance mode: $RESUME_MAINTENANCE_MODE" >&2
              exit 1
            }
            ./infra/oci/scripts/live-data-maintenance-stan.sh hold
          fi

      - name: Demote and verify exact retained live-acceptance account
        if: inputs.failed_activation_run_id != '0'
        run: |
          set -euo pipefail
          kubectl exec -n "$OCI_K8S_NAMESPACE" \
            deployment/gaming-auth-depl \
            -c gaming-auth -- \
            env \
              "USER_ID=$FAILED_ACTIVATION_USER_ID" \
              USER_ROLE=USER \
              "USER_ROLE_CHANGE_CONFIRMATION=SET_ROLE:$FAILED_ACTIVATION_USER_ID:USER" \
              node dist/scripts/SetUserRole.js

          pods_json="$(
            kubectl get pods -n "$OCI_K8S_NAMESPACE" \
              -l app=gaming-auth-mongo -o json
          )"
          mongo_pod="$(
            jq -er '
              [
                .items[] |
                select(
                  .metadata.deletionTimestamp == null and
                  .status.phase == "Running"
                ) |
                .metadata.name
              ] |
              if length == 1 then .[0]
              else error("expected one running Mongo pod")
              end
            ' <<<"$pods_json"
          )"
          mongo_script="$(
            cat <<EOF
          const userId = "$FAILED_ACTIVATION_USER_ID";
          const users = db.getSiblingDB("gaming_auth").users;
          const matches = users.find(
            {_id: ObjectId(userId)},
            {_id: 1, role: 1}
          ).toArray();
          if (matches.length !== 1 || matches[0].role !== "USER") {
            throw new Error("retained live-acceptance account role differs");
          }
          print(JSON.stringify({
            verified: true,
            userCount: matches.length,
            role: matches[0].role
          }));
          EOF
          )"
          raw_result="$(
            kubectl exec -n "$OCI_K8S_NAMESPACE" "$mongo_pod" -- \
              mongosh --quiet --norc --eval "$mongo_script"
          )"
          result="$(tail -n 1 <<<"$raw_result")"
          jq -e '
            type == "object" and
            .verified == true and
            .userCount == 1 and
            .role == "USER" and
            (keys | sort) == ["role", "userCount", "verified"]
          ' <<<"$result" >/dev/null

          output=artifacts/oci-live-data-rollout/evidence/failed-live-acceptance-role.json
          temporary="${output}.tmp"
          trap 'rm -f "$temporary"' EXIT
          jq -cS \
            --arg run_id "$FAILED_ACTIVATION_RUN_ID" '
              {
                schemaVersion: "failed-live-acceptance-role.v1",
                failedActivationRunId: $run_id,
                verified: .verified,
                userCount: .userCount,
                role: .role
              }
            ' <<<"$result" >"$temporary"
          chmod 600 "$temporary"
          mv "$temporary" "$output"
          trap - EXIT

      - name: Delete exact orphaned live-acceptance slips
        if: inputs.failed_activation_run_id != '0'
        env:
          OUTPUT_FILE: artifacts/oci-live-data-rollout/evidence/failed-live-acceptance-cleanup.json
        run: |
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          CONFIRMATION="DELETE_FAILED_LIVE_DRAFT:$FAILED_ACTIVATION_RUN_ID:$FAILED_ACTIVATION_USER_ID" \
          EXPECTED_AUTH_USER_COUNT=1 \
          ALLOWED_BET_KINDS=LIVE,PRE_MATCH \
          MAX_ACTIVE_SLIPS=2 \
            ./infra/oci/scripts/cleanup-live-acceptance-slips-stan.sh

      - name: Execute exact-digest live data phase
        id: data
        env:
          IMAGE_PROVENANCE_FILE: artifacts/oci-live-data-rollout/images.tsv
          OUTPUT_DIR: artifacts/oci-live-data-rollout/evidence
          JOB_TIMEOUT_SECONDS: "1800"
          BATCH_SIZE: "100"
          MAINTENANCE_FENCE_ENFORCED: ${{ inputs.phase != 'dry-run' }}
          WRITERS_QUIESCED: ${{ inputs.phase != 'dry-run' }}
          RUNTIME_HELD_FOR_DEPLOY: ${{ inputs.phase == 'apply-slip-index' }}
          OPERATION_LOCK_ENFORCED: "true"
          OPERATION_LOCK_HANDOFF: ${{ inputs.phase == 'apply-slip-index' }}
          BASELINE_RECOVERY_RUN_ID: ${{ inputs.baseline_recovery_run_id }}
          BASELINE_RECOVERY_SOURCE_SHA: ${{ inputs.baseline_recovery_source_sha }}
          DISK_CHECKPOINT_SHA256: ${{ steps.provenance.outputs.disk_checkpoint_sha256 }}
          DISK_CHECKPOINT_DISPOSITION: ${{ steps.provenance.outputs.disk_checkpoint_disposition }}
        run: ./infra/oci/scripts/live-betting-data-rollout-stan.sh

      - name: Restore runtime or verify final deploy handoff
        id: maintenance
        if: always() && steps.maintenance_enter.outcome == 'success'
        env:
          DATA_OUTCOME: ${{ steps.data.outcome }}
          RESUME_MAINTENANCE_MODE: ${{ steps.provenance_request.outputs.resume_maintenance_mode || 'none' }}
          STATE_FILE: ${{ runner.temp }}/live-data-maintenance.tsv
        run: |
          set -euo pipefail
          restore_or_verify_retained_hold() {
            if [ "$PHASE" = "apply-slip-index" ]; then
              ./infra/oci/scripts/live-data-maintenance-stan.sh hold
              ./infra/oci/scripts/live-data-maintenance-stan.sh verify-held
              NAMESPACE="$OCI_K8S_NAMESPACE" \
              LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
              OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
              LOCK_LEASE_SECONDS="$SHARED_MONGO_LOCK_LEASE_SECONDS" \
              SOURCE_SHA="$SOURCE_SHA" \
                ./infra/azure/agents/shared-mongo-operation-lock-stan.sh renew
              NAMESPACE="$OCI_K8S_NAMESPACE" \
              LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
              OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
              SOURCE_SHA="$SOURCE_SHA" \
                ./infra/azure/agents/shared-mongo-operation-lock-stan.sh verify
              return
            fi
            if [ "$FAILED_DEPLOY_RUN_ID" = "0" ] ||
               [ "$RESUME_MAINTENANCE_MODE" = "released-runtime" ]; then
              ./infra/oci/scripts/live-data-maintenance-stan.sh restore
            else
              [ "$RESUME_MAINTENANCE_MODE" = "retained-hold" ] || {
                echo "Unsupported resume maintenance mode: $RESUME_MAINTENANCE_MODE" >&2
                exit 1
              }
              ./infra/oci/scripts/live-data-maintenance-stan.sh verify-held
            fi
          }
          if [[ "$PHASE" == "apply-slip-index" && "$DATA_OUTCOME" == "success" ]]; then
            if ! ./infra/oci/scripts/live-data-maintenance-stan.sh verify-held; then
              restore_or_verify_retained_hold
              exit 1
            fi
            if ! NAMESPACE="$OCI_K8S_NAMESPACE" \
              LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
              OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
              SOURCE_SHA="$SOURCE_SHA" \
                ./infra/azure/agents/shared-mongo-operation-lock-stan.sh verify; then
              restore_or_verify_retained_hold
              exit 1
            fi
            if ! NAMESPACE="$OCI_K8S_NAMESPACE" \
              LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
              OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
              LOCK_LEASE_SECONDS="$SHARED_MONGO_HANDOFF_LOCK_LEASE_SECONDS" \
              SOURCE_SHA="$SOURCE_SHA" \
                ./infra/azure/agents/shared-mongo-operation-lock-stan.sh renew; then
              restore_or_verify_retained_hold
              exit 1
            fi
          else
            restore_or_verify_retained_hold
          fi

      - name: Capture post-phase runtime baseline
        if: >-
          steps.data.outcome == 'success' &&
          inputs.phase != 'apply-slip-index' &&
          (inputs.phase == 'dry-run' || steps.maintenance.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUTPUT_DIR: artifacts/oci-data-baseline-after
          OCI_PUBLIC_URL: ${{ steps.provenance.outputs.public_url }}
          OCI_REDIRECT_URL: ${{ steps.provenance.outputs.redirect_url }}
          OCI_DIAGNOSTIC_URL: ${{ steps.provenance.outputs.diagnostic_url }}
          SSE_REQUIREMENT: deployed-source
        run: |
          if [ "$BASELINE_RECOVERY_RUN_ID" = "0" ]; then
            ./infra/oci/scripts/baseline-capture-stan.sh
          else
            BASELINE_RECOVERY_DIR=artifacts/recovery \
              ./infra/oci/scripts/baseline-capture-stan.sh
          fi

      - name: Require executed data-step evidence
        if: always() && steps.data.outcome != 'skipped'
        run: |
          test -f artifacts/oci-live-data-rollout/evidence/SHA256SUMS || {
            echo "Executed live-data step did not produce checksummed evidence" >&2
            exit 1
          }

      - name: Upload exact sanitized data evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: oci-live-data-rollout-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oci-live-data-rollout/evidence
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload protected rollout baselines
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: oci-live-data-baselines-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/oci-data-baseline-before
            artifacts/oci-data-baseline-after
          if-no-files-found: ignore
          retention-days: 30

      - name: Restore runtime or retain hold if final handoff packaging failed
        id: abort_handoff
        if: >-
          always() &&
          (failure() || cancelled()) &&
          inputs.phase == 'apply-slip-index' &&
          steps.maintenance_enter.outcome == 'success'
        env:
          STATE_FILE: ${{ runner.temp }}/live-data-maintenance.tsv
        run: |
          set -euo pipefail
          ./infra/oci/scripts/live-data-maintenance-stan.sh hold
          ./infra/oci/scripts/live-data-maintenance-stan.sh verify-held
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
          OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
          LOCK_LEASE_SECONDS="$SHARED_MONGO_LOCK_LEASE_SECONDS" \
          SOURCE_SHA="$SOURCE_SHA" \
            ./infra/azure/agents/shared-mongo-operation-lock-stan.sh renew
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
          OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
          SOURCE_SHA="$SOURCE_SHA" \
            ./infra/azure/agents/shared-mongo-operation-lock-stan.sh verify

      - name: Release database operation lock unless handed to deploy
        if: >-
          always() &&
          steps.operation_lock.outcome == 'success' &&
          (inputs.phase != 'apply-slip-index' ||
           steps.maintenance_enter.outcome != 'success')
        run: |
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
          OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
          SOURCE_SHA="$SOURCE_SHA" \
            ./infra/azure/agents/shared-mongo-operation-lock-stan.sh release
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
          OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
          SOURCE_SHA="$SOURCE_SHA" \
            ./infra/azure/agents/shared-mongo-operation-lock-stan.sh verify-released

      - name: Revoke exact runner rule
        if: always() && env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          RULE_STATE_FILE: artifacts/oci-live-data-rollout/runner-rule.env
        run: |
          if [ -f "$RULE_STATE_FILE" ]; then
            ./infra/oci/scripts/revoke-github-runner.sh "$RULE_STATE_FILE"
          fi

      - name: Close ephemeral OCI Bastion access
        if: >-
          always() &&
          env.OCI_RUNTIME_MODE == 'k3s' &&
          steps.oci_cli.outcome == 'success'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          SESSION_STATE_FILE: artifacts/oci-live-data-rollout/k3s-access.env
          WORK_DIR: ${{ runner.temp }}/betstan-k3s-access
        run: ./infra/oci/scripts/configure-k3s-access.sh cleanup

      - name: Remove isolated OCI client state
        if: always()
        run: rm -rf "$RUNNER_TEMP/oci-home"
