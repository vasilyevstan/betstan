name: oci-migration-recovery
run-name: azure migration recovery ${{ github.event.workflow_run.id || github.run_id }}

on:
  workflow_run:
    workflows: ["oci-migrate"]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact migration journal SHA on master
        required: true
        type: string
      migration_run_id:
        description: Exact interrupted oci-migrate run ID
        required: true
        type: string
      migration_run_attempt:
        description: Exact interrupted oci-migrate run attempt
        required: true
        default: "1"
        type: string
      migration_id:
        description: Exact migration journal ID
        required: true
        type: string
      fencing_generation:
        description: Exact migration journal fencing generation
        required: true
        type: string
      confirmation:
        description: Type STOP AZURE FOR EXACT MIGRATION
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: azure-migration-recovery
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.run_attempt == 1 &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'schedule' &&
          vars.OCI_MIGRATION_RECOVERY_ENABLED == 'true'
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion != 'success' &&
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.run_attempt == 1
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: azure-migration-recovery
    env:
      RECOVERY_ENABLED: ${{ vars.OCI_MIGRATION_RECOVERY_ENABLED || 'false' }}
      RECOVERY_ARM_UNTIL_EPOCH: ${{ vars.OCI_MIGRATION_RECOVERY_ARM_UNTIL_EPOCH || '0' }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_MIGRATION_RECOVERY_RESOURCE_GROUP }}
      AZURE_CLUSTER_NAME: ${{ vars.AZURE_MIGRATION_RECOVERY_CLUSTER_NAME }}
      AZURE_EXPECTED_CLUSTER_RESOURCE_ID_SHA256: ${{ vars.AZURE_MIGRATION_RECOVERY_CLUSTER_RESOURCE_ID_SHA256 }}
      AZURE_EXPECTED_CLUSTER_SERVER_SHA256: ${{ vars.AZURE_MIGRATION_RECOVERY_CLUSTER_SERVER_SHA256 }}
      AZURE_NAMESPACE: default
      MIGRATION_STALE_HEARTBEAT_SECONDS: ${{ vars.OCI_MIGRATION_STALE_HEARTBEAT_SECONDS || '3600' }}
      EXPECTED_SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || vars.OCI_MIGRATION_RECOVERY_SOURCE_SHA }}
      EXPECTED_OWNER_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_run_id || vars.OCI_MIGRATION_RECOVERY_RUN_ID }}
      EXPECTED_OWNER_RUN_ATTEMPT: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_run_attempt || vars.OCI_MIGRATION_RECOVERY_RUN_ATTEMPT }}
      EXPECTED_MIGRATION_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.migration_id || vars.OCI_MIGRATION_RECOVERY_MIGRATION_ID }}
      EXPECTED_FENCING_GENERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.fencing_generation || vars.OCI_MIGRATION_RECOVERY_FENCING_GENERATION }}

    steps:
      - name: Initialize isolated recovery paths
        run: |
          {
            echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/azure-recovery/.azure"
            echo "AZURE_KUBECONFIG=$RUNNER_TEMP/azure-recovery/kubeconfig"
            echo "RECOVERY_RESULT_FILE=$RUNNER_TEMP/azure-recovery/result.env"
            echo "RECOVERY_EVIDENCE_FILE=artifacts/azure-migration-recovery/evidence.env"
          } >> "$GITHUB_ENV"
          mkdir -p \
            "$RUNNER_TEMP/azure-recovery/.azure" \
            artifacts/azure-migration-recovery
          chmod 700 \
            "$RUNNER_TEMP/azure-recovery" \
            "$RUNNER_TEMP/azure-recovery/.azure"

      - name: Checkout exact migration journal SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.EXPECTED_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate recovery trigger and exact workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [ "$GITHUB_RUN_ATTEMPT" = "1" ]
          [ "$AZURE_CLUSTER_NAME" = "betstan-aks" ]
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_OWNER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_OWNER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_MIGRATION_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          [[ "$EXPECTED_FENCING_GENERATION" =~ ^[1-9][0-9]*$ ]]
          [ "$EXPECTED_MIGRATION_ID" = \
            "${EXPECTED_OWNER_RUN_ID}-${EXPECTED_OWNER_RUN_ATTEMPT}" ]
          git fetch --quiet origin master:refs/remotes/origin/master
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA" ]
          git merge-base --is-ancestor "$EXPECTED_SOURCE_SHA" origin/master
          workflow_id="$(
            ./infra/oci/scripts/bounded-command.py \
              --timeout-seconds 45 --attempts 2 \
              --classification github-workflow-read -- \
              gh api "repos/$REPOSITORY/actions/workflows/oci-migrate.yml" \
              --jq '.id'
          )"
          owner_run_json="$(
            ./infra/oci/scripts/bounded-command.py \
              --timeout-seconds 45 --attempts 2 \
              --classification github-run-read -- \
              gh api \
                "repos/$REPOSITORY/actions/runs/$EXPECTED_OWNER_RUN_ID/attempts/1"
          )"
          observed_workflow="$(jq -r '.workflow_id // empty' <<<"$owner_run_json")"
          path="$(jq -r '.path // empty' <<<"$owner_run_json")"
          owner_event="$(jq -r '.event // empty' <<<"$owner_run_json")"
          owner_head_sha="$(jq -r '.head_sha // empty' <<<"$owner_run_json")"
          owner_branch="$(jq -r '.head_branch // empty' <<<"$owner_run_json")"
          owner_repository="$(
            jq -r '.head_repository.full_name // empty' <<<"$owner_run_json"
          )"
          owner_status="$(jq -r '.status // empty' <<<"$owner_run_json")"
          owner_conclusion="$(jq -r '.conclusion // empty' <<<"$owner_run_json")"
          owner_attempt="$(jq -r '.run_attempt // empty' <<<"$owner_run_json")"
          [ "$observed_workflow" = "$workflow_id" ]
          [ "$path" = ".github/workflows/oci-migrate.yml" ]
          [ "$owner_event" = "workflow_dispatch" ]
          [ "$owner_head_sha" = "$EXPECTED_SOURCE_SHA" ]
          [ "$owner_branch" = "master" ]
          [ "$owner_repository" = "$REPOSITORY" ]
          [ "$owner_attempt" = "1" ]
          [ "$owner_attempt" = "$EXPECTED_OWNER_RUN_ATTEMPT" ]
          case "$GITHUB_EVENT_NAME" in
            schedule)
              [ "$RECOVERY_ENABLED" = "true" ]
              [[ "$RECOVERY_ARM_UNTIL_EPOCH" =~ ^[1-9][0-9]*$ ]]
              now_epoch="$(date -u +%s)"
              [ "$RECOVERY_ARM_UNTIL_EPOCH" -gt "$now_epoch" ]
              [ $((RECOVERY_ARM_UNTIL_EPOCH - now_epoch)) -le 86400 ]
              ;;
            workflow_dispatch)
              [ "$GITHUB_REF_NAME" = "master" ]
              [ "${{ inputs.confirmation }}" = \
                "STOP AZURE FOR EXACT MIGRATION" ]
              ;;
            workflow_run)
              [[ "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              [ "$owner_status" = "completed" ]
              [ "$owner_conclusion" != "success" ]
              [ "$UPSTREAM_RUN_ID" = "$EXPECTED_OWNER_RUN_ID" ]
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Login with dedicated Azure stop-only recovery identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        env:
          HOME: ${{ runner.temp }}/azure-recovery
        with:
          creds: ${{ secrets.AZURE_MIGRATION_RECOVERY_CREDENTIALS }}

      - name: Inspect exact existing AKS cluster without starting it
        id: cluster
        env:
          HOME: ${{ runner.temp }}/azure-recovery
        run: |
          set -euo pipefail
          mkdir -p artifacts/azure-migration-recovery
          [ "$AZURE_CLUSTER_NAME" = "betstan-aks" ]
          cluster_json="$(
            ./infra/oci/scripts/bounded-command.py \
              --timeout-seconds 60 --attempts 2 \
              --classification azure-cluster-read -- \
              az aks show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_CLUSTER_NAME" \
                --output json
          )"
          resource_id="$(jq -r '.id // empty' <<<"$cluster_json")"
          provisioning="$(jq -r '.provisioningState // empty' <<<"$cluster_json")"
          power="$(jq -r '.powerState.code // empty' <<<"$cluster_json")"
          actual_hash="$(printf '%s' "$resource_id" | sha256sum | awk '{print $1}')"
          [ "$actual_hash" = "$AZURE_EXPECTED_CLUSTER_RESOURCE_ID_SHA256" ]
          case "$power" in
            Running)
              [ "$provisioning" = "Succeeded" ]
              ;;
            Stopped|Deallocated)
              [ "$provisioning" = "Succeeded" ] ||
                [ "$provisioning" = "Failed" ]
              ;;
            *)
              exit 1
              ;;
          esac
          {
            echo "power=$power"
            echo "resource_id_hash=$actual_hash"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' \
            "inspection_timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            "cluster_name=betstan-aks" \
            "cluster_resource_id_sha256=$actual_hash" \
            "provisioning_state=$provisioning" \
            "initial_power_state=$power" \
            > artifacts/azure-migration-recovery/cluster.env

      - name: Configure isolated Azure kubeconfig only when already running
        if: steps.cluster.outputs.power == 'Running'
        uses: azure/aks-set-context@c7eb093e5a5d47caa333f64974d5fd1cd4bf069d # v4.0.3
        env:
          HOME: ${{ runner.temp }}/azure-recovery
          KUBECONFIG: ${{ env.AZURE_KUBECONFIG }}
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ env.AZURE_CLUSTER_NAME }}
          admin: false

      - name: Materialize isolated Azure recovery kubeconfig
        if: steps.cluster.outputs.power == 'Running'
        run: |
          set -euo pipefail
          [[ -n "${KUBE_CONFIG_PATH:-}" ]]
          [[ "$KUBE_CONFIG_PATH" == "$RUNNER_TEMP/"* ]]
          [[ "$AZURE_KUBECONFIG" == "$RUNNER_TEMP/"* ]]
          [ -f "$KUBE_CONFIG_PATH" ] && [ ! -L "$KUBE_CONFIG_PATH" ]
          install -m 600 -- "$KUBE_CONFIG_PATH" "$AZURE_KUBECONFIG"

      - name: Inspect runs and freeze Azure when recovery is conclusive
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_ACTUAL_CLUSTER_RESOURCE_ID_SHA256: ${{ steps.cluster.outputs.resource_id_hash }}
        run: |
          set -euo pipefail
          if [ "${{ steps.cluster.outputs.power }}" = "Stopped" ] ||
             [ "${{ steps.cluster.outputs.power }}" = "Deallocated" ]; then
            printf '%s\n' \
              "safe_to_stop=true" \
              "defer=false" \
              "reason=already-stopped" \
              "cancelled_run_id=" > "$RECOVERY_RESULT_FILE"
            cp "$RECOVERY_RESULT_FILE" "$RECOVERY_EVIDENCE_FILE"
          else
            set +e
            ./infra/oci/scripts/recover-azure-migration.sh
            recovery_status=$?
            set -e
          fi
          if [ ! -f "$RECOVERY_RESULT_FILE" ] ||
             [ -L "$RECOVERY_RESULT_FILE" ]; then
            echo "::error::Recovery helper produced no reviewed result file."
            exit "${recovery_status:-1}"
          fi
          # shellcheck disable=SC1090
          source "$RECOVERY_RESULT_FILE"
          {
            echo "safe_to_stop=$safe_to_stop"
            echo "defer=$defer"
          } >> "$GITHUB_OUTPUT"
          exit "${recovery_status:-0}"

      - name: Stop and deallocate only the exact existing AKS cluster
        if: always() && steps.recovery.outputs.safe_to_stop == 'true'
        env:
          HOME: ${{ runner.temp }}/azure-recovery
        run: |
          set -euo pipefail
          [ "$AZURE_CLUSTER_NAME" = "betstan-aks" ]
          before="$(
            ./infra/oci/scripts/bounded-command.py \
              --timeout-seconds 60 --attempts 2 \
              --classification azure-cluster-read -- \
              az aks show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_CLUSTER_NAME" \
                --output json
          )"
          resource_id="$(jq -r '.id // empty' <<<"$before")"
          actual_hash="$(printf '%s' "$resource_id" | sha256sum | awk '{print $1}')"
          [ "$actual_hash" = "$AZURE_EXPECTED_CLUSTER_RESOURCE_ID_SHA256" ]
          power="$(jq -r '.powerState.code // empty' <<<"$before")"
          provisioning="$(jq -r '.provisioningState // empty' <<<"$before")"
          case "$power" in
            Running|Starting)
              ./infra/oci/scripts/bounded-command.py \
                --timeout-seconds 1200 --attempts 1 \
                --classification azure-cluster-stop -- \
                az aks stop \
                  --resource-group "$AZURE_RESOURCE_GROUP" \
                  --name "$AZURE_CLUSTER_NAME" \
                  --only-show-errors
              ;;
            Stopped|Deallocated)
              [ "$provisioning" = "Succeeded" ] ||
                [ "$provisioning" = "Failed" ]
              ;;
            *)
              exit 1
              ;;
          esac
          after="$(
            ./infra/oci/scripts/bounded-command.py \
              --timeout-seconds 60 --attempts 3 \
              --classification azure-cluster-stop-read -- \
              az aks show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_CLUSTER_NAME" \
                --output json
          )"
          after_provisioning="$(jq -r '.provisioningState // empty' <<<"$after")"
          after_power="$(jq -r '.powerState.code // empty' <<<"$after")"
          [ "$after_provisioning" = "Succeeded" ] ||
            [ "$after_provisioning" = "Failed" ]
          [ "$after_power" = "Stopped" ] || [ "$after_power" = "Deallocated" ]
          printf '%s\n' \
            "stop_timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            "cluster_name=betstan-aks" \
            "cluster_resource_id_sha256=$actual_hash" \
            "provisioning_state=$after_provisioning" \
            "power_state=$after_power" \
            > artifacts/azure-migration-recovery/stop.env

      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azure-migration-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/azure-migration-recovery/cluster.env
            artifacts/azure-migration-recovery/evidence.env
            artifacts/azure-migration-recovery/stop.env
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove isolated recovery client state
        if: always()
        env:
          HOME: ${{ runner.temp }}/azure-recovery
        run: |
          az logout >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/azure-recovery"
