name: oci-migration-recovery
run-name: azure migration recovery ${{ github.event.workflow_run.id || github.run_id }}

on:
  workflow_run:
    workflows: ["oci-migrate"]
    types: [completed]
    branches: [master]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: azure-migration-recovery
  cancel-in-progress: true

jobs:
  recover:
    if: >-
      github.run_attempt == 1 &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'schedule' &&
          vars.OCI_MIGRATION_RECOVERY_ENABLED == 'true'
        ) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion != 'success' &&
          github.event.workflow_run.event == 'workflow_dispatch' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          github.event.workflow_run.run_attempt == 1
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: azure-migration-recovery
    env:
      RECOVERY_ENABLED: ${{ vars.OCI_MIGRATION_RECOVERY_ENABLED || 'false' }}
      RECOVERY_ARM_UNTIL_EPOCH: ${{ vars.OCI_MIGRATION_RECOVERY_ARM_UNTIL_EPOCH || '0' }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_MIGRATION_RECOVERY_RESOURCE_GROUP }}
      AZURE_CLUSTER_NAME: ${{ vars.AZURE_MIGRATION_RECOVERY_CLUSTER_NAME }}
      AZURE_EXPECTED_CLUSTER_RESOURCE_ID_SHA256: ${{ vars.AZURE_MIGRATION_RECOVERY_CLUSTER_RESOURCE_ID_SHA256 }}
      AZURE_EXPECTED_CLUSTER_SERVER_SHA256: ${{ vars.AZURE_MIGRATION_RECOVERY_CLUSTER_SERVER_SHA256 }}
      AZURE_NAMESPACE: default
      MIGRATION_STALE_HEARTBEAT_SECONDS: ${{ vars.OCI_MIGRATION_STALE_HEARTBEAT_SECONDS || '3600' }}

    steps:
      - name: Initialize isolated recovery paths
        run: |
          {
            echo "AZURE_CONFIG_DIR=$RUNNER_TEMP/azure-recovery/.azure"
            echo "AZURE_KUBECONFIG=$RUNNER_TEMP/azure-recovery/kubeconfig"
            echo "RECOVERY_RESULT_FILE=$RUNNER_TEMP/azure-recovery/result.env"
            echo "RECOVERY_EVIDENCE_FILE=artifacts/azure-migration-recovery/evidence.env"
          } >> "$GITHUB_ENV"
          mkdir -p \
            "$RUNNER_TEMP/azure-recovery/.azure" \
            artifacts/azure-migration-recovery
          chmod 700 \
            "$RUNNER_TEMP/azure-recovery" \
            "$RUNNER_TEMP/azure-recovery/.azure"

      - name: Checkout exact current master
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate recovery trigger and exact workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          [ "$GITHUB_RUN_ATTEMPT" = "1" ]
          [ "$AZURE_CLUSTER_NAME" = "betstan-aks" ]
          git fetch --quiet origin master:refs/remotes/origin/master
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)" ]
          case "$GITHUB_EVENT_NAME" in
            schedule)
              [ "$RECOVERY_ENABLED" = "true" ]
              [[ "$RECOVERY_ARM_UNTIL_EPOCH" =~ ^[1-9][0-9]*$ ]]
              now_epoch="$(date -u +%s)"
              [ "$RECOVERY_ARM_UNTIL_EPOCH" -gt "$now_epoch" ]
              [ $((RECOVERY_ARM_UNTIL_EPOCH - now_epoch)) -le 86400 ]
              ;;
            workflow_dispatch)
              [ "$GITHUB_REF_NAME" = "master" ]
              ;;
            workflow_run)
              [[ "$UPSTREAM_RUN_ID" =~ ^[1-9][0-9]*$ ]]
              workflow_id="$(
                ./infra/oci/scripts/bounded-command.py \
                  --timeout-seconds 45 --attempts 2 \
                  --classification github-workflow-read -- \
                  gh api "repos/$REPOSITORY/actions/workflows/oci-migrate.yml" \
                  --jq '.id'
              )"
              read -r observed_workflow path event branch repository status conclusion attempt <<<"$(
                ./infra/oci/scripts/bounded-command.py \
                  --timeout-seconds 45 --attempts 2 \
                  --classification github-run-read -- \
                  gh api "repos/$REPOSITORY/actions/runs/$UPSTREAM_RUN_ID/attempts/1" \
                  --jq '[.workflow_id,.path,.event,.head_branch,.head_repository.full_name,.status,.conclusion,.run_attempt] | @tsv'
              )"
              [ "$observed_workflow" = "$workflow_id" ]
              [ "$path" = ".github/workflows/oci-migrate.yml" ]
              [ "$event" = "workflow_dispatch" ]
              [ "$branch" = "master" ]
              [ "$repository" = "$REPOSITORY" ]
              [ "$status" = "completed" ]
              [ "$conclusion" != "success" ]
              [ "$attempt" = "1" ]
              ;;
            *)
              exit 1
              ;;
          esac

      - name: Login with dedicated Azure stop-only recovery identity
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        env:
          HOME: ${{ runner.temp }}/azure-recovery
        with:
          creds: ${{ secrets.AZURE_MIGRATION_RECOVERY_CREDENTIALS }}

      - name: Inspect exact existing AKS cluster without starting it
        id: cluster
        env:
          HOME: ${{ runner.temp }}/azure-recovery
        run: |
          set -euo pipefail
          [ "$AZURE_CLUSTER_NAME" = "betstan-aks" ]
          cluster_json="$(
            ./infra/oci/scripts/bounded-command.py \
              --timeout-seconds 60 --attempts 2 \
              --classification azure-cluster-read -- \
              az aks show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_CLUSTER_NAME" \
                --output json
          )"
          resource_id="$(jq -r '.id // empty' <<<"$cluster_json")"
          provisioning="$(jq -r '.provisioningState // empty' <<<"$cluster_json")"
          power="$(jq -r '.powerState.code // empty' <<<"$cluster_json")"
          actual_hash="$(printf '%s' "$resource_id" | sha256sum | awk '{print $1}')"
          [ "$actual_hash" = "$AZURE_EXPECTED_CLUSTER_RESOURCE_ID_SHA256" ]
          [ "$provisioning" = "Succeeded" ]
          [ "$power" = "Running" ] || [ "$power" = "Stopped" ]
          {
            echo "power=$power"
            echo "resource_id_hash=$actual_hash"
          } >> "$GITHUB_OUTPUT"
          printf '%s\n' \
            "inspection_timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            "cluster_name=betstan-aks" \
            "cluster_resource_id_sha256=$actual_hash" \
            "provisioning_state=$provisioning" \
            "initial_power_state=$power" \
            > artifacts/azure-migration-recovery/cluster.env

      - name: Configure isolated Azure kubeconfig only when already running
        if: steps.cluster.outputs.power == 'Running'
        uses: azure/aks-set-context@c7eb093e5a5d47caa333f64974d5fd1cd4bf069d # v4.0.3
        env:
          HOME: ${{ runner.temp }}/azure-recovery
          KUBECONFIG: ${{ env.AZURE_KUBECONFIG }}
        with:
          resource-group: ${{ env.AZURE_RESOURCE_GROUP }}
          cluster-name: ${{ env.AZURE_CLUSTER_NAME }}
          admin: false

      - name: Inspect runs and freeze Azure when recovery is conclusive
        id: recovery
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_ACTUAL_CLUSTER_RESOURCE_ID_SHA256: ${{ steps.cluster.outputs.resource_id_hash }}
        run: |
          set -euo pipefail
          if [ "${{ steps.cluster.outputs.power }}" = "Stopped" ]; then
            printf '%s\n' \
              "safe_to_stop=true" \
              "defer=false" \
              "reason=already-stopped" \
              "cancelled_run_id=" > "$RECOVERY_RESULT_FILE"
            cp "$RECOVERY_RESULT_FILE" "$RECOVERY_EVIDENCE_FILE"
          else
            set +e
            ./infra/oci/scripts/recover-azure-migration.sh
            recovery_status=$?
            set -e
          fi
          # shellcheck disable=SC1090
          source "$RECOVERY_RESULT_FILE"
          {
            echo "safe_to_stop=$safe_to_stop"
            echo "defer=$defer"
          } >> "$GITHUB_OUTPUT"
          exit "${recovery_status:-0}"

      - name: Stop and deallocate only the exact existing AKS cluster
        if: always() && steps.recovery.outputs.safe_to_stop == 'true'
        env:
          HOME: ${{ runner.temp }}/azure-recovery
        run: |
          set -euo pipefail
          [ "$AZURE_CLUSTER_NAME" = "betstan-aks" ]
          before="$(
            ./infra/oci/scripts/bounded-command.py \
              --timeout-seconds 60 --attempts 2 \
              --classification azure-cluster-read -- \
              az aks show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_CLUSTER_NAME" \
                --output json
          )"
          resource_id="$(jq -r '.id // empty' <<<"$before")"
          actual_hash="$(printf '%s' "$resource_id" | sha256sum | awk '{print $1}')"
          [ "$actual_hash" = "$AZURE_EXPECTED_CLUSTER_RESOURCE_ID_SHA256" ]
          power="$(jq -r '.powerState.code // empty' <<<"$before")"
          provisioning="$(jq -r '.provisioningState // empty' <<<"$before")"
          [ "$provisioning" = "Succeeded" ]
          if [ "$power" = "Running" ] || [ "$power" = "Starting" ]; then
            ./infra/oci/scripts/bounded-command.py \
              --timeout-seconds 1200 --attempts 1 \
              --classification azure-cluster-stop -- \
              az aks stop \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_CLUSTER_NAME" \
                --only-show-errors
          else
            [ "$power" = "Stopped" ]
          fi
          after="$(
            ./infra/oci/scripts/bounded-command.py \
              --timeout-seconds 60 --attempts 3 \
              --classification azure-cluster-stop-read -- \
              az aks show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$AZURE_CLUSTER_NAME" \
                --output json
          )"
          [ "$(jq -r '.provisioningState' <<<"$after")" = "Succeeded" ]
          [ "$(jq -r '.powerState.code' <<<"$after")" = "Stopped" ]
          printf '%s\n' \
            "stop_timestamp=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            "cluster_name=betstan-aks" \
            "cluster_resource_id_sha256=$actual_hash" \
            "provisioning_state=Succeeded" \
            "power_state=Stopped" \
            > artifacts/azure-migration-recovery/stop.env

      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: azure-migration-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/azure-migration-recovery/cluster.env
            artifacts/azure-migration-recovery/evidence.env
            artifacts/azure-migration-recovery/stop.env
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove isolated recovery client state
        if: always()
        env:
          HOME: ${{ runner.temp }}/azure-recovery
        run: |
          az logout >/dev/null 2>&1 || true
          rm -rf "$RUNNER_TEMP/azure-recovery"
