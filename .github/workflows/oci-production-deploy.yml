name: oci-production-deploy
run-name: oci-deploy ${{ inputs.approved_sha }}

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current master SHA approved for OCI deployment
        required: true
        type: string
      build_run_id:
        description: Successful first-attempt oci-production-build run ID
        required: true
        type: string
      infrastructure_run_id:
        description: Successful first-attempt oci-infrastructure run ID
        required: true
        type: string
      data_run_id:
        description: Successful first-attempt final oci-live-data-rollout run ID
        required: true
        type: string
      failed_deploy_run_id:
        description: Failed first-attempt deploy to reapply after a queue-contract-only validation failure, or 0
        required: true
        default: "0"
        type: string
      baseline_recovery_run_id:
        description: Exact trusted recovery run bound through the data chain, or 0
        required: true
        default: "0"
        type: string
      baseline_recovery_source_sha:
        description: Historical source SHA restored by the trusted recovery, or none
        required: true
        default: none
        type: string
      confirmation:
        description: Type DEPLOY OCI EXACT SHA or RECOVER OCI FAILED DEPLOYMENT
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: oci-control-plane
  cancel-in-progress: false

jobs:
  deploy:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      public_url: ${{ steps.provenance.outputs.public_url }}
      redirect_url: ${{ steps.provenance.outputs.redirect_url }}
      diagnostic_url: ${{ steps.provenance.outputs.diagnostic_url }}
    environment:
      name: oci-production
    env:
      SOURCE_SHA: ${{ inputs.approved_sha }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      INFRASTRUCTURE_RUN_ID: ${{ inputs.infrastructure_run_id }}
      DATA_RUN_ID: ${{ inputs.data_run_id }}
      FAILED_DEPLOY_RUN_ID: ${{ inputs.failed_deploy_run_id }}
      BASELINE_RECOVERY_RUN_ID: ${{ inputs.baseline_recovery_run_id }}
      BASELINE_RECOVERY_SOURCE_SHA: ${{ inputs.baseline_recovery_source_sha }}
      CONFIRMATION: ${{ inputs.confirmation }}
      OCI_RUNTIME_MODE: ${{ vars.OCI_RUNTIME_MODE }}
      OCI_CLI_VERSION: "3.90.0"
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_CI_USER_OCID: ${{ vars.OCI_CI_USER_OCID }}
      OCI_CI_KEY_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_AVAILABILITY_DOMAIN: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
      OCI_K8S_NAMESPACE: ${{ vars.OCI_K8S_NAMESPACE }}
      OCI_IMAGE_PREFIX: ${{ vars.OCI_IMAGE_PREFIX }}
      OCI_K3S_IMAGE_OCID: ${{ vars.OCI_K3S_IMAGE_OCID }}
      OCI_K3S_NODE_NAME: ${{ vars.OCI_K3S_NODE_NAME || 'betstan-k3s' }}
      OCI_BASTION_DEFAULT_CLIENT_CIDR: 192.0.2.1/32
      APPLICATION_REGISTRY_PROVIDER: ghcr
      APPLICATION_REGISTRY_HOST: ghcr.io
      APPLICATION_REGISTRY_REPOSITORY: vasilyevstan/betstan-images
      APPLICATION_REGISTRY_TAG_PREFIX: arm64
      APPLICATION_REGISTRY_TAG_SCHEMA: v1
      APPLICATION_REGISTRY_EVIDENCE_FILE: artifacts/infrastructure/application-registry-evidence.env
      OCI_REGISTRY_MAX_BYTES: ${{ vars.OCI_REGISTRY_MAX_BYTES || '500000000' }}
      OCI_BOOT_VOLUME_GB: ${{ vars.OCI_BOOT_VOLUME_GB }}
      OCI_MONGO_VOLUME_GB: ${{ vars.OCI_MONGO_VOLUME_GB }}
      OCI_A1_OCPUS: ${{ vars.OCI_A1_OCPUS }}
      OCI_A1_MEMORY_GB: ${{ vars.OCI_A1_MEMORY_GB }}
      OCI_LB_MIN_MBPS: ${{ vars.OCI_LB_MIN_MBPS }}
      OCI_LB_MAX_MBPS: ${{ vars.OCI_LB_MAX_MBPS }}
      OCI_EXPECTED_MONTHLY_COST: ${{ vars.OCI_EXPECTED_MONTHLY_COST }}
      OCI_CERT_EMAIL: ${{ vars.OCI_CERT_EMAIL }}
      OCI_CANONICAL_HOST: ${{ vars.OCI_CANONICAL_HOST || 'betstan.xyz' }}
      OCI_REDIRECT_HOST: ${{ vars.OCI_REDIRECT_HOST || 'www.betstan.xyz' }}
      OCI_MEMORY_MAX_PERCENT: ${{ vars.OCI_MEMORY_MAX_PERCENT }}
      OCI_DISK_MAX_PERCENT: ${{ vars.OCI_DISK_MAX_PERCENT }}
      OCI_CPU_MAX_PERCENT: "90"
      SHARED_MONGO_DEPLOY_LOCK_LEASE_SECONDS: "10800"
      OCI_HEALTH_MAX_ATTEMPTS: ${{ vars.OCI_HEALTH_MAX_ATTEMPTS }}
      OCI_HEALTH_SLEEP_SECONDS: ${{ vars.OCI_HEALTH_SLEEP_SECONDS }}

    steps:
      - name: Initialize isolated OCI paths
        run: |
          {
            echo "HOME=$RUNNER_TEMP/oci-home"
            echo "KUBECONFIG=$RUNNER_TEMP/oci-home/.kube/config"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/oci-home/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/oci-home/.kube"
          chmod 700 "$RUNNER_TEMP/oci-home" "$RUNNER_TEMP/oci-home/.kube"

      - name: Checkout approved master commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0

      - name: Validate exact SHA and trusted upstream runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "master" ]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$INFRASTRUCTURE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$DATA_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$FAILED_DEPLOY_RUN_ID" == "0" ||
             "$FAILED_DEPLOY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$BASELINE_RECOVERY_RUN_ID" == "0" ||
             "$BASELINE_RECOVERY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          if [ "$BASELINE_RECOVERY_RUN_ID" = "0" ]; then
            [ "$BASELINE_RECOVERY_SOURCE_SHA" = "none" ]
          else
            [[ "$BASELINE_RECOVERY_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          fi
          [ "$GITHUB_RUN_ATTEMPT" = "1" ]
          git fetch --quiet origin master:refs/remotes/origin/master
          [ "$GITHUB_SHA" = "$(git rev-parse origin/master)" ]
          if [ "$FAILED_DEPLOY_RUN_ID" = "0" ]; then
            [ "$CONFIRMATION" = "DEPLOY OCI EXACT SHA" ]
            [ "$SOURCE_SHA" = "$GITHUB_SHA" ]
          else
            [ "$CONFIRMATION" = "RECOVER OCI FAILED DEPLOYMENT" ]
            git cat-file -e "${SOURCE_SHA}^{commit}"
            git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"

            mapfile -t recovery_changes < <(
              git diff --name-only "$SOURCE_SHA" "$GITHUB_SHA"
            )
            [ "${#recovery_changes[@]}" = "5" ]
            printf '%s\n' "${recovery_changes[@]}" | sort -u | cmp -s - <(
              printf '%s\n' \
                .github/workflows/oci-production-deploy.yml \
                infra/oci/agents/health-contract.py \
                infra/oci/agents/test-health-contract-stan.sh \
                infra/oci/tests/test-contract.sh \
                infra/oci/tests/fixtures/health/healthy.json |
                sort
            )

            deploy_workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/oci-production-deploy.yml" \
                --jq '.id'
            )"
            read -r failed_workflow_id failed_path failed_event \
              failed_head_sha failed_head_branch failed_repository failed_status \
              failed_conclusion failed_attempt failed_title <<<"$(
                gh api \
                  "repos/$REPOSITORY/actions/runs/$FAILED_DEPLOY_RUN_ID/attempts/1" \
                  --jq '[.workflow_id,.path,.event,.head_sha,.head_branch,.head_repository.full_name,.status,.conclusion,.run_attempt,.display_title] | @tsv'
              )"
            [ "$failed_workflow_id" = "$deploy_workflow_id" ]
            [ "$failed_path" = ".github/workflows/oci-production-deploy.yml" ]
            [ "$failed_event" = "workflow_dispatch" ]
            [ "$failed_head_sha" = "$SOURCE_SHA" ]
            [ "$failed_head_branch" = "master" ]
            [ "$failed_repository" = "$REPOSITORY" ]
            [ "$failed_status" = "completed" ]
            [ "$failed_conclusion" = "failure" ]
            [ "$failed_attempt" = "1" ]
            [ "$failed_title" = "oci-deploy $SOURCE_SHA" ]

            failed_jobs="$(
              gh api \
                "repos/$REPOSITORY/actions/runs/$FAILED_DEPLOY_RUN_ID/jobs?filter=latest&per_page=100"
            )"
            jq -e '
              [.jobs[] | select(.name == "deploy")] as $deploy_jobs |
              ($deploy_jobs | length) == 1 and
              $deploy_jobs[0].conclusion == "failure" and
              ([
                $deploy_jobs[0].steps[] |
                select(
                  .name == ("Deploy immutable images " + "sequentially") and
                  .conclusion == "success"
                )
              ] | length) == 1 and
              ([
                $deploy_jobs[0].steps[] |
                select(
                  .name == ("Bind schema evidence to deployment " + "provenance") and
                  .conclusion == "success"
                )
              ] | length) == 1 and
              ([
                $deploy_jobs[0].steps[] |
                select(
                  .name == ("Run protected OCI cluster " + "validation loop") and
                  .conclusion == "failure"
                )
              ] | length) == 1 and
              ([
                $deploy_jobs[0].steps[] |
                select(
                  .name == ("Release transferred lock after protected " + "validation") and
                  .conclusion == "skipped"
                )
              ] | length) == 1 and
              ([
                $deploy_jobs[0].steps[] |
                select(
                  .name == ("Release live data maintenance " + "fence") and
                  .conclusion == "skipped"
                )
              ] | length) == 1 and
              ([
                $deploy_jobs[0].steps[] |
                select(
                  .name == ("Re-enter maintenance after an incomplete " + "deployment") and
                  .conclusion == "success"
                )
              ] | length) == 1
            ' <<<"$failed_jobs" >/dev/null

            diagnostics_name="oci-deploy-diagnostics-${FAILED_DEPLOY_RUN_ID}-1"
            diagnostics_count="$(
              gh api \
                "repos/$REPOSITORY/actions/runs/$FAILED_DEPLOY_RUN_ID/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(.name == \"$diagnostics_name\" and .expired == false)] | length"
            )"
            [ "$diagnostics_count" = "1" ]
          fi

          build_workflow_id="$(gh api "repos/$REPOSITORY/actions/workflows/oci-production-build.yml" --jq '.id')"
          read -r workflow_id workflow_path event head_sha head_branch repository status conclusion attempt <<<"$(
            gh api "repos/$REPOSITORY/actions/runs/$BUILD_RUN_ID/attempts/1" \
              --jq '[.workflow_id,.path,.event,.head_sha,.head_branch,.head_repository.full_name,.status,.conclusion,.run_attempt] | @tsv'
          )"
          [ "$workflow_id" = "$build_workflow_id" ]
          [ "$workflow_path" = ".github/workflows/oci-production-build.yml" ]
          [ "$event" = "workflow_run" ]
          [ "$head_sha" = "$SOURCE_SHA" ]
          [ "$head_branch" = "master" ]
          [ "$repository" = "$REPOSITORY" ]
          [ "$status" = "completed" ] && [ "$conclusion" = "success" ] && [ "$attempt" = "1" ]

          infra_workflow_id="$(gh api "repos/$REPOSITORY/actions/workflows/oci-infrastructure.yml" --jq '.id')"
          read -r workflow_id workflow_path event head_sha head_branch repository status conclusion attempt <<<"$(
            gh api "repos/$REPOSITORY/actions/runs/$INFRASTRUCTURE_RUN_ID/attempts/1" \
              --jq '[.workflow_id,.path,.event,.head_sha,.head_branch,.head_repository.full_name,.status,.conclusion,.run_attempt] | @tsv'
          )"
          [ "$workflow_id" = "$infra_workflow_id" ]
          [ "$workflow_path" = ".github/workflows/oci-infrastructure.yml" ]
          [ "$event" = "workflow_dispatch" ]
          [ "$head_sha" = "$SOURCE_SHA" ]
          [ "$head_branch" = "master" ]
          [ "$repository" = "$REPOSITORY" ]
          [ "$status" = "completed" ] && [ "$conclusion" = "success" ] && [ "$attempt" = "1" ]

          data_workflow_id="$(gh api "repos/$REPOSITORY/actions/workflows/oci-live-data-rollout.yml" --jq '.id')"
          read -r workflow_id workflow_path event head_sha head_branch repository status conclusion attempt <<<"$(
            gh api "repos/$REPOSITORY/actions/runs/$DATA_RUN_ID/attempts/1" \
              --jq '[.workflow_id,.path,.event,.head_sha,.head_branch,.head_repository.full_name,.status,.conclusion,.run_attempt] | @tsv'
          )"
          [ "$workflow_id" = "$data_workflow_id" ]
          [ "$workflow_path" = ".github/workflows/oci-live-data-rollout.yml" ]
          [ "$event" = "workflow_dispatch" ]
          [ "$head_sha" = "$SOURCE_SHA" ]
          [ "$head_branch" = "master" ]
          [ "$repository" = "$REPOSITORY" ]
          [ "$status" = "completed" ] && [ "$conclusion" = "success" ] && [ "$attempt" = "1" ]

          if [ "$BASELINE_RECOVERY_RUN_ID" != "0" ]; then
            cache_recovery_workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/oci-ghcr-cache-recovery.yml" --jq '.id'
            )"
            partial_recovery_workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/oci-production-rollback.yml" --jq '.id'
            )"
            read -r workflow_id workflow_path event recovery_control_sha head_branch repository status conclusion attempt display_title <<<"$(
              gh api "repos/$REPOSITORY/actions/runs/$BASELINE_RECOVERY_RUN_ID/attempts/1" \
                --jq '[.workflow_id,.path,.event,.head_sha,.head_branch,.head_repository.full_name,.status,.conclusion,.run_attempt,.display_title] | @tsv'
            )"
            [ "$event" = "workflow_dispatch" ]
            [[ "$recovery_control_sha" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "${recovery_control_sha}^{commit}"
            git merge-base --is-ancestor "$recovery_control_sha" "$SOURCE_SHA"
            [ "$head_branch" = "master" ]
            [ "$repository" = "$REPOSITORY" ]
            [ "$status" = "completed" ] && [ "$conclusion" = "success" ] && [ "$attempt" = "1" ]
            if [ "$workflow_id" = "$cache_recovery_workflow_id" ] &&
               [ "$workflow_path" = ".github/workflows/oci-ghcr-cache-recovery.yml" ]; then
              [ "$display_title" = "oci-ghcr-cache-recovery $BASELINE_RECOVERY_SOURCE_SHA" ]
              recovery_artifact_name="ghcr-cache-recovery-${BASELINE_RECOVERY_SOURCE_SHA}-${BASELINE_RECOVERY_RUN_ID}-1"
            elif [ "$workflow_id" = "$partial_recovery_workflow_id" ] &&
                 [ "$workflow_path" = ".github/workflows/oci-production-rollback.yml" ]; then
              [[ "$display_title" =~ ^oci-rollback\ [0-9a-f]{40}$ ]]
              recovery_artifact_name="oci-production-rollback-${BASELINE_RECOVERY_RUN_ID}-1"
            else
              echo "::error::Baseline recovery run is not a trusted recovery workflow"
              exit 1
            fi
            recovery_artifact_count="$(
              gh api "repos/$REPOSITORY/actions/runs/$BASELINE_RECOVERY_RUN_ID/artifacts?per_page=100" \
                --jq "[.artifacts[] | select(.name == \"$recovery_artifact_name\" and .expired == false)] | length"
            )"
            [ "$recovery_artifact_count" = "1" ]
          fi

          artifact_name="oci-live-data-rollout-${DATA_RUN_ID}-1"
          artifact_count="$(
            gh api "repos/$REPOSITORY/actions/runs/$DATA_RUN_ID/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"$artifact_name\" and .expired == false)] | length"
          )"
          [ "$artifact_count" = "1" ]
          baseline_artifact_name="oci-live-data-baselines-${DATA_RUN_ID}-1"
          baseline_artifact_count="$(
            gh api "repos/$REPOSITORY/actions/runs/$DATA_RUN_ID/artifacts?per_page=100" \
              --jq "[.artifacts[] | select(.name == \"$baseline_artifact_name\" and .expired == false)] | length"
          )"
          [ "$baseline_artifact_count" = "1" ]
          mkdir -p \
            "$HOME/.kube" \
            artifacts/build \
            artifacts/data \
            artifacts/data-baselines \
            artifacts/infrastructure \
            artifacts/oci-baseline \
            artifacts/oci-deploy
          chmod 700 "$HOME" "$HOME/.kube"

      - name: Load reviewed queue contract for failed validation recovery
        if: inputs.failed_deploy_run_id != '0'
        run: |
          set -euo pipefail
          for file in \
            infra/oci/agents/health-contract.py \
            infra/oci/agents/test-health-contract-stan.sh \
            infra/oci/tests/fixtures/health/healthy.json; do
            git show "${GITHUB_SHA}:${file}" > "${file}.recovery"
            mv "${file}.recovery" "$file"
          done
          ./infra/oci/agents/test-health-contract-stan.sh

      - name: Download exact OCI image provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oci-image-provenance-${{ inputs.approved_sha }}-${{ inputs.build_run_id }}-1
          path: artifacts/build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}

      - name: Download exact OCI infrastructure provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oci-infrastructure-provenance-${{ inputs.infrastructure_run_id }}-1
          path: artifacts/infrastructure
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.infrastructure_run_id }}

      - name: Download exact live data readiness evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oci-live-data-rollout-${{ inputs.data_run_id }}-1
          path: artifacts/data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.data_run_id }}

      - name: Download exact pre-mutation rollback baseline
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oci-live-data-baselines-${{ inputs.data_run_id }}-1
          path: artifacts/data-baselines
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.data_run_id }}

      - name: Verify immutable image and infrastructure provenance
        id: provenance
        run: |
          set -euo pipefail
          PROVENANCE_DIR=artifacts/build \
          SOURCE_SHA="$SOURCE_SHA" \
          EXPECTED_BUILD_RUN_ID="$BUILD_RUN_ID" \
          EXPECTED_BUILD_RUN_ATTEMPT=1 \
          OUTPUT_FILE=artifacts/oci-deploy/images.tsv \
          VERIFY_REMOTE=0 BOOT_IMAGES=0 \
            ./infra/oci/scripts/verify-images.sh
          source artifacts/infrastructure/provenance.env
          [ "$source_sha" = "$SOURCE_SHA" ]
          [ "$infrastructure_run_id" = "$INFRASTRUCTURE_RUN_ID" ]
          [ "$infrastructure_run_attempt" = "1" ]
          [ "$compartment_ocid" = "$OCI_COMPARTMENT_OCID" ]
          [ "$namespace" = "$OCI_K8S_NAMESPACE" ]
          [ "$runtime_mode" = "$OCI_RUNTIME_MODE" ]
          [ "$infrastructure_finalized" = "true" ]
          [ "$application_registry_provider" = "ghcr" ]
          [ "$application_registry_host" = "ghcr.io" ]
          [ "$application_registry_repository" = "ghcr.io/vasilyevstan/betstan-images" ]
          [ "$application_registry_public_anonymous" = "true" ]
          [ "$ocir_application_repository_absent" = "true" ]
          [ "$public_host" = "$OCI_CANONICAL_HOST" ]
          [ "$canonical_host" = "$OCI_CANONICAL_HOST" ]
          [ "$redirect_host" = "$OCI_REDIRECT_HOST" ]
          [ "$diagnostic_host" = "${ingress_ipv4}.nip.io" ]
          EVIDENCE_DIR=artifacts/data \
          EXPECTED_SOURCE_SHA="$SOURCE_SHA" \
          EXPECTED_BUILD_RUN_ID="$BUILD_RUN_ID" \
          EXPECTED_INFRASTRUCTURE_RUN_ID="$INFRASTRUCTURE_RUN_ID" \
          EXPECTED_PHASE=apply-slip-index \
          EXPECTED_RUN_ID="$DATA_RUN_ID" \
          EXPECTED_RUN_ATTEMPT=1 \
          EXPECTED_BASELINE_RECOVERY_RUN_ID="$BASELINE_RECOVERY_RUN_ID" \
          EXPECTED_BASELINE_RECOVERY_SOURCE_SHA="$BASELINE_RECOVERY_SOURCE_SHA" \
            ./infra/oci/scripts/verify-live-betting-data-evidence-stan.sh
          mapfile -t baseline_manifests < <(
            find artifacts/data-baselines \
              -type f \
              -path '*/oci-data-baseline-before/SHA256SUMS'
          )
          [ "${#baseline_manifests[@]}" = "1" ]
          baseline_dir="$(dirname "${baseline_manifests[0]}")"
          [ -z "$(find "$baseline_dir" -type l -print -quit)" ]
          baseline_sha256="$(sha256sum "$baseline_dir/SHA256SUMS" | awk '{print $1}')"
          expected_baseline_sha256="$(
            awk -F= '$1 == "baseline_sha256" {print $2}' artifacts/data/schema.env
          )"
          [ "$baseline_sha256" = "$expected_baseline_sha256" ]
          (
            cd "$baseline_dir"
            sha256sum --quiet --check SHA256SUMS
          )
          cp -a "$baseline_dir/." artifacts/oci-baseline/
          if [ "$runtime_mode" = "oke" ]; then
            echo "::add-mask::$cluster_ocid"
            echo "::add-mask::$endpoint_nsg_ocid"
            printf 'cluster_ocid=%s\n' "$cluster_ocid" >> "$GITHUB_OUTPUT"
            printf 'endpoint_nsg_ocid=%s\n' "$endpoint_nsg_ocid" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$instance_ocid"
            echo "::add-mask::$bastion_ocid"
            printf 'instance_ocid=%s\n' "$instance_ocid" >> "$GITHUB_OUTPUT"
          fi
          printf 'public_url=https://%s\n' "$public_host" >> "$GITHUB_OUTPUT"
          printf 'redirect_url=https://%s\n' "$redirect_host" >> "$GITHUB_OUTPUT"
          printf 'diagnostic_url=https://%s\n' "$diagnostic_host" >> "$GITHUB_OUTPUT"

      - name: Install pinned OCI CLI
        run: ./infra/oci/scripts/install-cli.sh

      - name: Verify OKE identity
        if: env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_CLUSTER_OCID: ${{ steps.provenance.outputs.cluster_ocid }}
        run: |
          set -euo pipefail
          oci ce cluster get \
            --cluster-id "$OCI_CLUSTER_OCID" \
            --query 'data.{type:type,state:"lifecycle-state"}' \
            >/dev/null

      - name: Verify k3s identity
        if: env.OCI_RUNTIME_MODE == 'k3s'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_INSTANCE_OCID: ${{ steps.provenance.outputs.instance_ocid }}
        run: |
          set -euo pipefail
          oci compute instance get \
            --instance-id "$OCI_INSTANCE_OCID" \
            --query 'data.{shape:shape,state:"lifecycle-state"}' \
            >/dev/null

      - name: Reconcile expired and authorize current runner IPv4
        if: env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_ENDPOINT_NSG_OCID: ${{ steps.provenance.outputs.endpoint_nsg_ocid }}
          RULE_STATE_FILE: artifacts/oci-deploy/runner-rule.env
        run: |
          set -euo pipefail
          ./infra/oci/scripts/authorize-github-runner.sh cleanup-stale
          RUNNER_PUBLIC_IPV4="$(curl --fail --silent --show-error --max-time 15 https://api.ipify.org)"
          export RUNNER_PUBLIC_IPV4
          ./infra/oci/scripts/authorize-github-runner.sh authorize

      - name: Configure kubectl from exact cluster OCID
        if: env.OCI_RUNTIME_MODE == 'oke'
        uses: oracle-actions/configure-kubectl-oke@77a733d79446dabe7bf0e58eb56197d33ce4dc58 # v1.5.0
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
        with:
          cluster: ${{ steps.provenance.outputs.cluster_ocid }}

      - name: Open ephemeral OCI Bastion access to k3s
        if: env.OCI_RUNTIME_MODE == 'k3s'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_K3S_SSH_PRIVATE_KEY: ${{ secrets.OCI_K3S_SSH_PRIVATE_KEY }}
          INFRA_PROVENANCE_FILE: artifacts/infrastructure/provenance.env
          SESSION_STATE_FILE: artifacts/oci-deploy/k3s-access.env
          WORK_DIR: ${{ runner.temp }}/betstan-k3s-access
        run: |
          set -euo pipefail
          RUNNER_PUBLIC_IPV4="$(
            curl --fail --silent --show-error --max-time 15 https://api.ipify.org
          )"
          export RUNNER_PUBLIC_IPV4
          ./infra/oci/scripts/configure-k3s-access.sh open

      - name: Verify transferred database lock and maintenance fence
        id: handoff
        env:
          STATE_FILE: artifacts/oci-deploy/unused-maintenance-state.tsv
        run: |
          set -euo pipefail
          ./infra/oci/scripts/live-data-maintenance-stan.sh verify-held
          if ! NAMESPACE="$OCI_K8S_NAMESPACE" \
            LOCK_TOKEN="live-data-${DATA_RUN_ID}-1" \
            OPERATION_ID="live-data-apply-slip-index" \
            SOURCE_SHA="$SOURCE_SHA" \
              ./infra/oci/scripts/shared-mongo-operation-lock-stan.sh verify; then
            NAMESPACE="$OCI_K8S_NAMESPACE" \
            LOCK_TOKEN="live-data-${DATA_RUN_ID}-1" \
            OPERATION_ID="live-data-apply-slip-index" \
            LOCK_LEASE_SECONDS="$SHARED_MONGO_DEPLOY_LOCK_LEASE_SECONDS" \
            SOURCE_SHA="$SOURCE_SHA" \
              ./infra/oci/scripts/shared-mongo-operation-lock-stan.sh acquire
          else
            NAMESPACE="$OCI_K8S_NAMESPACE" \
            LOCK_TOKEN="live-data-${DATA_RUN_ID}-1" \
            OPERATION_ID="live-data-apply-slip-index" \
            LOCK_LEASE_SECONDS="$SHARED_MONGO_DEPLOY_LOCK_LEASE_SECONDS" \
            SOURCE_SHA="$SOURCE_SHA" \
              ./infra/oci/scripts/shared-mongo-operation-lock-stan.sh renew
          fi

      - name: Validate executable pre-deploy rollback baseline
        run: |
          set -euo pipefail
          expected_source_sha=
          expected_recovery_run_id=
          if [ "$BASELINE_RECOVERY_RUN_ID" != "0" ]; then
            expected_source_sha="$BASELINE_RECOVERY_SOURCE_SHA"
            expected_recovery_run_id="$BASELINE_RECOVERY_RUN_ID"
          fi
          BASELINE_DIR=artifacts/oci-baseline \
          EXPECTED_SOURCE_SHA="$expected_source_sha" \
          EXPECTED_NAMESPACE="$OCI_K8S_NAMESPACE" \
          EXPECTED_RECOVERY_RUN_ID="$expected_recovery_run_id" \
          REQUIRE_CURRENT_DEPLOY_PROVENANCE=true \
            ./infra/oci/scripts/validate-rollback-baseline-stan.sh

      - name: Upload protected OCI rollback baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-production-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oci-baseline
          if-no-files-found: error
          retention-days: 30

      - name: Deploy immutable images sequentially
        id: apply
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_JWT_KEY: ${{ secrets.OCI_JWT_KEY }}
          IMAGE_PROVENANCE_FILE: artifacts/oci-deploy/images.tsv
          INFRA_PROVENANCE_FILE: artifacts/infrastructure/provenance.env
          OUTPUT_DIR: artifacts/oci-deploy
        run: ./infra/oci/scripts/deploy.sh

      - name: Bind schema evidence to deployment provenance
        id: bind
        run: |
          set -euo pipefail
          {
            printf 'data_run_id=%s\n' "$DATA_RUN_ID"
            printf 'data_run_attempt=1\n'
            printf 'data_evidence_sha256=%s\n' "$(sha256sum artifacts/data/SHA256SUMS | awk '{print $1}')"
            printf 'infrastructure_run_id=%s\n' "$INFRASTRUCTURE_RUN_ID"
            printf 'infrastructure_run_attempt=1\n'
            printf 'infrastructure_provenance_sha256=%s\n' "$(
              sha256sum artifacts/infrastructure/provenance.env |
                awk '{print $1}'
            )"
          } >> artifacts/oci-deploy/provenance.txt
          cp artifacts/data/schema.env artifacts/oci-deploy/live-schema.env

      - name: Run protected OCI cluster validation loop
        id: health
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          INFRA_PROVENANCE_FILE: artifacts/infrastructure/provenance.env
          IMAGE_PROVENANCE_FILE: artifacts/oci-deploy/images.tsv
          OCI_RABBITMQ_BASELINE_FILE: artifacts/oci-deploy/rabbitmq-baseline.txt
          OCI_EXPECTED_SOURCE_SHA: ${{ env.SOURCE_SHA }}
          OCI_PUBLIC_URL: ${{ steps.provenance.outputs.public_url }}
          OCI_REDIRECT_URL: ${{ steps.provenance.outputs.redirect_url }}
          OCI_DIAGNOSTIC_URL: ${{ steps.provenance.outputs.diagnostic_url }}
          OCI_PUBLIC_CHECKS_ALREADY_PASSED: "1"
          OCI_E2E_ALREADY_PASSED: "1"
          OCI_EXPECT_HTTP_MUTATION_FENCE: "1"
          EXPECTED_OPERATION_LOCK_HOLDER: live-data-${{ inputs.data_run_id }}-1
          EXPECTED_OPERATION_LOCK_ID: live-data-apply-slip-index
          EXPECTED_OPERATION_LOCK_SOURCE_SHA: ${{ inputs.approved_sha }}
          LIVE_BETTING_READINESS_MODE: dark
          LIVE_READINESS_REQUEST_TIMEOUT: "15"
          LIVE_READINESS_SSE_TIMEOUT: "20"
          OUTPUT_DIR: artifacts/oci-deploy-validation
        run: ./infra/oci/agents/deploy-validation-loop-stan.sh

      - name: Release transferred lock after protected validation
        id: release_lock
        if: steps.health.outcome == 'success'
        run: |
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          LOCK_TOKEN="live-data-${DATA_RUN_ID}-1" \
          OPERATION_ID="live-data-apply-slip-index" \
          SOURCE_SHA="$SOURCE_SHA" \
            ./infra/oci/scripts/shared-mongo-operation-lock-stan.sh release
          NAMESPACE="$OCI_K8S_NAMESPACE" \
          LOCK_TOKEN="live-data-${DATA_RUN_ID}-1" \
          OPERATION_ID="live-data-apply-slip-index" \
          SOURCE_SHA="$SOURCE_SHA" \
            ./infra/oci/scripts/shared-mongo-operation-lock-stan.sh verify-released

      - name: Release live data maintenance fence
        id: release_runtime
        if: steps.release_lock.outcome == 'success'
        env:
          STATE_FILE: artifacts/oci-deploy/unused-maintenance-state.tsv
        run: ./infra/oci/scripts/live-data-maintenance-stan.sh release

      - name: Re-enter maintenance after an incomplete deployment
        id: rehold
        if: >-
          always() &&
          steps.handoff.outcome == 'success' &&
          steps.release_runtime.outcome != 'success'
        env:
          STATE_FILE: artifacts/oci-deploy/unused-maintenance-state.tsv
        run: |
          set -euo pipefail
          ./infra/oci/scripts/live-data-maintenance-stan.sh hold
          if ! NAMESPACE="$OCI_K8S_NAMESPACE" \
            LOCK_TOKEN="live-data-${DATA_RUN_ID}-1" \
            OPERATION_ID="live-data-apply-slip-index" \
            SOURCE_SHA="$SOURCE_SHA" \
              ./infra/oci/scripts/shared-mongo-operation-lock-stan.sh verify; then
            NAMESPACE="$OCI_K8S_NAMESPACE" \
            LOCK_TOKEN="live-data-${DATA_RUN_ID}-1" \
            OPERATION_ID="live-data-apply-slip-index" \
            LOCK_LEASE_SECONDS="$SHARED_MONGO_DEPLOY_LOCK_LEASE_SECONDS" \
            SOURCE_SHA="$SOURCE_SHA" \
              ./infra/oci/scripts/shared-mongo-operation-lock-stan.sh acquire
          else
            NAMESPACE="$OCI_K8S_NAMESPACE" \
            LOCK_TOKEN="live-data-${DATA_RUN_ID}-1" \
            OPERATION_ID="live-data-apply-slip-index" \
            LOCK_LEASE_SECONDS="$SHARED_MONGO_DEPLOY_LOCK_LEASE_SECONDS" \
            SOURCE_SHA="$SOURCE_SHA" \
              ./infra/oci/scripts/shared-mongo-operation-lock-stan.sh renew
          fi

      - name: Upload sanitized live readiness evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-live-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oci-deploy-validation/live-readiness
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture sanitized deployment diagnostics
        if: >-
          always() &&
          (steps.apply.outcome == 'failure' ||
            steps.bind.outcome == 'failure' ||
            steps.release_lock.outcome == 'failure' ||
            steps.health.outcome == 'failure' ||
            steps.release_runtime.outcome == 'failure' ||
            steps.rehold.outcome == 'failure')
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          INFRA_PROVENANCE_FILE: artifacts/infrastructure/provenance.env
        run: |
          mkdir -p artifacts/oci-deploy-validation/final
          ./infra/oci/agents/service-ops-stan.sh \
            > artifacts/oci-deploy-validation/final/service-ops.txt 2>&1 || true
          ./infra/oci/agents/node-logs-stan.sh \
            > artifacts/oci-deploy-validation/final/node-logs.txt 2>&1 || true

      - name: Upload sanitized diagnostics on failure
        if: >-
          always() &&
          (steps.apply.outcome == 'failure' ||
            steps.bind.outcome == 'failure' ||
            steps.release_lock.outcome == 'failure' ||
            steps.health.outcome == 'failure' ||
            steps.release_runtime.outcome == 'failure' ||
            steps.rehold.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-deploy-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oci-deploy-validation
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload exact deployment provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-deploy-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/oci-deploy/provenance.txt
            artifacts/oci-deploy/images.tsv
            artifacts/oci-deploy/rabbitmq-baseline.txt
            artifacts/oci-deploy/live-schema.env
          if-no-files-found: error
          retention-days: 30

      - name: Revoke exact runner rule
        if: always() && env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          RULE_STATE_FILE: artifacts/oci-deploy/runner-rule.env
        run: |
          if [ -f "$RULE_STATE_FILE" ]; then
            ./infra/oci/scripts/revoke-github-runner.sh "$RULE_STATE_FILE"
          fi

      - name: Close ephemeral OCI Bastion access
        if: always() && env.OCI_RUNTIME_MODE == 'k3s'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          SESSION_STATE_FILE: artifacts/oci-deploy/k3s-access.env
          WORK_DIR: ${{ runner.temp }}/betstan-k3s-access
        run: ./infra/oci/scripts/configure-k3s-access.sh cleanup

      - name: Remove isolated OCI client state
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/oci-home"
          rm -f artifacts/oci-deploy/rendered.yaml

  public-validate:
    needs: deploy
    if: github.run_attempt == 1 && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: oci-production
    steps:
      - name: Checkout exact deployed commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate public-check identity
        env:
          SOURCE_SHA: ${{ inputs.approved_sha }}
          OCI_PUBLIC_URL: ${{ needs.deploy.outputs.public_url }}
          OCI_REDIRECT_URL: ${{ needs.deploy.outputs.redirect_url }}
          OCI_DIAGNOSTIC_URL: ${{ needs.deploy.outputs.diagnostic_url }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "master" ]
          [ "$GITHUB_RUN_ATTEMPT" = "1" ]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          [ "$OCI_PUBLIC_URL" = "https://betstan.xyz" ]
          [ "$OCI_REDIRECT_URL" = "https://www.betstan.xyz" ]
          [[ "$OCI_DIAGNOSTIC_URL" =~ ^https://[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\.nip\.io$ ]]

      - name: Install browser validation dependencies
        run: |
          cd client
          npm ci
          npx playwright install --with-deps chromium

      - name: Run public OCI validation without cloud credentials
        env:
          OCI_PUBLIC_URL: ${{ needs.deploy.outputs.public_url }}
          OCI_REDIRECT_URL: ${{ needs.deploy.outputs.redirect_url }}
          OCI_DIAGNOSTIC_URL: ${{ needs.deploy.outputs.diagnostic_url }}
          OCI_CLUSTER_CHECKS_ALREADY_PASSED: "1"
          MAX_LOOPS: "3"
          SLEEP_SECONDS: "20"
          OUTPUT_DIR: artifacts/oci-public-validation
        run: ./infra/oci/agents/validation-loop-stan.sh

      - name: Upload public validation diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-public-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oci-public-validation
          if-no-files-found: ignore
          retention-days: 14
