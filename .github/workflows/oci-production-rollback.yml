name: oci-production-rollback
run-name: oci-rollback ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact historical master commit SHA to restore
        required: true
        type: string
      baseline_source_run_id:
        description: OCI production deploy run ID that uploaded the protected baseline artifact
        required: true
        type: string
      baseline_source_run_attempt:
        description: Protected baseline source run attempt (must be 1)
        required: true
        type: string
      baseline_artifact_name:
        description: Exact baseline artifact name oci-production-baseline-<run-id>-1
        required: true
        type: string
      infrastructure_run_id:
        description: Successful first-attempt oci-infrastructure run ID for the active runtime
        required: true
        type: string
      partial_rollback_run_id:
        description: Failed first-attempt rollback run to abort and restore, or 0 for a new rollback
        required: true
        default: '0'
        type: string
      pre_recovery_build_run_id:
        description: Successful first-attempt OCI build matching the failed rollback pre-run state, or 0
        required: true
        default: '0'
        type: string
      allow_legacy_admin_auth:
        description: Explicitly allow rollback to a release without persisted Backoffice admin authorization
        required: true
        type: boolean
        default: false
      legacy_admin_auth_reason:
        description: Audited reason for the legacy admin-auth override, or not-requested
        required: true
        type: string
        default: not-requested
      confirmation:
        description: Type ROLLBACK OCI EXACT DIGEST or RECOVER OCI PARTIAL ROLLBACK
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: oci-control-plane
  cancel-in-progress: false

jobs:
  rollback:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: oci-production
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      BASELINE_SOURCE_RUN_ID: ${{ inputs.baseline_source_run_id }}
      BASELINE_SOURCE_RUN_ATTEMPT: ${{ inputs.baseline_source_run_attempt }}
      BASELINE_ARTIFACT_NAME: ${{ inputs.baseline_artifact_name }}
      INFRASTRUCTURE_RUN_ID: ${{ inputs.infrastructure_run_id }}
      PARTIAL_ROLLBACK_RUN_ID: ${{ inputs.partial_rollback_run_id }}
      PRE_RECOVERY_BUILD_RUN_ID: ${{ inputs.pre_recovery_build_run_id }}
      ALLOW_LEGACY_ADMIN_AUTH: ${{ inputs.allow_legacy_admin_auth }}
      LEGACY_ADMIN_AUTH_REASON: ${{ inputs.legacy_admin_auth_reason }}
      CONFIRMATION: ${{ inputs.confirmation }}
      OCI_RUNTIME_MODE: ${{ vars.OCI_RUNTIME_MODE }}
      OCI_CLI_VERSION: "3.90.0"
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
      OCI_CI_USER_OCID: ${{ vars.OCI_CI_USER_OCID }}
      OCI_CI_KEY_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
      OCI_COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
      OCI_AVAILABILITY_DOMAIN: ${{ vars.OCI_AVAILABILITY_DOMAIN }}
      OCI_K8S_NAMESPACE: ${{ vars.OCI_K8S_NAMESPACE }}
      OCI_K3S_IMAGE_OCID: ${{ vars.OCI_K3S_IMAGE_OCID }}
      OCI_K3S_NODE_NAME: ${{ vars.OCI_K3S_NODE_NAME || 'betstan-k3s' }}
      OCI_BASTION_DEFAULT_CLIENT_CIDR: 192.0.2.1/32
      APPLICATION_REGISTRY_PROVIDER: ghcr
      APPLICATION_REGISTRY_HOST: ghcr.io
      APPLICATION_REGISTRY_REPOSITORY: vasilyevstan/betstan-images
      APPLICATION_REGISTRY_TAG_PREFIX: arm64
      APPLICATION_REGISTRY_TAG_SCHEMA: v1
      OCI_REGISTRY_MAX_BYTES: ${{ vars.OCI_REGISTRY_MAX_BYTES || '500000000' }}
      OCI_BOOT_VOLUME_GB: ${{ vars.OCI_BOOT_VOLUME_GB }}
      OCI_MONGO_VOLUME_GB: ${{ vars.OCI_MONGO_VOLUME_GB }}
      OCI_A1_OCPUS: ${{ vars.OCI_A1_OCPUS }}
      OCI_A1_MEMORY_GB: ${{ vars.OCI_A1_MEMORY_GB }}
      OCI_LB_MIN_MBPS: ${{ vars.OCI_LB_MIN_MBPS }}
      OCI_LB_MAX_MBPS: ${{ vars.OCI_LB_MAX_MBPS }}
      OCI_EXPECTED_MONTHLY_COST: ${{ vars.OCI_EXPECTED_MONTHLY_COST }}
      OCI_CERT_EMAIL: ${{ vars.OCI_CERT_EMAIL }}
      OCI_CANONICAL_HOST: ${{ vars.OCI_CANONICAL_HOST || 'betstan.xyz' }}
      OCI_REDIRECT_HOST: ${{ vars.OCI_REDIRECT_HOST || 'www.betstan.xyz' }}
      OCI_MEMORY_MAX_PERCENT: ${{ vars.OCI_MEMORY_MAX_PERCENT }}
      OCI_DISK_MAX_PERCENT: ${{ vars.OCI_DISK_MAX_PERCENT }}
      OCI_CPU_MAX_PERCENT: "90"
      OCI_HEALTH_MAX_ATTEMPTS: ${{ vars.OCI_HEALTH_MAX_ATTEMPTS }}
      OCI_HEALTH_SLEEP_SECONDS: ${{ vars.OCI_HEALTH_SLEEP_SECONDS }}
      PRODUCTION_OPERATION_ID: rollback-${{ github.run_id }}-${{ github.run_attempt }}
      PRODUCTION_WORKFLOW_PATH: .github/workflows/oci-production-rollback.yml

    steps:
      - name: Initialize isolated OCI paths
        run: |
          {
            echo "HOME=$RUNNER_TEMP/oci-home"
            echo "KUBECONFIG=$RUNNER_TEMP/oci-home/.kube/config"
          } >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/oci-home/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/oci-home/.kube"
          chmod 700 "$RUNNER_TEMP/oci-home" "$RUNNER_TEMP/oci-home/.kube"

      - name: Checkout current master commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Validate rollback request and trusted infrastructure run
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "master" ]
          [[ "$PARTIAL_ROLLBACK_RUN_ID" =~ ^(0|[1-9][0-9]*)$ ]]
          [[ "$PRE_RECOVERY_BUILD_RUN_ID" =~ ^(0|[1-9][0-9]*)$ ]]
          if [ "$PARTIAL_ROLLBACK_RUN_ID" = "0" ]; then
            [ "$CONFIRMATION" = "ROLLBACK OCI EXACT DIGEST" ]
            [ "$PRE_RECOVERY_BUILD_RUN_ID" = "0" ]
          else
            [ "$CONFIRMATION" = "RECOVER OCI PARTIAL ROLLBACK" ]
            [ "$PARTIAL_ROLLBACK_RUN_ID" != "$GITHUB_RUN_ID" ]
            [ "$PRE_RECOVERY_BUILD_RUN_ID" != "0" ]
          fi
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASELINE_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [ "$BASELINE_SOURCE_RUN_ATTEMPT" = "1" ]
          [ "$BASELINE_ARTIFACT_NAME" = "oci-production-baseline-${BASELINE_SOURCE_RUN_ID}-${BASELINE_SOURCE_RUN_ATTEMPT}" ]
          [[ "$INFRASTRUCTURE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ALLOW_LEGACY_ADMIN_AUTH" == "true" || "$ALLOW_LEGACY_ADMIN_AUTH" == "false" ]]
          [ "$GITHUB_RUN_ATTEMPT" = "1" ]
          git fetch --quiet origin master:refs/remotes/origin/master
          current_master="$(git rev-parse origin/master)"
          [ "$(git rev-parse HEAD)" = "$current_master" ]
          [ "$TARGET_SHA" != "$current_master" ]
          git cat-file -e "${TARGET_SHA}^{commit}"
          [ "$(git rev-parse "${TARGET_SHA}^{commit}")" = "$TARGET_SHA" ]
          git merge-base --is-ancestor "$TARGET_SHA" "$current_master"

          if [ "$PARTIAL_ROLLBACK_RUN_ID" != "0" ]; then
            rollback_workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/oci-production-rollback.yml" --jq '.id'
            )"
            recovery_run="$(
              gh api "repos/$REPOSITORY/actions/runs/$PARTIAL_ROLLBACK_RUN_ID/attempts/1"
            )"
            recovery_head_sha="$(
              jq -er \
                --argjson workflow_id "$rollback_workflow_id" \
                --arg repo "$REPOSITORY" \
                --arg title "oci-rollback $TARGET_SHA" '
                select(
                  .workflow_id == $workflow_id and
                  .path == ".github/workflows/oci-production-rollback.yml" and
                  .event == "workflow_dispatch" and
                  .head_branch == "master" and
                  .head_repository.full_name == $repo and
                  .status == "completed" and
                  .conclusion == "failure" and
                  .run_attempt == 1 and
                  .display_title == $title
                ) |
                .head_sha |
                select(test("^[0-9a-f]{40}$"))
              ' <<<"$recovery_run"
            )"
            git cat-file -e "${recovery_head_sha}^{commit}"
            git merge-base --is-ancestor "$recovery_head_sha" "$current_master"
            recovery_artifact_name="oci-production-rollback-${PARTIAL_ROLLBACK_RUN_ID}-1"
            gh api "repos/$REPOSITORY/actions/runs/$PARTIAL_ROLLBACK_RUN_ID/artifacts" |
              jq -e --arg name "$recovery_artifact_name" '
                [.artifacts[] | select(.name == $name)] as $matches |
                ($matches | length) == 1 and
                $matches[0].expired == false
              ' >/dev/null

            build_workflow_id="$(
              gh api "repos/$REPOSITORY/actions/workflows/oci-production-build.yml" --jq '.id'
            )"
            read -r build_observed_workflow build_path build_event \
              pre_recovery_source_sha build_head_branch build_repository \
              build_status build_conclusion build_attempt <<<"$(
                gh api \
                  "repos/$REPOSITORY/actions/runs/$PRE_RECOVERY_BUILD_RUN_ID/attempts/1" \
                  --jq '[.workflow_id,.path,.event,.head_sha,.head_branch,.head_repository.full_name,.status,.conclusion,.run_attempt] | @tsv'
              )"
            [ "$build_observed_workflow" = "$build_workflow_id" ]
            [ "$build_path" = ".github/workflows/oci-production-build.yml" ]
            [ "$build_event" = "workflow_run" ]
            [[ "$pre_recovery_source_sha" =~ ^[0-9a-f]{40}$ ]]
            [ "$build_head_branch" = "master" ]
            [ "$build_repository" = "$REPOSITORY" ]
            [ "$build_status" = "completed" ]
            [ "$build_conclusion" = "success" ]
            [ "$build_attempt" = "1" ]
            git cat-file -e "${pre_recovery_source_sha}^{commit}"
            git merge-base --is-ancestor "$pre_recovery_source_sha" "$current_master"
            pre_recovery_artifact_name="oci-image-provenance-${pre_recovery_source_sha}-${PRE_RECOVERY_BUILD_RUN_ID}-1"
            gh api "repos/$REPOSITORY/actions/runs/$PRE_RECOVERY_BUILD_RUN_ID/artifacts" |
              jq -e --arg name "$pre_recovery_artifact_name" '
                [.artifacts[] | select(.name == $name)] as $matches |
                ($matches | length) == 1 and
                $matches[0].expired == false
              ' >/dev/null
            printf 'pre_recovery_source_sha=%s\n' \
              "$pre_recovery_source_sha" >> "$GITHUB_OUTPUT"
            printf 'pre_recovery_artifact_name=%s\n' \
              "$pre_recovery_artifact_name" >> "$GITHUB_OUTPUT"
          fi

          infra_workflow_id="$(gh api "repos/$REPOSITORY/actions/workflows/oci-infrastructure.yml" --jq '.id')"
          read -r workflow_id workflow_path event head_branch repository status conclusion attempt <<<"$(
            gh api "repos/$REPOSITORY/actions/runs/$INFRASTRUCTURE_RUN_ID/attempts/1" \
              --jq '[.workflow_id,.path,.event,.head_branch,.head_repository.full_name,.status,.conclusion,.run_attempt] | @tsv'
          )"
          [ "$workflow_id" = "$infra_workflow_id" ]
          [ "$workflow_path" = ".github/workflows/oci-infrastructure.yml" ]
          [ "$event" = "workflow_dispatch" ]
          [ "$head_branch" = "master" ]
          [ "$repository" = "$REPOSITORY" ]
          [ "$status" = "completed" ] && [ "$conclusion" = "success" ] && [ "$attempt" = "1" ]
          mkdir -p \
            "$HOME/.kube" \
            artifacts/infrastructure \
            artifacts/oci-rollback \
            artifacts/pre-recovery-build
          chmod 700 "$HOME" "$HOME/.kube"
          target_release_sha="$TARGET_SHA"
          if [ "$PARTIAL_ROLLBACK_RUN_ID" != "0" ]; then
            target_release_sha="$pre_recovery_source_sha"
          fi
          printf 'TARGET_RELEASE_SHA=%s\n' "$target_release_sha" >> "$GITHUB_ENV"

      - name: Record explicit legacy admin-auth rollback capability
        if: inputs.allow_legacy_admin_auth && inputs.partial_rollback_run_id == '0'
        run: |
          set -euo pipefail
          [ "$LEGACY_ADMIN_AUTH_REASON" != "not-requested" ]
          [ -n "$LEGACY_ADMIN_AUTH_REASON" ]
          [ "${#LEGACY_ADMIN_AUTH_REASON}" -le 240 ]
          case "$LEGACY_ADMIN_AUTH_REASON" in
            *$'\n'*|*$'\r'*)
              echo "legacy admin-auth reason must be one line" >&2
              exit 1
              ;;
          esac
          [[ "$GITHUB_ACTOR" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]
          printf '%s\n' \
            "capability=legacy-admin-auth-accepted" \
            "source_sha=$TARGET_SHA" \
            "reason=$LEGACY_ADMIN_AUTH_REASON" \
            "approved_by=$GITHUB_ACTOR" \
            > artifacts/admin-auth-capability.env
          chmod 600 artifacts/admin-auth-capability.env

      - name: Download exact OCI infrastructure provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oci-infrastructure-provenance-${{ inputs.infrastructure_run_id }}-1
          path: artifacts/infrastructure
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.infrastructure_run_id }}

      - name: Download immutable failed rollback state
        if: inputs.partial_rollback_run_id != '0'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: oci-production-rollback-${{ inputs.partial_rollback_run_id }}-1
          path: artifacts/partial-rollback-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.partial_rollback_run_id }}

      - name: Download exact pre-recovery OCI image provenance
        if: inputs.partial_rollback_run_id != '0'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ steps.request.outputs.pre_recovery_artifact_name }}
          path: artifacts/pre-recovery-build
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.pre_recovery_build_run_id }}

      - name: Verify current OCI infrastructure provenance
        id: infra
        run: |
          set -euo pipefail
          source artifacts/infrastructure/provenance.env
          [ "$infrastructure_run_id" = "$INFRASTRUCTURE_RUN_ID" ]
          [ "$infrastructure_run_attempt" = "1" ]
          [ "$compartment_ocid" = "$OCI_COMPARTMENT_OCID" ]
          [ "$namespace" = "$OCI_K8S_NAMESPACE" ]
          [ "$runtime_mode" = "$OCI_RUNTIME_MODE" ]
          [ "$infrastructure_finalized" = "true" ]
          registry_evidence_count=0
          for value in \
            "${application_registry_provider:-}" \
            "${application_registry_host:-}" \
            "${application_registry_repository:-}" \
            "${application_registry_public_anonymous:-}" \
            "${ocir_application_repository_absent:-}"; do
            if [ -n "$value" ]; then
              registry_evidence_count=$((registry_evidence_count + 1))
            fi
          done
          case "$registry_evidence_count" in
            0)
              [ "$source_sha" = "$TARGET_SHA" ]
              echo "legacy infrastructure registry authorization is deferred to checksum-bound rollback evidence"
              ;;
            5)
              [ "$application_registry_provider" = "ghcr" ]
              [ "$application_registry_host" = "ghcr.io" ]
              [ "$application_registry_repository" = "ghcr.io/vasilyevstan/betstan-images" ]
              [ "$application_registry_public_anonymous" = "true" ]
              [ "$ocir_application_repository_absent" = "true" ]
              ;;
            *)
              echo "infrastructure registry evidence is incomplete" >&2
              exit 1
              ;;
          esac
          [ "$public_host" = "$OCI_CANONICAL_HOST" ]
          [ "$canonical_host" = "$OCI_CANONICAL_HOST" ]
          [ "$redirect_host" = "$OCI_REDIRECT_HOST" ]
          [ "$diagnostic_host" = "${ingress_ipv4}.nip.io" ]
          if [ "$runtime_mode" = "oke" ]; then
            echo "::add-mask::$cluster_ocid"
            echo "::add-mask::$endpoint_nsg_ocid"
            runtime_fingerprint="$cluster_fingerprint"
          else
            echo "::add-mask::$instance_ocid"
            runtime_fingerprint="$instance_fingerprint"
          fi
          {
            if [ "$runtime_mode" = "oke" ]; then
              printf 'cluster_ocid=%s\n' "$cluster_ocid"
              printf 'endpoint_nsg_ocid=%s\n' "$endpoint_nsg_ocid"
            else
              printf 'instance_ocid=%s\n' "$instance_ocid"
            fi
            printf 'public_url=https://%s\n' "$public_host"
            printf 'redirect_url=https://%s\n' "$redirect_host"
            printf 'diagnostic_url=https://%s\n' "$diagnostic_host"
            printf 'runtime_fingerprint=%s\n' "$runtime_fingerprint"
            printf 'infrastructure_provenance_sha256=%s\n' "$(
              sha256sum artifacts/infrastructure/provenance.env |
                awk '{print $1}'
            )"
          } >> "$GITHUB_OUTPUT"

      - name: Install pinned OCI CLI
        run: ./infra/oci/scripts/install-cli.sh

      - name: Verify OKE identity
        if: env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_CLUSTER_OCID: ${{ steps.infra.outputs.cluster_ocid }}
        run: |
          set -euo pipefail
          oci ce cluster get \
            --cluster-id "$OCI_CLUSTER_OCID" \
            --query 'data.{type:type,state:"lifecycle-state"}' \
            >/dev/null

      - name: Verify k3s identity
        if: env.OCI_RUNTIME_MODE == 'k3s'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_INSTANCE_OCID: ${{ steps.infra.outputs.instance_ocid }}
        run: |
          set -euo pipefail
          oci compute instance get \
            --instance-id "$OCI_INSTANCE_OCID" \
            --query 'data.{shape:shape,state:"lifecycle-state"}' \
            >/dev/null

      - name: Reconcile expired and authorize current runner IPv4
        if: env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_ENDPOINT_NSG_OCID: ${{ steps.infra.outputs.endpoint_nsg_ocid }}
          RULE_STATE_FILE: ${{ runner.temp }}/betstan-rollback-control/runner-rule.env
        run: |
          set -euo pipefail
          ./infra/oci/scripts/authorize-github-runner.sh cleanup-stale
          RUNNER_PUBLIC_IPV4="$(curl --fail --silent --show-error --max-time 15 https://api.ipify.org)"
          export RUNNER_PUBLIC_IPV4
          ./infra/oci/scripts/authorize-github-runner.sh authorize

      - name: Configure kubectl from exact cluster OCID
        if: env.OCI_RUNTIME_MODE == 'oke'
        uses: oracle-actions/configure-kubectl-oke@77a733d79446dabe7bf0e58eb56197d33ce4dc58 # v1.5.0
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
        with:
          cluster: ${{ steps.infra.outputs.cluster_ocid }}

      - name: Open ephemeral OCI Bastion access to k3s
        if: env.OCI_RUNTIME_MODE == 'k3s'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          OCI_K3S_SSH_PRIVATE_KEY: ${{ secrets.OCI_K3S_SSH_PRIVATE_KEY }}
          INFRA_PROVENANCE_FILE: artifacts/infrastructure/provenance.env
          SESSION_STATE_FILE: ${{ runner.temp }}/betstan-rollback-control/k3s-access.env
          WORK_DIR: ${{ runner.temp }}/betstan-k3s-access
        run: |
          set -euo pipefail
          RUNNER_PUBLIC_IPV4="$(
            curl --fail --silent --show-error --max-time 15 https://api.ipify.org
          )"
          export RUNNER_PUBLIC_IPV4
          ./infra/oci/scripts/configure-k3s-access.sh open

      - name: Begin production operation
        id: operation_begin
        run: |
          set -euo pipefail
          python3 infra/oci/monitor/production_state.py begin-operation \
            --namespace "$OCI_K8S_NAMESPACE" \
            --policy infra/oci/monitor/policy-v1.json \
            --operation-id "$PRODUCTION_OPERATION_ID" \
            --workflow-path "$PRODUCTION_WORKFLOW_PATH" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-sha "$GITHUB_SHA" \
            --target-sha "$TARGET_RELEASE_SHA" \
            --phase rolling-back \
            --lease-seconds 7200 \
            --output artifacts/oci-rollback/production-operation.json

      - name: Roll back exact immutable OCI images
        id: rollback
        if: inputs.partial_rollback_run_id == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OUTPUT_DIR: artifacts/oci-rollback
          OCI_PUBLIC_URL: ${{ steps.infra.outputs.public_url }}
          OCI_REDIRECT_URL: ${{ steps.infra.outputs.redirect_url }}
          OCI_DIAGNOSTIC_URL: ${{ steps.infra.outputs.diagnostic_url }}
          OCI_RUNTIME_FINGERPRINT: ${{ steps.infra.outputs.runtime_fingerprint }}
          OCI_INFRASTRUCTURE_PROVENANCE_SHA256: ${{ steps.infra.outputs.infrastructure_provenance_sha256 }}
          OCI_INFRASTRUCTURE_PROVENANCE_FILE: artifacts/infrastructure/provenance.env
          ADMIN_AUTH_CAPABILITY_FILE: artifacts/admin-auth-capability.env
        run: ./infra/oci/scripts/rollback-application-stan.sh

      - name: Restore exact pre-run state from failed partial rollback
        id: recover
        if: inputs.partial_rollback_run_id != '0'
        env:
          PARTIAL_ROLLBACK_SOURCE_DIR: artifacts/partial-rollback-source
          PARTIAL_RECOVERY_BUILD_DIR: artifacts/pre-recovery-build
          PARTIAL_RECOVERY_BUILD_RUN_ID: ${{ inputs.pre_recovery_build_run_id }}
          PARTIAL_RECOVERY_SOURCE_SHA: ${{ steps.request.outputs.pre_recovery_source_sha }}
          OUTPUT_DIR: artifacts/oci-rollback
          OCI_PUBLIC_URL: ${{ steps.infra.outputs.public_url }}
          OCI_REDIRECT_URL: ${{ steps.infra.outputs.redirect_url }}
          OCI_DIAGNOSTIC_URL: ${{ steps.infra.outputs.diagnostic_url }}
          OCI_RUNTIME_FINGERPRINT: ${{ steps.infra.outputs.runtime_fingerprint }}
          OCI_INFRASTRUCTURE_PROVENANCE_SHA256: ${{ steps.infra.outputs.infrastructure_provenance_sha256 }}
          OCI_INFRASTRUCTURE_PROVENANCE_FILE: artifacts/infrastructure/provenance.env
        run: ./infra/oci/scripts/recover-partial-rollback-stan.sh

      - name: Advance production operation to validation
        id: operation_validate
        if: >-
          (inputs.partial_rollback_run_id == '0' && steps.rollback.outcome == 'success') ||
          (inputs.partial_rollback_run_id != '0' && steps.recover.outcome == 'success')
        run: |
          set -euo pipefail
          python3 infra/oci/monitor/production_state.py advance-operation \
            --namespace "$OCI_K8S_NAMESPACE" \
            --policy infra/oci/monitor/policy-v1.json \
            --operation-id "$PRODUCTION_OPERATION_ID" \
            --workflow-path "$PRODUCTION_WORKFLOW_PATH" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-sha "$GITHUB_SHA" \
            --target-sha "$TARGET_RELEASE_SHA" \
            --phase validating \
            --lease-seconds 900 \
            --output artifacts/oci-rollback/production-operation.json

      - name: Publish rollback active release
        id: publish_release
        if: steps.operation_validate.outcome == 'success'
        run: |
          set -euo pipefail
          images=artifacts/oci-rollback/images.tsv
          if [ "$PARTIAL_ROLLBACK_RUN_ID" = "0" ]; then
            images=artifacts/oci-rollback/baseline/images.tsv
          fi
          python3 infra/oci/monitor/production_state.py publish-release \
            --namespace "$OCI_K8S_NAMESPACE" \
            --source-sha "$TARGET_RELEASE_SHA" \
            --workflow-path "$PRODUCTION_WORKFLOW_PATH" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --infrastructure-run-id "$INFRASTRUCTURE_RUN_ID" \
            --images "$images" \
            --infrastructure-fingerprint-sha256 "${{ steps.infra.outputs.runtime_fingerprint }}" \
            --output artifacts/oci-rollback/active-release.json

      - name: Finish successful production operation
        id: operation_finish
        if: steps.publish_release.outcome == 'success'
        run: |
          set -euo pipefail
          python3 infra/oci/monitor/production_state.py finish-operation \
            --namespace "$OCI_K8S_NAMESPACE" \
            --policy infra/oci/monitor/policy-v1.json \
            --operation-id "$PRODUCTION_OPERATION_ID" \
            --workflow-path "$PRODUCTION_WORKFLOW_PATH" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-sha "$GITHUB_SHA" \
            --target-sha "$TARGET_RELEASE_SHA" \
            --result succeeded \
            --output artifacts/oci-rollback/production-operation.json

      - name: Finish failed production operation
        if: >-
          always() &&
          steps.operation_begin.outcome == 'success' &&
          steps.operation_finish.outcome != 'success'
        run: |
          set -euo pipefail
          python3 infra/oci/monitor/production_state.py finish-operation \
            --namespace "$OCI_K8S_NAMESPACE" \
            --policy infra/oci/monitor/policy-v1.json \
            --operation-id "$PRODUCTION_OPERATION_ID" \
            --workflow-path "$PRODUCTION_WORKFLOW_PATH" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --control-sha "$GITHUB_SHA" \
            --target-sha "$TARGET_RELEASE_SHA" \
            --result failed \
            --output artifacts/oci-rollback/production-operation.json

      - name: Upload rollback diagnostics and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-production-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/oci-rollback
          if-no-files-found: error
          retention-days: 30

      - name: Revoke exact runner rule
        if: always() && env.OCI_RUNTIME_MODE == 'oke'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          RULE_STATE_FILE: ${{ runner.temp }}/betstan-rollback-control/runner-rule.env
        run: |
          if [ -f "$RULE_STATE_FILE" ]; then
            ./infra/oci/scripts/revoke-github-runner.sh "$RULE_STATE_FILE"
          fi

      - name: Close ephemeral OCI Bastion access
        if: always() && env.OCI_RUNTIME_MODE == 'k3s'
        env:
          OCI_CLI_USER: ${{ vars.OCI_CI_USER_OCID }}
          OCI_CLI_TENANCY: ${{ vars.OCI_TENANCY_OCID }}
          OCI_CLI_FINGERPRINT: ${{ vars.OCI_CI_KEY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CI_PRIVATE_KEY_PEM }}
          OCI_CLI_REGION: ${{ vars.OCI_REGION }}
          SESSION_STATE_FILE: ${{ runner.temp }}/betstan-rollback-control/k3s-access.env
          WORK_DIR: ${{ runner.temp }}/betstan-k3s-access
        run: ./infra/oci/scripts/configure-k3s-access.sh cleanup

      - name: Remove isolated OCI client state
        if: always()
        run: >-
          rm -rf "$HOME"
          "$RUNNER_TEMP/betstan-rollback-control"
          "$RUNNER_TEMP/betstan-k3s-access"
