name: oci-production-self-heal
run-name: oci-self-heal issue-${{ inputs.issue_number }} repair-${{ inputs.repair_generation }}

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Exact production incident issue number
        required: true
        type: string
      incident_fingerprint:
        description: Exact incident episode fingerprint
        required: true
        type: string
      repair_generation:
        description: Exact repair generation
        required: true
        type: string
      repair_id:
        description: Exact deterministic repair identifier
        required: true
        type: string
      service:
        description: Restart-safe service
        required: true
        type: choice
        options:
          - client
          - backoffice
      target_sha:
        description: Exact active release SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  issues: read

concurrency:
  group: oci-control-plane
  cancel-in-progress: false

jobs:
  restart:
    if: >-
      github.run_attempt == 1 &&
      github.ref == 'refs/heads/master' &&
      vars.OCI_PRODUCTION_MONITOR_SELF_HEAL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: oci-production
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      INCIDENT_FINGERPRINT: ${{ inputs.incident_fingerprint }}
      REPAIR_GENERATION: ${{ inputs.repair_generation }}
      REPAIR_ID: ${{ inputs.repair_id }}
      SERVICE: ${{ inputs.service }}
      TARGET_SHA: ${{ inputs.target_sha }}
      OCI_PUBLIC_URL: ${{ vars.OCI_PUBLIC_URL || 'https://betstan.xyz' }}
      OCI_REDIRECT_URL: ${{ vars.OCI_REDIRECT_URL || 'https://www.betstan.xyz' }}
      OCI_DIAGNOSTIC_URL: ${{ vars.OCI_DIAGNOSTIC_URL }}
      OIDC_AUDIENCE: betstan-production-repair

    steps:
      - name: Check out trusted self-heal source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact repair authorization
        run: |
          set -euo pipefail
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$REPAIR_GENERATION" =~ ^[1-9][0-9]*$ ]]
          [[ "$INCIDENT_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]
          [[ "$REPAIR_ID" =~ ^[a-z0-9][a-z0-9._:/-]{0,159}$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          [[ "$OCI_DIAGNOSTIC_URL" =~ ^https://([0-9]{1,3}\.){3}[0-9]{1,3}\.nip\.io$ ]]
          mkdir -p "$RUNNER_TEMP/production-self-heal"
          python3 infra/oci/monitor/self_heal_request.py \
            --repository "$GITHUB_REPOSITORY" \
            --policy infra/oci/monitor/policy-v1.json \
            --issue-number "$ISSUE_NUMBER" \
            --incident-fingerprint "$INCIDENT_FINGERPRINT" \
            --repair-generation "$REPAIR_GENERATION" \
            --repair-id "$REPAIR_ID" \
            --service "$SERVICE" \
            --target-sha "$TARGET_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --output "$RUNNER_TEMP/production-self-heal/request.json"

      - name: Request one bounded restart
        id: restart
        run: |
          set -euo pipefail
          oidc="$(
            curl --fail --silent --show-error --max-time 15 \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" |
              jq -er '.value'
          )"
          jq -n \
            --arg service "$SERVICE" \
            --arg repair_id "$REPAIR_ID" \
            --arg target_sha "$TARGET_SHA" \
            '{service:$service,repair_id:$repair_id,target_sha:$target_sha}' \
            > "$RUNNER_TEMP/production-self-heal/restart-request.json"
          curl --fail --silent --show-error --max-time 165 \
            -H "Authorization: Bearer $oidc" \
            -H "Content-Type: application/json" \
            -H "X-BetStan-Workflow-SHA: $GITHUB_SHA" \
            --data-binary @"$RUNNER_TEMP/production-self-heal/restart-request.json" \
            "$OCI_DIAGNOSTIC_URL/__betstan/repair/v1/restart" \
            > "$RUNNER_TEMP/production-self-heal/restart-response.json"
          jq -e \
            --arg service "$SERVICE" \
            --arg repair_id "$REPAIR_ID" '
              .schema == "betstan.production-restart.v1" and
              .service == $service and
              .repair_id == $repair_id and
              (.active_release_generation | type == "number") and
              (.operation_id | type == "string")
            ' "$RUNNER_TEMP/production-self-heal/restart-response.json" >/dev/null

      - name: Run independent public validation
        id: validate
        env:
          REQUEST_TIMEOUT: "20"
          STABILITY_ATTEMPTS: "3"
          OUTPUT_DIR: ${{ runner.temp }}/production-self-heal/public-validation
        run: ./infra/oci/agents/smoke-liveness-stan.sh

      - name: Finalize self-heal operation
        if: always() && steps.restart.outcome == 'success'
        run: |
          set -euo pipefail
          result=failed
          if [ "${{ steps.validate.outcome }}" = "success" ]; then
            result=succeeded
          fi
          oidc="$(
            curl --fail --silent --show-error --max-time 15 \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}" |
              jq -er '.value'
          )"
          jq -n \
            --arg service "$SERVICE" \
            --arg repair_id "$REPAIR_ID" \
            --arg target_sha "$TARGET_SHA" \
            --arg result "$result" \
            '{service:$service,repair_id:$repair_id,target_sha:$target_sha,result:$result}' \
            > "$RUNNER_TEMP/production-self-heal/finalize-request.json"
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $oidc" \
            -H "Content-Type: application/json" \
            -H "X-BetStan-Workflow-SHA: $GITHUB_SHA" \
            --data-binary @"$RUNNER_TEMP/production-self-heal/finalize-request.json" \
            "$OCI_DIAGNOSTIC_URL/__betstan/repair/v1/finalize" \
            > "$RUNNER_TEMP/production-self-heal/finalize-response.json"
          jq -e --arg result "$result" '
            .schema == "betstan.production-restart-final.v1" and
            .result == $result
          ' "$RUNNER_TEMP/production-self-heal/finalize-response.json" >/dev/null

      - name: Upload sanitized self-heal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-production-self-heal-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/production-self-heal/request.json
            ${{ runner.temp }}/production-self-heal/restart-response.json
            ${{ runner.temp }}/production-self-heal/finalize-response.json
            ${{ runner.temp }}/production-self-heal/public-validation
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
