name: oci-validate

on:
  pull_request:
    branches:
      - dev
      - master
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  offline-contract:
    name: oci-validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pull request
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Select OCI contract scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mode=none
          while IFS= read -r path; do
            case "$path" in
              infra/oci/agents/health-check-stan.sh|\
              infra/oci/agents/test-health-contract-stan.sh|\
              .github/workflows/oci-validate.yml|\
              infra/oci/tests/test-ghcr-contract.sh)
                [ "$mode" = full ] || mode=focused
                ;;
              infra/oci/*|\
              .github/workflows/oci-*.yml|\
              .github/workflows/ghcr-package-management.yml)
                mode=full
                ;;
            esac
          done < <(git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "oci_contract_scope=$mode"

      - name: Validate OCI workflow syntax
        if: steps.scope.outputs.mode != 'none'
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" \
            | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= \
            .github/workflows/oci-*.yml \
            .github/workflows/ghcr-package-management.yml

      - name: Run focused OCI contracts
        if: steps.scope.outputs.mode == 'focused'
        run: |
          bash -n \
            infra/oci/agents/health-check-stan.sh \
            infra/oci/agents/test-health-contract-stan.sh
          ./infra/oci/agents/test-health-contract-stan.sh
          ./infra/oci/tests/test-ghcr-contract.sh

      - name: Run full OCI contracts
        if: steps.scope.outputs.mode == 'full'
        run: ./infra/oci/tests/run-contracts.sh

      - name: Record unaffected OCI scope
        if: steps.scope.outputs.mode == 'none'
        run: echo "OCI contracts unaffected by this pull request"
