name: production-build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - dev
      - master
    types: [opened, synchronize, reopened]

env:
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read

jobs:
  change-scope:
    runs-on: ubuntu-latest
    outputs:
      auth_smoke: ${{ steps.scope.outputs.auth_smoke }}
      coverage_needed: ${{ steps.scope.outputs.coverage_needed }}
      coverage_matrix: ${{ steps.scope.outputs.coverage_matrix }}
      deployment_safety: ${{ steps.scope.outputs.deployment_safety }}
      runtime_validation: ${{ steps.scope.outputs.runtime_validation }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Select affected validation
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          services = [
              "auth", "bet", "backoffice", "event", "gamemaster",
              "moderation", "resulting", "slip", "telemetry", "client",
          ]
          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              selected = services
              auth_smoke = True
              deployment_safety = "full"
              runtime_validation = True
          else:
              paths = subprocess.check_output(
                  [
                      "git", "diff", "--no-renames", "--name-only",
                      os.environ["BASE_SHA"], os.environ["HEAD_SHA"],
                  ],
                  text=True,
              ).splitlines()
              selected = set()
              full = False
              deployment_safety = "none"
              runtime_validation = False
              for path in paths:
                  top = path.split("/", 1)[0]
                  if top in services:
                      selected.add(top)
                  elif path.startswith("common/") or path.startswith("betstan-common-"):
                      full = True
                  elif path.startswith((
                      "infra/",
                      ".github/",
                      "docs/",
                  )) or path in {
                      "CONTRIBUTING.md", "LEARNINGS.md", "README.md",
                  }:
                      pass
                  else:
                      full = True
                  if path.startswith((
                      "infra/azure/agents/",
                      ".github/scripts/",
                      ".github/workflows/",
                  )):
                      runtime_validation = True
                  if path in {
                      ".github/workflows/production-build.yml",
                      "infra/azure/agents/test-deployment-safety-ci-stan.sh",
                  } and deployment_safety != "full":
                      deployment_safety = "meta"
                  if (
                      path in {
                          ".github/workflows/production-deploy.yml",
                          ".github/workflows/production-rollback.yml",
                          "infra/azure/agents/baseline-capture-stan.sh",
                          "infra/azure/agents/deploy-validation-loop-stan.sh",
                          "infra/azure/agents/rollback-application-stan.sh",
                          "infra/azure/agents/rollback-readiness-stan.sh",
                          "infra/azure/agents/production-run-exclusivity-stan.sh",
                          "infra/azure/agents/shared-mongo-operation-lock-stan.sh",
                          "infra/azure/agents/test-deploy-validation-loop-stan.sh",
                          "infra/azure/agents/test-production-rollback-stan.sh",
                          "infra/azure/agents/test-production-run-exclusivity-stan.sh",
                          "infra/azure/agents/test-shared-mongo-operation-lock-stan.sh",
                      }
                      or path.startswith(
                          "infra/azure/agents/live-betting-readiness-"
                      )
                      or path.startswith(
                          "infra/azure/agents/test-live-betting-"
                      )
                  ):
                      deployment_safety = "full"
              if full:
                  selected = set(services)
              selected = [service for service in services if service in selected]
              auth_smoke = "auth" in selected
          matrix = selected or ["none"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"auth_smoke={str(auth_smoke).lower()}\n")
              output.write(
                  f"coverage_needed={str(bool(selected)).lower()}\n"
              )
              output.write(
                  "coverage_matrix=" +
                  json.dumps({"service": matrix}, separators=(",", ":")) +
                  "\n"
              )
              output.write(f"deployment_safety={deployment_safety}\n")
              output.write(
                  f"runtime_validation={str(runtime_validation).lower()}\n"
              )
          print(
              "selected_validation=" +
              json.dumps({
                  "auth_smoke": auth_smoke,
                  "coverage": matrix,
                  "deployment_safety": deployment_safety,
                  "runtime_validation": runtime_validation,
              }, sort_keys=True)
          )
          PY

  manifest-static-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate Kubernetes manifest YAML syntax
        run: |
          ruby <<'RUBY'
          require "yaml"

          directories = %w[infra/k8s infra/k8s-prod infra/k8s-stage]
          files = directories.flat_map do |directory|
            Dir.glob(File.join(directory, "**", "*.{yaml,yml}"))
          end.sort

          failed = false
          files.each do |file|
            begin
              YAML.load_stream(File.read(file))
            rescue Psych::SyntaxError => error
              warn "#{file}: #{error.message}"
              failed = true
            end
          end

          abort "Kubernetes manifest YAML syntax validation failed" if failed
          puts "Validated #{files.length} Kubernetes manifest YAML files"
          RUBY

  ingress-routing-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate infrastructure secrets and ingress safety
        run: |
          chmod +x \
            infra/azure/agents/ingress-routing-guard-stan.sh \
            infra/azure/agents/pre-commit-infra-check-stan.sh
          ./infra/azure/agents/pre-commit-infra-check-stan.sh

  deploy-runtime-script-validate:
    needs: change-scope
    if: needs.change-scope.outputs.runtime_validation == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate deploy/runtime shell scripts syntax
        run: |
          bash -n infra/azure/agents/deploy-validation-loop-stan.sh
          bash -n infra/azure/agents/smoke-liveness-stan.sh
          bash -n infra/azure/agents/validation-loop-stan.sh
          bash -n infra/azure/agents/service-ops-stan.sh
          bash -n infra/azure/agents/node-logs-stan.sh
          bash -n infra/azure/agents/ingress-routing-guard-stan.sh
          bash -n infra/azure/agents/branch-policy-guard-stan.sh
          bash -n infra/azure/agents/test-branch-policy-guard-stan.sh
          bash -n infra/azure/agents/production-workflow-inventory-stan.sh
          bash -n infra/azure/agents/test-production-workflow-inventory-stan.sh
          bash -n infra/azure/agents/test-pr-validation-stan.sh
          bash -n infra/azure/agents/test-workflow-run-provenance-stan.sh
          node --check .github/scripts/publish-pr-policy.js
          node --check .github/scripts/test-publish-pr-policy.js
          python3 -m py_compile infra/azure/agents/image_provenance_stan.py
          python3 -m py_compile infra/azure/agents/test_image_provenance_stan.py
          bash -n infra/azure/agents/reconcile-nodepool-profile-stan.sh
          bash -n infra/azure/agents/pre-commit-infra-check-stan.sh
          bash -n infra/azure/agents/post-merge-verification-stan.sh
          bash -n infra/azure/agents/rollback-readiness-stan.sh
          ./infra/azure/agents/test-branch-policy-guard-stan.sh
          ./infra/azure/agents/test-production-workflow-inventory-stan.sh
          ./infra/azure/agents/test-pr-validation-stan.sh
          ./infra/azure/agents/test-workflow-run-provenance-stan.sh
          node .github/scripts/test-publish-pr-policy.js
          python3 infra/azure/agents/test_image_provenance_stan.py

  workflow-trigger-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate trusted production workflow chain
        run: ./infra/azure/agents/workflow-trigger-guard-stan.sh

  deployment-safety-contracts:
    needs: change-scope
    if: needs.change-scope.outputs.deployment_safety != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Validate deployment safety workflow contract
        run: |
          bash -n infra/azure/agents/test-deployment-safety-ci-stan.sh
          ./infra/azure/agents/test-deployment-safety-ci-stan.sh

      - name: Validate affected Azure deployment contracts
        if: needs.change-scope.outputs.deployment_safety == 'full'
        run: |
          bash -n \
            infra/azure/agents/deploy-validation-loop-stan.sh \
            infra/azure/agents/baseline-capture-stan.sh \
            infra/azure/agents/live-betting-readiness-lib.sh \
            infra/azure/agents/live-betting-readiness-stan.sh \
            infra/azure/agents/live-betting-readiness-test-lib.sh \
            infra/azure/agents/rollback-application-stan.sh \
            infra/azure/agents/shared-mongo-operation-lock-stan.sh \
            infra/azure/agents/test-deploy-validation-loop-stan.sh \
            infra/azure/agents/test-live-betting-readiness-stan.sh \
            infra/azure/agents/test-live-betting-rollback-readiness-stan.sh \
            infra/azure/agents/test-production-rollback-stan.sh \
            infra/azure/agents/test-shared-mongo-operation-lock-stan.sh
          ./infra/azure/agents/test-deploy-validation-loop-stan.sh
          ./infra/azure/agents/test-live-betting-readiness-stan.sh
          ./infra/azure/agents/test-live-betting-rollback-readiness-stan.sh
          ./infra/azure/agents/test-production-rollback-stan.sh
          ./infra/azure/agents/test-shared-mongo-operation-lock-stan.sh

  auth-container-smoke:
    needs: change-scope
    if: needs.change-scope.outputs.auth_smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build deterministic auth image
        run: docker build --tag "betstan-auth-smoke:${GITHUB_SHA}" auth

      - name: Typecheck inside production image
        run: >
          docker run --rm "betstan-auth-smoke:${GITHUB_SHA}"
          ./node_modules/.bin/tsc --noEmit

      - name: Start production image and verify auth API
        run: |
          set -euo pipefail
          container_name="betstan-auth-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          response_file="$(mktemp)"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            rm -f "$response_file"
          }
          trap cleanup EXIT

          export JWT_KEY="$(openssl rand -hex 32)"
          docker run --detach \
            --name "$container_name" \
            --network host \
            --env JWT_KEY \
            --env MONGO_URI=mongodb://127.0.0.1:27017/auth_container_smoke \
            "betstan-auth-smoke:${GITHUB_SHA}"

          ready=false
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --output "$response_file" \
              http://127.0.0.1:3000/api/auth/currentuser; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            docker logs "$container_name"
            exit 1
          fi
          grep -q '"currentUser":null' "$response_file"

  coverage-gate:
    needs: change-scope
    if: needs.change-scope.outputs.coverage_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.change-scope.outputs.coverage_matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Cache mongodb-memory-server binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install dependencies
        working-directory: ./${{ matrix.service }}
        run: npm ci

      - name: Run coverage
        working-directory: ./${{ matrix.service }}
        env:
          CI: "true"
          MONGOMS_DOWNLOAD_DIR: ${{ runner.temp }}/mongodb-binaries
        run: |
          if [ "${{ matrix.service }}" = "client" ]; then
            npm test -- --watchAll=false --coverage --coverageReporters=json-summary \
              --collectCoverageFrom=src/hook/UseRequest.js \
              --collectCoverageFrom=src/pages/auth/NewUser.js \
              --collectCoverageFrom=src/pages/auth/LogIn.js \
              --collectCoverageFrom=src/pages/auth/LogOut.js
            npm run build
          else
            ./node_modules/.bin/tsc --noEmit
            npm run test:ci -- --runInBand --coverage --coverageReporters=json-summary
          fi

      - name: Enforce 80% lines/branches
        working-directory: ./${{ matrix.service }}
        run: |
          node -e "
            const fs = require('fs');
            const p = 'coverage/coverage-summary.json';
            if (!fs.existsSync(p)) { console.error('Missing ' + p); process.exit(1); }
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            const t = j.total || {};
            const lines = t.lines?.pct ?? 0;
            const branchTotal = t.branches?.total ?? 0;
            const branches = t.branches?.pct ?? 0;
            console.log('lines=' + lines + ' branches=' + branches + ' branchTotal=' + branchTotal);
            if (lines < 80) { console.error('Line coverage gate failed (<80%)'); process.exit(1); }
            if (branchTotal > 0 && branches < 80) { console.error('Branch coverage gate failed (<80%)'); process.exit(1); }
          "

  pr-quality-gates:
    name: pr-quality-gates
    if: always() && github.event_name == 'pull_request'
    needs: [change-scope, manifest-static-validate, ingress-routing-guard, deploy-runtime-script-validate, workflow-trigger-guard, deployment-safety-contracts, auth-container-smoke, coverage-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation gate
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          MANIFEST_RESULT: ${{ needs.manifest-static-validate.result }}
          INGRESS_RESULT: ${{ needs.ingress-routing-guard.result }}
          RUNTIME_NEEDED: ${{ needs.change-scope.outputs.runtime_validation }}
          SCRIPT_RESULT: ${{ needs.deploy-runtime-script-validate.result }}
          WORKFLOW_RESULT: ${{ needs.workflow-trigger-guard.result }}
          DEPLOYMENT_SAFETY_NEEDED: ${{ needs.change-scope.outputs.deployment_safety }}
          DEPLOYMENT_SAFETY_RESULT: ${{ needs.deployment-safety-contracts.result }}
          AUTH_NEEDED: ${{ needs.change-scope.outputs.auth_smoke }}
          AUTH_CONTAINER_RESULT: ${{ needs.auth-container-smoke.result }}
          COVERAGE_NEEDED: ${{ needs.change-scope.outputs.coverage_needed }}
          COVERAGE_RESULT: ${{ needs.coverage-gate.result }}
        run: |
          for result in "$SCOPE_RESULT" "$MANIFEST_RESULT" "$INGRESS_RESULT" "$WORKFLOW_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "required validation result=$result" >&2
              exit 1
            fi
          done
          if [ "$RUNTIME_NEEDED" = "true" ]; then
            [ "$SCRIPT_RESULT" = "success" ] || exit 1
          else
            [ "$SCRIPT_RESULT" = "skipped" ] || exit 1
          fi
          if [ "$AUTH_NEEDED" = "true" ]; then
            [ "$AUTH_CONTAINER_RESULT" = "success" ] || exit 1
          else
            [ "$AUTH_CONTAINER_RESULT" = "skipped" ] || exit 1
          fi
          if [ "$DEPLOYMENT_SAFETY_NEEDED" = "none" ]; then
            [ "$DEPLOYMENT_SAFETY_RESULT" = "skipped" ] || exit 1
          else
            [ "$DEPLOYMENT_SAFETY_RESULT" = "success" ] || exit 1
          fi
          if [ "$COVERAGE_NEEDED" = "true" ]; then
            [ "$COVERAGE_RESULT" = "success" ] || exit 1
          else
            [ "$COVERAGE_RESULT" = "skipped" ] || exit 1
          fi

  build:
    needs: [change-scope, manifest-static-validate, ingress-routing-guard, deploy-runtime-script-validate, workflow-trigger-guard, deployment-safety-contracts, auth-container-smoke, coverage-gate]
    if: >
      always() &&
      github.event_name == 'push' &&
      github.run_attempt == 1 &&
      needs.change-scope.result == 'success' &&
      needs.manifest-static-validate.result == 'success' &&
      needs.ingress-routing-guard.result == 'success' &&
      needs.deploy-runtime-script-validate.result == 'success' &&
      needs.workflow-trigger-guard.result == 'success' &&
      needs.deployment-safety-contracts.result == 'success' &&
      needs.auth-container-smoke.result == 'success' &&
      needs.coverage-gate.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production-emergency

    strategy:
      matrix:
        include:
          - service: auth
            image: stanvasilyev/gaming_auth
          - service: bet
            image: stanvasilyev/gaming_bet
          - service: backoffice
            image: stanvasilyev/gaming_backoffice
          - service: client
            image: stanvasilyev/gaming_client
          - service: event
            image: stanvasilyev/gaming_event
          - service: gamemaster
            image: stanvasilyev/gaming_gamemaster
          - service: moderation
            image: stanvasilyev/gaming_moderation
          - service: resulting
            image: stanvasilyev/gaming_resulting
          - service: slip
            image: stanvasilyev/gaming_slip

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Reject stale master build
        run: |
          set -euo pipefail
          git fetch --quiet origin master:refs/remotes/origin/master
          [ "$IMAGE_TAG" = "$(git rev-parse origin/master)" ] || {
            echo "Refusing stale production build $IMAGE_TAG" >&2
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.service }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ matrix.image }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Record immutable image provenance
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_REPOSITORY: ${{ matrix.image }}
          SERVICE: ${{ matrix.service }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${IMAGE_REPOSITORY}:${IMAGE_TAG}@${IMAGE_DIGEST}"
          mkdir -p artifacts/image-provenance
          printf '%s\n' \
            "service=$SERVICE" \
            "repository=$IMAGE_REPOSITORY" \
            "image_sha=$IMAGE_TAG" \
            "digest=$IMAGE_DIGEST" \
            "image_ref=$image_ref" \
            "build_run_id=$GITHUB_RUN_ID" \
            "build_run_attempt=$GITHUB_RUN_ATTEMPT" \
            > "artifacts/image-provenance/${SERVICE}.env"

      - name: Upload immutable image provenance
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: image-provenance-${{ matrix.service }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/image-provenance/${{ matrix.service }}.env
          if-no-files-found: error
