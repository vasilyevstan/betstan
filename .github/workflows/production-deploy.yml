name: production-deploy
run-name: deploy ${{ github.event.workflow_run.head_sha || inputs.approved_sha }}

on:
  workflow_run:
    workflows: ["production-build"]
    types: [completed]
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact built master commit SHA approved for emergency deployment
        required: true
        type: string

env:
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}
  APP_DOMAIN: ${{ vars.APP_DOMAIN || '48.206.235.122.nip.io' }}
  APP_CERT_NAME: ${{ vars.APP_CERT_NAME || 'betstan-nip-tls' }}
  APP_E2E_BASE_URL: ${{ vars.APP_E2E_BASE_URL || '' }}
  DEPLOY_VALIDATION_ATTEMPTS: ${{ vars.DEPLOY_VALIDATION_ATTEMPTS || '3' }}
  DEPLOY_VALIDATION_SLEEP_SECONDS: ${{ vars.DEPLOY_VALIDATION_SLEEP_SECONDS || '30' }}
  DEPLOY_VALIDATION_MAX_LOOPS: ${{ vars.DEPLOY_VALIDATION_MAX_LOOPS || '3' }}
  DEPLOY_VALIDATION_LOOP_SLEEP_SECONDS: ${{ vars.DEPLOY_VALIDATION_LOOP_SLEEP_SECONDS || '20' }}

permissions:
  actions: read
  contents: read

jobs:
  authorize-manual-production:
    name: authorize-manual-production
    if: github.event_name == 'workflow_dispatch' || github.run_attempt > 1
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
    - name: Checkout master history
      uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0

    - name: Validate approved SHA and build provenance
      env:
        APPROVED_SHA: ${{ inputs.approved_sha }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          [ "$GITHUB_REF_NAME" = "master" ] || {
            echo "Emergency production deploys must be dispatched from master" >&2
            exit 1
          }
        else
          APPROVED_SHA="${{ github.event.workflow_run.head_sha }}"
        fi
        git cat-file -e "${APPROVED_SHA}^{commit}"
        git merge-base --is-ancestor "$APPROVED_SHA" origin/master || {
          echo "Approved SHA is not in master history" >&2
          exit 1
        }
        [ "$(git rev-parse "${APPROVED_SHA}^{commit}")" = "$APPROVED_SHA" ] || {
          echo "Use the complete immutable commit SHA" >&2
          exit 1
        }
        conclusion="$(
          gh run list --repo "$REPO" --workflow production-build.yml \
            --commit "$APPROVED_SHA" --limit 20 \
            --json event,status,conclusion \
            --jq '[.[] | select((.event == "push" or .event == "workflow_dispatch") and .status == "completed")][0].conclusion // ""'
        )"
        [ "$conclusion" = "success" ] || {
          echo "No successful approved build found for SHA $APPROVED_SHA" >&2
          exit 1
        }

  deploy:
    needs: [authorize-manual-production]
    if: >
      always() &&
      (
        (
          (
            github.event_name == 'workflow_dispatch' ||
            github.run_attempt > 1
          ) &&
          needs.authorize-manual-production.result == 'success'
        ) ||
        (
          github.run_attempt == 1 &&
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (
            github.event.workflow_run.event == 'push' ||
            github.event.workflow_run.event == 'workflow_dispatch'
          )
        )
      )
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' || github.run_attempt > 1) && 'production-emergency' || 'production-automatic' }}
    concurrency:
      group: deploy-master
      cancel-in-progress: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || inputs.approved_sha }}

    - name: Validate upstream workflow identity
      if: github.event_name == 'workflow_run'
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
      run: |
        set -euo pipefail
        trusted_workflow_id="$(
          gh api "repos/$REPO/actions/workflows/production-build.yml" --jq '.id'
        )"
        read -r workflow_id workflow_path event head_sha head_branch head_repository status conclusion <<<"$(
          gh api "repos/$REPO/actions/runs/$UPSTREAM_RUN_ID" \
            --jq '[.workflow_id,.path,.event,.head_sha,.head_branch,.head_repository.full_name,.status,.conclusion] | @tsv'
        )"
        [ "$workflow_id" = "$trusted_workflow_id" ]
        [ "$workflow_path" = ".github/workflows/production-build.yml" ]
        [ "$event" = "push" ] || [ "$event" = "workflow_dispatch" ]
        [ "$head_sha" = "${{ github.event.workflow_run.head_sha }}" ]
        [ "$head_branch" = "master" ]
        [ "$head_repository" = "$REPO" ]
        [ "$status" = "completed" ]
        [ "$conclusion" = "success" ]

    - name: Resolve deploy image tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_run" ]; then
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          echo "UPSTREAM_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          echo "UPSTREAM_EVENT=${{ github.event.workflow_run.event }}" >> "$GITHUB_ENV"
        else
          echo "IMAGE_TAG=${{ inputs.approved_sha }}" >> "$GITHUB_ENV"
          echo "UPSTREAM_RUN_ID=manual" >> "$GITHUB_ENV"
          echo "UPSTREAM_EVENT=workflow_dispatch" >> "$GITHUB_ENV"
        fi

    - name: Reject stale automatic deploy
      if: github.event_name == 'workflow_run' && github.run_attempt == 1
      run: |
        set -euo pipefail
        git fetch origin master
        current_master="$(git rev-parse origin/master)"
        [ "$IMAGE_TAG" = "$current_master" ] || {
          echo "Refusing stale automatic deploy image_sha=$IMAGE_TAG current_master=$current_master" >&2
          exit 1
        }

    - name: Record deploy provenance
      run: |
        mkdir -p artifacts/deploy-provenance
        printf '%s\n' \
          "image_sha=$IMAGE_TAG" \
          "upstream_run_id=$UPSTREAM_RUN_ID" \
          "upstream_event=$UPSTREAM_EVENT" \
          > artifacts/deploy-provenance/provenance.txt

    - name: Upload deploy provenance
      uses: actions/upload-artifact@v4
      with:
        name: deploy-provenance-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/deploy-provenance/provenance.txt
        if-no-files-found: error

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set AKS context
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ env.RESOURCE_GROUP }}
        cluster-name: ${{ env.CLUSTER_NAME }}

    - name: DB safety guardrails
      run: |
        set -euo pipefail
        mongo_pvc_count="$(kubectl get pvc -n default --no-headers 2>/dev/null | awk '/mongo/ {c++} END {print c+0}')"
        if [ "$mongo_pvc_count" -lt 8 ]; then
          echo "Expected at least 8 mongo PVCs, found $mongo_pvc_count. Aborting deploy to avoid unsafe DB state."
          exit 1
        fi
        kubectl get pvc -n default --no-headers | awk '/mongo/ {print $1, $2, $3}'

    - name: Apply Kubernetes manifests
      run: |
        set -euo pipefail
        # Apply cert-manager ClusterIssuer first (CRDs installed by provision.sh)
        kubectl apply -f infra/k8s-prod/cert-issuer.yaml

        # Apply shared infrastructure without changing app Deployments.
        while IFS= read -r -d '' manifest; do
          kubectl apply -f "$manifest"
        done < <(
          find infra/k8s -maxdepth 1 -type f \
            \( -name '*.yaml' -o -name '*.yml' \) \
            ! -name 'auth-depl.yaml' \
            ! -name 'bet-depl.yaml' \
            ! -name 'backoffice-depl.yaml' \
            ! -name 'client-depl.yaml' \
            ! -name 'event-depl.yaml' \
            ! -name 'gamemaster-depl.yaml' \
            ! -name 'moderation-depl.yaml' \
            ! -name 'resulting-depl.yaml' \
            ! -name 'slip-depl.yaml' \
            -print0
        )

        # Apply and roll out one app at a time to avoid concurrent image pulls.
        rollouts=(
          'auth-depl.yaml|gaming-auth-depl|gaming-auth|stanvasilyev/gaming_auth'
          'bet-depl.yaml|gaming-bet-depl|gaming-bet|stanvasilyev/gaming_bet'
          'backoffice-depl.yaml|gaming-backoffice-depl|gaming-backoffice|stanvasilyev/gaming_backoffice'
          'client-depl.yaml|gaming-client-depl|gaming-client|stanvasilyev/gaming_client'
          'event-depl.yaml|gaming-event-depl|gaming-event|stanvasilyev/gaming_event'
          'gamemaster-depl.yaml|gaming-gamemaster-depl|gaming-gamemaster|stanvasilyev/gaming_gamemaster'
          'moderation-depl.yaml|gaming-moderation-depl|gaming-moderation|stanvasilyev/gaming_moderation'
          'resulting-depl.yaml|gaming-resulting-depl|gaming-resulting|stanvasilyev/gaming_resulting'
          'slip-depl.yaml|gaming-slip-depl|gaming-slip|stanvasilyev/gaming_slip'
        )
        for rollout in "${rollouts[@]}"; do
          IFS='|' read -r manifest deployment container image <<< "$rollout"
          manifest_path="infra/k8s/${manifest}"
          # Each app file contains a Deployment followed by its Service.
          {
            kubectl set image \
              -f <(sed -n '1,/^---[[:space:]]*$/p' "$manifest_path") \
              "${container}=${image}:${IMAGE_TAG}" --local -o yaml
            sed -n '/^---[[:space:]]*$/,$p' "$manifest_path"
          } | kubectl apply -f -
          kubectl rollout status "deployment/${deployment}" --timeout=5m
        done

        # Apply prod-specific ingress (TLS + domain)
        kubectl apply -f infra/k8s-prod/ingress-srv.yaml
        # Apply prod HTTPS fallback ingress for immediate trusted cert validation
        kubectl apply -f infra/k8s-prod/ingress-srv-nip.yaml

    - name: Confirm final deployment readiness
      run: |
        set -euo pipefail
        deployments=(
          gaming-auth-depl
          gaming-bet-depl
          gaming-backoffice-depl
          gaming-client-depl
          gaming-event-depl
          gaming-gamemaster-depl
          gaming-moderation-depl
          gaming-resulting-depl
          gaming-slip-depl
        )
        for deployment in "${deployments[@]}"; do
          kubectl wait --for=condition=Available "deployment/${deployment}" --timeout=1m
          images="$(
            kubectl get deployment "$deployment" \
              -o jsonpath='{.spec.template.spec.containers[*].image}'
          )"
          grep -Eq "(^|[[:space:]])[^[:space:]]+:${IMAGE_TAG}([[:space:]]|$)" <<<"$images" || {
            echo "$deployment does not use exact image SHA $IMAGE_TAG: $images" >&2
            exit 1
          }
        done
        kubectl get deployments "${deployments[@]}"

    - name: Install E2E test dependencies
      run: |
        cd client && npm ci
        npx playwright install --with-deps chromium

    - name: Post-deploy validation loop
      id: post_deploy_validation
      run: ./infra/azure/agents/deploy-validation-loop-stan.sh
      env:
        DOMAIN: ${{ env.APP_DOMAIN }}
        CERT_NAME: ${{ env.APP_CERT_NAME }}
        E2E_BASE_URL: ${{ env.APP_E2E_BASE_URL }}
        MAX_ATTEMPTS: ${{ env.DEPLOY_VALIDATION_ATTEMPTS }}
        SLEEP_SECONDS: ${{ env.DEPLOY_VALIDATION_SLEEP_SECONDS }}
        VALIDATION_MAX_LOOPS: ${{ env.DEPLOY_VALIDATION_MAX_LOOPS }}
        VALIDATION_SLEEP_SECONDS: ${{ env.DEPLOY_VALIDATION_LOOP_SLEEP_SECONDS }}
        OUTPUT_DIR: artifacts/deploy-validation

    - name: Upload deploy diagnostics
      if: always() && steps.post_deploy_validation.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: deploy-validation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: artifacts/deploy-validation
        if-no-files-found: ignore
