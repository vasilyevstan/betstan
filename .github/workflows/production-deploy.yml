name: production-deploy
run-name: deploy ${{ inputs.approved_sha }}

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact current master commit SHA approved for production
        required: true
        type: string
      build_run_id:
        description: Successful first-attempt production-build run for the approved SHA
        required: true
        type: string

env:
  IMAGE_TAG: ${{ inputs.approved_sha }}
  BUILD_RUN_ID: ${{ inputs.build_run_id }}
  RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
  CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}
  APP_DOMAIN: ${{ vars.APP_DOMAIN || 'betstan.xyz' }}
  APP_CERT_NAME: ${{ vars.APP_CERT_NAME || 'betstan-tls' }}
  APP_E2E_BASE_URL: ${{ vars.APP_E2E_BASE_URL || 'https://betstan.xyz' }}
  DEPLOY_VALIDATION_ATTEMPTS: ${{ vars.DEPLOY_VALIDATION_ATTEMPTS || '3' }}
  DEPLOY_VALIDATION_SLEEP_SECONDS: ${{ vars.DEPLOY_VALIDATION_SLEEP_SECONDS || '30' }}
  DEPLOY_VALIDATION_MAX_LOOPS: ${{ vars.DEPLOY_VALIDATION_MAX_LOOPS || '3' }}
  DEPLOY_VALIDATION_LOOP_SLEEP_SECONDS: ${{ vars.DEPLOY_VALIDATION_LOOP_SLEEP_SECONDS || '20' }}
  SHARED_MONGO_LOCK_TOKEN: production-deploy-${{ github.run_id }}-${{ github.run_attempt }}
  SHARED_MONGO_LOCK_OPERATION: production-deploy-${{ github.run_id }}-${{ github.run_attempt }}

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production-emergency
    concurrency:
      group: deploy-master
      cancel-in-progress: false

    steps:
      - name: Checkout approved master commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.approved_sha }}
          fetch-depth: 0

      - name: Validate exact SHA and trusted build run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$GITHUB_REF_NAME" = "master" ] || {
            echo "Production deploys must be dispatched from master" >&2
            exit 1
          }
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Use the complete lowercase commit SHA" >&2
            exit 1
          }
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "Build run ID must be a positive integer" >&2
            exit 1
          }
          git fetch --quiet origin master:refs/remotes/origin/master
          current_master="$(git rev-parse origin/master)"
          [ "$IMAGE_TAG" = "$GITHUB_SHA" ] && [ "$IMAGE_TAG" = "$current_master" ] || {
            echo "Approved SHA must equal the selected and current master tip" >&2
            exit 1
          }

          trusted_workflow_id="$(
            gh api "repos/$REPO/actions/workflows/production-build.yml" --jq '.id'
          )"
          read -r workflow_id workflow_path event head_sha head_branch head_repository status conclusion run_attempt <<<"$(
            gh api "repos/$REPO/actions/runs/$BUILD_RUN_ID/attempts/1" \
              --jq '[.workflow_id,.path,.event,.head_sha,.head_branch,.head_repository.full_name,.status,.conclusion,.run_attempt] | @tsv'
          )"
          [ "$workflow_id" = "$trusted_workflow_id" ]
          [ "$workflow_path" = ".github/workflows/production-build.yml" ]
          [ "$event" = "push" ]
          [ "$head_sha" = "$IMAGE_TAG" ]
          [ "$head_branch" = "master" ]
          [ "$head_repository" = "$REPO" ]
          [ "$status" = "completed" ]
          [ "$conclusion" = "success" ]
          [ "$run_attempt" = "1" ]

      - name: Download immutable image provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/build-provenance artifacts/deploy-provenance
          gh run download "$BUILD_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "image-provenance-*-${BUILD_RUN_ID}-1" \
            --dir artifacts/build-provenance
          python3 infra/azure/agents/image_provenance_stan.py \
            --directory artifacts/build-provenance \
            --image-sha "$IMAGE_TAG" \
            --build-run-id "$BUILD_RUN_ID" \
            --build-run-attempt 1 \
            --output artifacts/deploy-provenance/images.tsv

      - name: Record deploy provenance
        run: |
          printf '%s\n' \
            "image_sha=$IMAGE_TAG" \
            "upstream_run_id=$BUILD_RUN_ID" \
            "upstream_event=push" \
            "upstream_run_attempt=1" \
            > artifacts/deploy-provenance/provenance.txt

      - name: Upload deploy provenance
        uses: actions/upload-artifact@v4
        with:
          name: deploy-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deploy-provenance
          if-no-files-found: error

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: DB safety guardrails
        run: |
          NAMESPACE=default \
          LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
          OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
          SOURCE_SHA="$IMAGE_TAG" \
            ./infra/azure/agents/shared-mongo-operation-lock-stan.sh acquire
          ./infra/azure/agents/shared-mongo-topology-guard-stan.sh

      - name: Apply Kubernetes manifests and immutable images
        run: |
          set -euo pipefail
          kubectl apply -f infra/k8s-prod/cert-issuer.yaml

          while IFS= read -r -d '' manifest; do
            kubectl apply -f "$manifest"
          done < <(
            find infra/k8s -maxdepth 1 -type f \
              \( -name '*.yaml' -o -name '*.yml' \) \
              ! -name 'auth-depl.yaml' \
              ! -name 'bet-depl.yaml' \
              ! -name 'backoffice-depl.yaml' \
              ! -name 'client-depl.yaml' \
              ! -name 'event-depl.yaml' \
              ! -name 'gamemaster-depl.yaml' \
              ! -name 'moderation-depl.yaml' \
              ! -name 'resulting-depl.yaml' \
              ! -name 'slip-depl.yaml' \
              -print0
          )

          declare -A immutable_images
          while IFS=$'\t' read -r service _repository image_ref _digest; do
            immutable_images["$service"]="$image_ref"
          done < artifacts/deploy-provenance/images.tsv

          rollouts=(
            'auth|auth-depl.yaml|gaming-auth-depl|gaming-auth'
            'bet|bet-depl.yaml|gaming-bet-depl|gaming-bet'
            'backoffice|backoffice-depl.yaml|gaming-backoffice-depl|gaming-backoffice'
            'client|client-depl.yaml|gaming-client-depl|gaming-client'
            'event|event-depl.yaml|gaming-event-depl|gaming-event'
            'gamemaster|gamemaster-depl.yaml|gaming-gamemaster-depl|gaming-gamemaster'
            'moderation|moderation-depl.yaml|gaming-moderation-depl|gaming-moderation'
            'resulting|resulting-depl.yaml|gaming-resulting-depl|gaming-resulting'
            'slip|slip-depl.yaml|gaming-slip-depl|gaming-slip'
          )
          for rollout in "${rollouts[@]}"; do
            IFS='|' read -r service manifest deployment container <<<"$rollout"
            image_ref="${immutable_images[$service]:-}"
            [ -n "$image_ref" ] || {
              echo "Missing immutable image for $service" >&2
              exit 1
            }
            manifest_path="infra/k8s/${manifest}"
            {
              kubectl set image \
                -f <(sed -n '1,/^---[[:space:]]*$/p' "$manifest_path") \
                "${container}=${image_ref}" --local -o yaml
              sed -n '/^---[[:space:]]*$/,$p' "$manifest_path"
            } | kubectl apply -f -
            kubectl rollout status "deployment/${deployment}" --timeout=5m
          done

          kubectl apply -f infra/k8s-prod/ingress-srv.yaml
          kubectl delete \
            ingress/gaming-ingress-service-nip \
            certificate/betstan-nip-tls \
            secret/betstan-nip-tls \
            --namespace default \
            --ignore-not-found

      - name: Confirm exact deployed images and readiness
        run: |
          set -euo pipefail
          deployments=()
          while IFS=$'\t' read -r service _repository image_ref digest; do
            deployment="gaming-${service}-depl"
            container="gaming-${service}"
            deployments+=("$deployment")
            kubectl wait --for=condition=Available "deployment/${deployment}" --timeout=1m

            deployed_ref="$(
              kubectl get deployment "$deployment" -o json |
                jq -r --arg container "$container" \
                  '.spec.template.spec.containers[] | select(.name == $container) | .image'
            )"
            [ "$deployed_ref" = "$image_ref" ] || {
              echo "$deployment uses $deployed_ref, expected $image_ref" >&2
              exit 1
            }

            ready_pods=0
            while IFS=$'\t' read -r pod ready image_id; do
              [ "$ready" = "true" ] || {
                echo "$pod container $container is not ready" >&2
                exit 1
              }
              [[ "$image_id" =~ @sha256:[0-9a-f]{64}$ ]] || {
                echo "$pod returned an invalid image ID: $image_id" >&2
                exit 1
              }
              ready_pods=$((ready_pods + 1))
            done < <(
              kubectl get pods -l "app=${container}" -o json |
                jq -r --arg container "$container" '
                  .items[]
                  | select(.metadata.deletionTimestamp == null)
                  | .metadata.name as $pod
                  | .status.containerStatuses[]?
                  | select(.name == $container)
                  | [$pod, (.ready | tostring), .imageID]
                  | @tsv
                '
            )
            [ "$ready_pods" -gt 0 ] || {
              echo "No serving pods found for $deployment" >&2
              exit 1
            }
            echo "$deployment requested_digest=$digest serving_pods=$ready_pods"
          done < artifacts/deploy-provenance/images.tsv
          kubectl get deployments "${deployments[@]}"

      - name: Install E2E test dependencies
        run: |
          cd client && npm ci
          npx playwright install --with-deps chromium

      - name: Post-deploy validation loop
        id: post_deploy_validation
        run: ./infra/azure/agents/deploy-validation-loop-stan.sh
        env:
          DOMAIN: ${{ env.APP_DOMAIN }}
          CERT_NAME: ${{ env.APP_CERT_NAME }}
          E2E_BASE_URL: ${{ env.APP_E2E_BASE_URL }}
          MAX_ATTEMPTS: ${{ env.DEPLOY_VALIDATION_ATTEMPTS }}
          SLEEP_SECONDS: ${{ env.DEPLOY_VALIDATION_SLEEP_SECONDS }}
          VALIDATION_MAX_LOOPS: ${{ env.DEPLOY_VALIDATION_MAX_LOOPS }}
          VALIDATION_SLEEP_SECONDS: ${{ env.DEPLOY_VALIDATION_LOOP_SLEEP_SECONDS }}
          OUTPUT_DIR: artifacts/deploy-validation

      - name: Upload deploy diagnostics
        if: always() && steps.post_deploy_validation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-validation-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/deploy-validation
          if-no-files-found: ignore

      - name: Release database operation lock
        if: always()
        run: |
          if [[ -x ./infra/azure/agents/shared-mongo-operation-lock-stan.sh ]]; then
            NAMESPACE=default \
            LOCK_TOKEN="$SHARED_MONGO_LOCK_TOKEN" \
            OPERATION_ID="$SHARED_MONGO_LOCK_OPERATION" \
            SOURCE_SHA="$IMAGE_TAG" \
              ./infra/azure/agents/shared-mongo-operation-lock-stan.sh release
          fi
