name: tests-moderation

on:
  pull_request:
    paths:
      - "moderation/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: cd moderation && npm install && npm run test:ci
