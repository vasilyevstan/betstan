apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaming-backoffice-depl
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gaming-backoffice
  template:
    metadata:
      labels:
        app: gaming-backoffice
    spec:
      containers:
        - name: gaming-backoffice
          image: stanvasilyev/gaming_backoffice
          livenessProbe:
            initialDelaySeconds: 1800
            periodSeconds: 900
            tcpSocket:
              port: 3000
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            tcpSocket:
              port: 3000
          # image: us.gcr.io/gaming-node-js-course/gaming_auth
          env:
            - name: MONGO_URI
              value: "mongodb://gaming-shared-mongo-srv:27017/gaming_backoffice"
            - name: RABBITMQ_URI
              value: "amqp://gaming-rabbitmq-srv"
            # Preserve image-only rollback compatibility with protected Backoffice releases.
            - name: AUTH_SERVICE_URL
              value: "http://gaming-auth-srv:3000"
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: gaming-jwt-secret
                  key: JWT_KEY
            - name: CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
---
apiVersion: v1
kind: Service
metadata:
  name: gaming-backoffice-srv
spec:
  type: ClusterIP
  selector:
    app: gaming-backoffice
  ports:
    - name: gaming-backoffice
      protocol: TCP
      port: 3000
      targetPort: 3000
