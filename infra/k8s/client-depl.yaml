apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaming-client-depl
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gaming-client
  template:
    metadata:
      labels:
        app: gaming-client
    spec:
      containers:
        - name: gaming-client
          image: stanvasilyev/gaming_client
          readinessProbe:
            initialDelaySeconds: 5
            periodSeconds: 5
            tcpSocket:
              port: 3000
          livenessProbe:
            initialDelaySeconds: 30
            periodSeconds: 30
            tcpSocket:
              port: 3000
          env:
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: gaming-client-srv
spec:
  type: ClusterIP
  selector:
    app: gaming-client
  ports:
    - name: gaming-client
      protocol: TCP
      port: 3000
      targetPort: 3000
