apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaming-event-depl
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gaming-event
  template:
    metadata:
      labels:
        app: gaming-event
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: gaming-event
          image: stanvasilyev/gaming_event
          startupProbe:
            failureThreshold: 60
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            tcpSocket:
              port: 3000
          livenessProbe:
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 3
            tcpSocket:
              port: 3000
          readinessProbe:
            failureThreshold: 2
            periodSeconds: 5
            timeoutSeconds: 2
            tcpSocket:
              port: 3000
          # image: us.gcr.io/gaming-node-js-course/gaming_auth
          env:
            - name: MONGO_URI
              value: "mongodb://gaming-shared-mongo-srv:27017/gaming_event"
            - name: AUTH_SERVICE_URL
              value: "http://gaming-auth-srv:3000"
            - name: RABBITMQ_URI
              value: "amqp://gaming-rabbitmq-srv"
            - name: EVENT_PUBLIC_SSE_MAX_CONNECTIONS
              value: "250"
            - name: CLIENT_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: gaming-event-srv
spec:
  type: ClusterIP
  selector:
    app: gaming-event
  ports:
    - name: gaming-event
      protocol: TCP
      port: 3000
      targetPort: 3000
