apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../infra/k8s/auth-depl.yaml
  - ../../../infra/k8s/bet-depl.yaml
  - ../../../infra/k8s/backoffice-depl.yaml
  - ../../../infra/k8s/client-depl.yaml
  - ../../../infra/k8s/event-depl.yaml
  - ../../../infra/k8s/gamemaster-depl.yaml
  - ../../../infra/k8s/moderation-depl.yaml
  - ../../../infra/k8s/resulting-depl.yaml
  - ../../../infra/k8s/slip-depl.yaml
  - ../../../infra/k8s/rabbitmq-depl.yaml
  - ../../../infra/k8s/auth-mongo-depl.yaml
  - mongo-storage.yaml
  - cert-issuer.yaml
  - ingress.yaml
images:
  - name: mongo
    newName: docker.io/library/mongo
    digest: sha256:3d715950d83061ff2fbc910d12d3703212538cacf6b3003e3736fa5c7f51a2e1
  - name: rabbitmq
    newName: docker.io/library/rabbitmq
    digest: sha256:6033d0c2f4e9eb49dda9623067a96d317bc7b550513bd18532fbd3cd9a941c1b
patches:
  - path: patches/mongo-storage.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: gaming-auth-mongo-depl
  - path: patches/resources.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: gaming-(auth|bet|backoffice|event|gamemaster|moderation|resulting|slip)-depl
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gaming-client-depl
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/arch: arm64
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: gaming-rabbitmq-depl
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/arch: arm64
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 150m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          exec:
            command: [rabbitmq-diagnostics, -q, ping]
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          exec:
            command: [rabbitmq-diagnostics, -q, ping]
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: gaming-auth-mongo-depl
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/arch: arm64
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value:
          exec:
            command:
              - mongosh
              - --quiet
              - --eval
              - db.adminCommand({ping:1}).ok
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value:
          exec:
            command:
              - mongosh
              - --quiet
              - --eval
              - db.adminCommand({ping:1}).ok
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
